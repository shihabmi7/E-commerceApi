thout multi-arch, an image built on an Intel/AMD CI runner won't run on an Apple Silicon Mac or an ARM-based cloud instance (AWS Graviton) without emulation. This repo's CI doesn't currently set `--platform`, so it builds for the runner's own architecture (amd64) only \u2014 worth knowing as the next natural improvement if the image needs to run on ARM infrastructure.\n\n## 31. Walk through what happens in this repo's CI pipeline, from `git push` to a running container.\n`.github/workflows/docker-ci-cd.yml`, on a push/PR to `main`:\n```\n1. test job:        checkout \u2192 set up JDK 17 \u2192 ./mvnw test -Dspring.profiles.active=test\n2. docker-build-and-push job (needs: test, so it only runs if tests pass):\n     checkout \u2192 docker/setup-buildx-action \u2192 docker/login-action (Docker Hub)\n     \u2192 docker/build-push-action (builds the Dockerfile, tags :latest, pushes to Docker Hub)\n```\nNote this is CI (build/test/publish the image) but **not CD** in the \"auto-deploy\" sense despite the workflow's name \u2014 nothing in this workflow actually applies the `k8s/` manifests or restarts a running deployment; the image is published and ready to be pulled, but rolling it out to an actual cluster would need a separate step (`kubectl set image` / `kubectl apply` / an ArgoCD sync, etc.) that isn't part of this file today.\n\n## 32. What is cloud-native development?\nAn approach to building and running applications designed from the start to run well in dynamic, distributed, cloud environments \u2014 rather than a traditional app just lifted onto a cloud VM unchanged. The commonly cited pillars: **containerization** (Docker \u2014 package once, run identically anywhere), **microservices** (independently deployable services, `microservices-communication-questions.md`), **dynamic orchestration** (Kubernetes managing scaling/healing/scheduling, Q33), and **CI/CD automation** (Q31's pipeline \u2014 build, test, and ship automatically, repeatedly, without manual steps). This repo touches every one of these: it's containerized (`Dockerfile`), has a CI pipeline (`docker-ci-cd.yml`), and has Kubernetes manifests (`k8s/`) ready to deploy it as an orchestrated workload.\n\n## 33. Why do you need an orchestrator like Kubernetes on top of Docker?\nDocker (and docker-compose) runs containers on **one machine**. An orchestrator answers the questions that appear the moment you have many containers across many machines: which machine runs which container, what happens when a container crashes (restart it \u2014 automatically, without a human), how do you roll out a new version without downtime, how do you scale from 1 to 10 replicas on demand, and how do services find each other across machines whose IPs change constantly. Kubernetes' `Deployment` (Q35) + `Service` (Q36) objects are exactly the abstractions that answer these \u2014 this repo's own `k8s/app/ecommerce_deployment.yaml` + `ecommerce_service.yaml` are a (currently minimal, single-replica) example of exactly this.\n\n## 34. What is a Kubernetes Pod, and how does it relate to a Docker container?\nA Pod is Kubernetes' smallest deployable unit \u2014 usually wrapping **one** container (this repo's `ecommerce` container is the only one in its Pod template), though a Pod can hold multiple tightly-coupled containers that must share the same network namespace and lifecycle (a \"sidecar,\" e.g. a log-shipper next to the main app). Kubernetes never schedules a bare container directly \u2014 it always schedules Pods, and Docker (or another container runtime) is just the engine Kubernetes calls underneath to actually run the container(s) inside that Pod.\n\n## 35. Deployment vs. Pod vs. ReplicaSet \u2014 how do they relate?\n```\nDeployment  (you manage this \u2014 desired state: \"run this image, this many replicas\")\n    \u2502  creates/manages\n    \u25bc\nReplicaSet  (ensures exactly N Pods matching a label selector exist, replaces any that die)\n    \u2502  creates/manages\n    \u25bc\nPod(s)      (the actual running container(s))\n```\nYou essentially never create a Pod or ReplicaSet directly \u2014 you declare a `Deployment` (like this repo's `ecommerce_deployment.yaml`, `replicas: 1`), and Kubernetes creates a `ReplicaSet` to satisfy it, which in turn creates the Pod(s). If a Pod crashes, the ReplicaSet notices the count has dropped below what the Deployment asked for and creates a replacement \u2014 this is the self-healing Q33 references, and it's also what makes a rolling update work: a new `Deployment` spec creates a *new* ReplicaSet alongside the old one, gradually shifting Pods from old to new.\n\n## 36. What is a Kubernetes Service, and why can't Pods be reached directly?\nPods are ephemeral \u2014 they get a new IP every time they're recreated (a crash, a rollout, a reschedule), so nothing should ever hardcode a Pod's IP. A `Service` gives a **stable** virtual IP/DNS name that load-balances traffic across whichever Pods currently match its label selector, regardless of how many times those Pods have been recreated underneath it.\n```yaml\n# k8s/app/ecommerce_service.yaml (this repo, abbreviated)\napiVersion: v1\nkind: Service\nspec:\n  type: NodePort              # exposes it on a fixed port on every node, not just inside the cluster\n  selector:\n    app: ecommerce             # matches the Deployment's Pod label\n  ports:\n    - port: 8080                # the Service's own port, reachable inside the cluster\n      targetPort: 8080          # the container port in the Pod\n      nodePort: 30036           # reachable from outside the cluster at <node-ip>:30036\n```\nOther in-cluster services (or an Ingress) talk to `ecommerce-service:8080`, never to an individual Pod's IP \u2014 exactly the same DNS-by-name idea as docker-compose service names (Q14), just at cluster scale instead of one host. This repo specifically uses `NodePort` (rather than the more common `ClusterIP`, which is cluster-internal only) so the app is also reachable directly from outside the cluster without needing a separate Ingress/LoadBalancer set up \u2014 a reasonable choice for a simple/dev setup, though a real production deployment would more typically put an Ingress or LoadBalancer Service in front instead.\n\n## 37. ConfigMap vs. Secret in Kubernetes \u2014 what's the difference?\nBoth inject configuration into a Pod as env vars or mounted files, without baking values into the image. A **ConfigMap** is for non-sensitive config (a log level, a feature flag); a **Secret** is for sensitive values (passwords, API keys, tokens) \u2014 stored base64-encoded (not encrypted by default at rest, unless the cluster has encryption-at-rest configured) and access-controlled separately via RBAC. This repo's `k8s/app/ecommerce_secret.yaml` supplies the app's env vars this way:\n```yaml\n# ecommerce_deployment.yaml\nenvFrom:\n  - secretRef:\n      name: ecommerce-secret\n```\nThis repo's actual `ecommerce_secret.yaml` carries `MYSQL_USER`, `MYSQL_PASSWORD`, `RABBITMQ_USER`, `RABBITMQ_PASSWORD`, and `JWT_SECRET_KEY` (the last a placeholder value with a comment instructing you to generate a real one via `kubectl create secret` rather than editing the git-tracked file directly) \u2014 the Deployment manifest itself never contains a literal secret value, mirroring the same env-var-driven config approach as the local docker-compose setup (Q16).\n\n## 38. Liveness probe vs. readiness probe \u2014 and what's missing in this repo's deployment?\n- **Liveness probe**: \"is this container still alive/functioning?\" \u2014 if it fails repeatedly, Kubernetes **kills and restarts** the container.\n- **Readiness probe**: \"is this container ready to receive traffic *right now*?\" \u2014 if it fails, Kubernetes stops routing Service traffic to that Pod (Q36), but does **not** restart it; the Pod stays up and can become ready again later (e.g. still warming up a cache).\n```yaml\nlivenessProbe:\n  httpGet: { path: /actuator/health/liveness, port: 8080 }\nreadinessProbe:\n  httpGet: { path: /actuator/health/readiness, port: 8080 }\n```\nThis repo's `k8s/app/ecommerce_deployment.yaml` has **neither** \u2014 meaning Kubernetes has no way to know if the app has actually finished starting (traffic could be routed to a Pod before Spring Boot has finished initializing), and no way to detect a hung/deadlocked-but-still-running JVM and automatically restart it. Adding both is one of the most impactful small changes this deployment is missing, and it's what a rolling update or a graceful shutdown (referenced in the MCQ file's Q76) actually needs to coordinate against.\n\n## 39. The Twelve-Factor App methodology \u2014 which factors does this repo already follow?\nA widely-referenced set of practices for building cloud-native, horizontally-scalable apps. A few, checked against this repo directly:\n- **III. Config in the environment** \u2014 \u2705 `JWT_SECRET_KEY`, DB credentials, RabbitMQ host all come from env vars (`application.properties` uses `${...}` placeholders, Q16), never hardcoded.\n- **VI. Processes are stateless** \u2014 \u2705 this app keeps no in-memory session state between requests; auth is a stateless JWT (see `jpa-fetching-questions.md`/security notes), so any replica can serve any request.\n- **V. Strictly separate build and run stages** \u2014 \u2705 exactly what the multi-stage Dockerfile (Q5) does: build once, run the same artifact everywhere.\n- **XI. Logs as event streams** \u2014 \u2705 the app logs to stdout/stderr (`docker logs`, Q20 picks it up directly) rather than managing its own log files.\n- **IX. Disposability \u2014 fast startup, graceful shutdown** \u2014 \u26a0\ufe0f partial: Spring Boot 3.4's graceful shutdown default helps, but without a readiness probe (Q38) or `terminationGracePeriodSeconds` set in the Deployment, Kubernetes can't fully coordinate a clean rollout.\n\n## 40. Horizontal scaling in Kubernetes \u2014 what can break if you just bump `replicas` without checking the app first?\n`replicas: 3` in a `Deployment` is easy to change, but it doesn't make an app horizontally scalable on its own \u2014 it just runs more copies of whatever the app already is, including whatever *isn't* actually shared correctly. Two concrete failure modes, both already covered elsewhere in these notes:\n- **Database connection exhaustion**: each Pod gets its own connection pool (HikariCP default of 10, `relational-db-basics.md` Q26/Q40) \u2014 `replicas x pool size` must stay under Postgres's `max_connections`, or new Pods start failing to connect the moment you scale out.\n- **Per-instance state that should be shared**: an in-memory rate limiter or cache counted *per pod* effectively multiplies its limit by the replica count, since each Pod tracks its own count independently (the same shape of bug as the MCQ file's Q80) \u2014 anything meant to be a single, global limit has to live in a shared store (Redis) instead of a JVM field, or it silently stops meaning what it's supposed to mean the moment there's more than one replica.\n\nThis repo's `k8s/app/ecommerce_deployment.yaml` currently runs `replicas: 1` \u2014 scaling it up is a one-line change, but doing so safely means first confirming nothing in the app (or its Hikari pool sizing) implicitly assumed \"there's only ever one of me.\"\n"}, {"id": "concurrency", "title": "Java concurrency", "group": "Java", "path": "interview-questions/java/java-concurrency-questions.md", "q": 24, "lines": 263, "md": "# Java Concurrency & Multithreading \u2014 Interview Questions\n\n24 questions on thread safety, locking, thread pools, and async patterns in Java. Grounded where possible in this repo's own code \u2014 the real race-condition bug fixed in `CartService.addToCart` (git history: `a426c6a`), and the singleton-bean scope of `JwtService`/every `@Service` in this app. Pairs with `relational-db-basics.md` (Q11 deadlock, Q1 MVCC) for the *database*-level side of concurrency, and the MCQ file's Q55-60 for the Spring/JPA-specific concurrency scenarios.\n\n## 1. What is a race condition?\nTwo or more threads access shared, mutable state at the same time, and the final result depends on the unpredictable order they happen to interleave in \u2014 code written as if \"check, then act\" always completes as one atomic step, when it actually doesn't.\n\n**Real bug, this repo:** `CartService.addToCart`, before the fix in commit `a426c6a`:\n```java\n// Thread 1 and Thread 2, running at the same time, for the same (user, product):\nOptional<Cart> existing = cartRepository.findByUserIdAndProductId(userId, productId);\n// BOTH threads see \"empty\" \u2014 neither has inserted yet\nif (existing.isEmpty()) {\n    cartRepository.save(new Cart(...));   // BOTH insert \u2014 two separate rows for the same product\n}\n```\nThis is the classic **check-then-act** race: the check and the act are two separate steps, and nothing stops another thread from running its own check in the gap between this thread's check and its act. See Q9 for why `synchronized` alone doesn't fix this particular bug, and `jpa-fetching-questions.md`/the MCQ file for the actual fix (a DB-level unique constraint).\n\n## 2. Process vs. thread \u2014 what's the actual difference?\nA **process** is an independent running program with its own memory space \u2014 two processes can't directly read each other's variables. A **thread** is a unit of execution *within* a process, and every thread in the same process **shares** that process's heap memory (objects, static fields) \u2014 which is exactly why race conditions (Q1) are possible: two threads can see and mutate the very same object.\n```\nProcess (JVM instance)\n \u251c\u2500\u2500 Thread 1 \u2500\u2510\n \u251c\u2500\u2500 Thread 2 \u2500\u253c\u2500\u25ba all share the same heap (objects, static fields)\n \u2514\u2500\u2500 Thread 3 \u2500\u2518   each has its OWN stack (local variables, call frames)\n```\nLocal variables are thread-safe by default (each thread's stack is private); instance/static fields are not, unless you make them so.\n\n## 3. What is thread safety, concretely?\nCode is thread-safe if it behaves correctly no matter how many threads call it concurrently, and no matter how their operations happen to interleave \u2014 without needing the caller to add any external synchronization. A method that only touches local variables is automatically thread-safe (Q2); a method that reads-then-writes a shared field is not, unless it takes explicit measures (locking, atomics, immutability) to make that read-then-write behave as one atomic unit.\n\n## 4. `synchronized` \u2014 method vs. block, and what does it actually lock?\n`synchronized` makes a block of code **mutually exclusive** \u2014 only one thread can be inside a given lock's protected region at a time; every other thread trying to enter blocks until the first one exits.\n```java\npublic synchronized void increment() { count++; }\n// equivalent to:\npublic void increment() {\n    synchronized (this) {   // locks on \"this\" \u2014 the instance\n        count++;\n    }\n}\n\npublic static synchronized void staticMethod() { ... }\n// equivalent to locking on ClassName.class (the Class object) \u2014 shared across ALL instances\n```\nAn instance method locks on `this` (so two threads calling `increment()` on the *same* object are serialized, but on two *different* objects they run in parallel, uncontended). A static method locks on the `Class` object itself \u2014 shared across every instance, a much wider lock. A `synchronized(someObject)` block lets you lock on any object explicitly \u2014 useful for locking a smaller, specific region rather than the whole method.\n\n## 5. Why wouldn't `synchronized` have fixed the `CartService.addToCart` race condition?\nBecause `synchronized` only coordinates threads **inside one JVM process**. This app runs as multiple pods/replicas (see `docker-cloud-native-questions.md` Q40, and the MCQ file's own Q58 asks this exact question) \u2014 each replica is its own JVM with its own, completely separate lock. Two concurrent \"add to cart\" requests landing on *different* pods would each acquire their *own* uncontended lock and race exactly as before.\n```\nPod 1's JVM: synchronized lock A  \u2500\u2510\n                                    \u251c\u2500  two DIFFERENT locks \u2014 no coordination between them at all\nPod 2's JVM: synchronized lock B  \u2500\u2518\n```\nThis is exactly why the real fix in this repo is a **database-level unique constraint** (Q1) rather than an in-JVM lock \u2014 the database is the one thing every replica genuinely shares, so it's the only place a cross-instance guarantee can actually live. `synchronized`/`ReentrantLock` (Q8) are the right tool only when every thread that could race is guaranteed to be in the same JVM.\n\n## 6. What does `volatile` actually guarantee?\n`volatile` guarantees **visibility** \u2014 a write to a `volatile` field by one thread is immediately visible to every other thread's next read of it, instead of a thread potentially reading a stale, cached copy from its own CPU core. It does **not** guarantee atomicity.\n```java\nprivate volatile boolean shuttingDown = false;\n\n// Thread A: shuttingDown = true;      // every other thread sees this immediately\n// Thread B: while (!shuttingDown) { doWork(); }   // reliably notices the flag flip\n\nprivate volatile int counter = 0;\n// counter++ is STILL NOT thread-safe with volatile \u2014 it's really\n// \"read counter, add 1, write counter\" \u2014 three steps, and two threads\n// can both read the same old value before either writes back (Q1's race, just here)\n```\n`volatile` is the right tool for a simple flag one thread sets and others just read (like a shutdown signal). For \"read-modify-write\" operations like `counter++`, you need an atomic class (Q7) or a lock (Q4/Q8), not just `volatile`.\n\n## 7. What are the atomic classes, and how do they avoid locking?\n`java.util.concurrent.atomic` (`AtomicInteger`, `AtomicLong`, `AtomicReference`, ...) provide lock-free, thread-safe read-modify-write operations, built on a CPU instruction called **compare-and-swap (CAS)**.\n```java\nAtomicInteger counter = new AtomicInteger(0);\ncounter.incrementAndGet();   // atomic \u2014 no race, no explicit lock taken\n\n// what CAS is actually doing under the hood, conceptually:\n// \"if the current value is still what I last read, swap it for the new value;\n//  if someone else changed it in the meantime, retry the whole operation\"\n```\nCAS is optimistic (much like `@Version` optimistic locking at the DB level, `relational-db-basics.md`) \u2014 instead of blocking other threads out (a lock), it just retries if it detects it was beaten to the write. For simple counters/flags, this is generally faster than `synchronized` under moderate contention, since no thread ever actually blocks/sleeps.\n\n## 8. `ReentrantLock` vs. `synchronized` \u2014 when would you reach for the explicit lock?\n`ReentrantLock` (`java.util.concurrent.locks`) does the same mutual-exclusion job as `synchronized`, but as an explicit object you call `.lock()`/`.unlock()` on, which unlocks a few things `synchronized` can't do:\n```java\nprivate final ReentrantLock lock = new ReentrantLock();\n\npublic void doWork() {\n    if (lock.tryLock()) {          // synchronized has NO equivalent \u2014 can't \"try and give up\"\n        try { /* critical section */ }\n        finally { lock.unlock(); }  // MUST unlock manually \u2014 synchronized does this automatically\n    } else {\n        // couldn't get the lock immediately \u2014 do something else instead of blocking forever\n    }\n}\n```\nConcretely, reach for `ReentrantLock` when you need: `tryLock()` (attempt without blocking, or with a timeout), interruptible lock acquisition, or fairness (`new ReentrantLock(true)` \u2014 first-come-first-served rather than the JVM picking an arbitrary waiting thread). The trade-off is that you must remember to `unlock()` in a `finally` block yourself \u2014 `synchronized` releases automatically even if an exception is thrown, so for the common case it's less error-prone.\n\n## 9. Deadlock at the thread level \u2014 the four conditions, and how it's avoided.\nTwo or more threads are each waiting on a lock the other one holds, so neither can ever proceed \u2014 the exact same *shape* of problem as `relational-db-basics.md` Q11's database deadlock, just between Java locks instead of database row locks. Classic four conditions (all must hold simultaneously for deadlock to occur): **mutual exclusion** (a lock can only be held by one thread), **hold and wait** (a thread holds one lock while waiting for another), **no preemption** (a lock can't be forcibly taken away), and **circular wait** (a cycle of threads each waiting on the next).\n```java\n// Thread 1                          // Thread 2\nsynchronized (lockA) {               synchronized (lockB) {\n    synchronized (lockB) { ... }         synchronized (lockA) { ... }   // deadlock if both reach here\n}                                     }\n```\nThe practical fix \u2014 exactly the same one from the database side (`relational-db-basics.md` Q11): **always acquire locks in the same, consistent global order.** If both threads always locked `lockA` before `lockB`, the cycle (circular wait) becomes structurally impossible.\n\n## 10. Livelock and thread starvation \u2014 how are they different from deadlock?\n- **Deadlock** (Q9): threads are stuck, doing nothing, waiting forever.\n- **Livelock**: threads are *not* stuck \u2014 they're actively running \u2014 but they keep responding to each other in a way that makes no real progress (two threads repeatedly \"politely\" yielding a resource to each other, forever, like two people stepping side to side trying to let each other pass in a hallway).\n- **Starvation**: a thread is perpetually denied access to a resource it needs, because other threads keep getting priority ahead of it (e.g. a low-priority thread that never gets CPU time, or a non-fair lock that keeps favoring recently-arrived threads over one that's been waiting a long time).\n\nAll three are \"concurrency made no progress\" bugs, but the symptom differs \u2014 deadlock shows as threads permanently `BLOCKED`/`WAITING`, livelock shows as threads burning CPU with no forward progress, starvation shows as one specific thread never getting its turn while everyone else does fine.\n\n## 11. Why is a Spring `@Service` singleton dangerous if it has a mutable field?\nEvery `@Service`/`@Component` bean is a **singleton** by default (`spring-boot-basic-questions.md` Q2, and the MCQ file's own Q9 asks this exact question about `JwtService`) \u2014 one shared instance, reused across every concurrent HTTP request. If that bean has a mutable instance field, *every request thread* is reading/writing the same field at once \u2014 a request-scoped-looking piece of state (something that feels like \"this request's data\") is actually **shared, global, racy state**.\n```java\n@Service\npublic class JwtService {\n    private String secretKey;   // set once at startup via @Value \u2014 fine, effectively read-only after init\n\n    // BAD if this existed: a mutable field set PER-REQUEST would be shared/racy across every\n    // concurrent request this singleton bean is currently handling:\n    // private String currentUserToken;   // request A and request B would stomp on each other's value\n}\n```\n`JwtService.secretKey` is safe specifically because it's set once (at construction/`@Value` injection time) and never mutated afterward \u2014 effectively immutable in practice. Any field that's meant to hold *per-request* data must be a local variable inside the method (each thread gets its own stack, Q2) \u2014 never an instance field on a singleton bean.\n\n## 12. Why use an `ExecutorService` instead of `new Thread()` per task?\nCreating a native OS thread is expensive (memory for its stack, OS scheduling overhead), and nothing stops unbounded `new Thread()` calls from creating thousands of them under load, exhausting the system. An `ExecutorService` manages a **pool** of reusable threads and a work queue \u2014 submitted tasks are picked up by whichever pooled thread is free, and the pool size caps how many run truly concurrently.\n```java\nExecutorService executor = Executors.newFixedThreadPool(10);\nexecutor.submit(() -> processOrder(orderId));   // runs on one of the 10 pooled threads\nexecutor.shutdown();   // stop accepting new tasks, let queued/running ones finish\n```\nThis is the same underlying idea as HikariCP connection pooling (`relational-db-basics.md` Q26/Q40) applied to threads instead of DB connections \u2014 reuse a bounded, managed set of expensive resources instead of creating a fresh one per unit of work.\n\n## 13. What are the common `ExecutorService` types, and their trade-offs?\n```java\nExecutors.newFixedThreadPool(10);    // fixed size N threads, unbounded queue \u2014 predictable resource usage\nExecutors.newCachedThreadPool();     // grows as needed, reuses idle threads, shrinks after 60s idle \u2014 risk: unbounded growth under sustained load\nExecutors.newSingleThreadExecutor(); // exactly 1 thread \u2014 tasks run strictly sequentially, still off the caller's thread\nExecutors.newScheduledThreadPool(2); // supports delayed/periodic tasks (scheduleAtFixedRate, etc.)\nExecutors.newWorkStealingPool();     // ForkJoinPool-backed; idle threads \"steal\" work from busy ones' queues \u2014 good for many small, independent tasks\n```\n`newCachedThreadPool()` is a common production trap: with no upper bound, a burst of slow tasks can spawn an unbounded number of threads and exhaust memory \u2014 a `newFixedThreadPool` (or a manually configured `ThreadPoolExecutor` with an explicit max size and queue capacity) gives you a hard ceiling instead, the same \"bound your resource usage\" principle as the bulkhead pattern (`microservices-communication-questions.md` Q18).\n\n## 14. `Future` vs. `CompletableFuture` \u2014 what does `CompletableFuture` add?\nA `Future` represents a value that will be available later, but reading it (`future.get()`) **blocks** the calling thread until it's ready \u2014 and you can't chain more work onto it without blocking. `CompletableFuture` (Java 8+) lets you compose async work **without blocking** at each step.\n```java\nFuture<PaymentDTO> future = executor.submit(() -> paymentClient.getPayment(orderId));\nPaymentDTO payment = future.get();   // BLOCKS the calling thread here\n\nCompletableFuture<PaymentDTO> cf = CompletableFuture.supplyAsync(() -> paymentClient.getPayment(orderId));\ncf.thenAccept(payment -> sendReceipt(payment));   // runs when ready \u2014 the calling thread never blocked at all\n```\n`CompletableFuture` is what actually makes \"fire off several independent calls and combine their results\" practical without tying up a thread per call waiting \u2014 see Q15.\n\n## 15. Composing `CompletableFuture`s \u2014 `thenApply`, `thenCompose`, `thenCombine`.\n```java\n// thenApply: transform the result (sync function, same \"stage\")\nCompletableFuture<String> nameOnly = getUser(id).thenApply(User::getName);\n\n// thenCompose: chain to ANOTHER async call that depends on this result (like flatMap)\nCompletableFuture<PaymentDTO> payment = getOrder(orderId)\n        .thenCompose(order -> getPayment(order.getPaymentId()));   // avoids CompletableFuture<CompletableFuture<...>>\n\n// thenCombine: run two INDEPENDENT async calls in parallel, combine both results\nCompletableFuture<OrderSummary> summary = getOrder(orderId)\n        .thenCombine(getShipping(orderId), (order, shipping) -> new OrderSummary(order, shipping));\n```\nThis maps directly onto the A\u2192B\u2192C chains in `microservices-communication-questions.md`: `thenCompose` is the async equivalent of \"B's result determines what C gets called with\" (a dependent, sequential chain), while `thenCombine` is \"call B and C at the same time, since neither depends on the other's result\" \u2014 genuinely running two downstream calls in parallel instead of one after another.\n\n## 16. `ConcurrentHashMap` vs. `synchronizedMap` vs. plain `HashMap` \u2014 what's the difference?\nPlain `HashMap` is not thread-safe at all \u2014 concurrent modification from multiple threads can corrupt its internal structure (not just \"wrong values,\" but genuinely broken data structure, infinite loops in old JDK versions). `Collections.synchronizedMap(new HashMap<>())` wraps every single method call in one lock on the whole map \u2014 correct, but every operation (even two unrelated `get()` calls) serializes on that one lock, killing concurrency. `ConcurrentHashMap` uses fine-grained internal locking (historically per-bucket/segment) so unrelated keys can be read/written concurrently without contending with each other \u2014 far better throughput under real concurrent load, and it's the default right answer for a shared, mutable map.\n```java\nMap<String, Integer> counts = new ConcurrentHashMap<>();\ncounts.merge(\"productId-5\", 1, Integer::sum);   // atomic read-modify-write, no external lock needed\n```\n\n## 17. `CopyOnWriteArrayList` \u2014 when is it the right (and wrong) choice?\nOn every **write** (add/remove), it copies the entire underlying array \u2014 so writes are expensive (O(n) copy every time), but **reads never need any lock at all** (they just read a stable, immutable snapshot array) and are never affected by concurrent writes. This makes it a good fit specifically for **read-heavy, write-rare** scenarios \u2014 e.g. a list of event listeners registered once at startup and iterated constantly afterward. It's a poor fit for anything with frequent writes (a shopping cart's line items, say) \u2014 you'd pay that full-array-copy cost on every single mutation.\n\n## 18. What is a `BlockingQueue`, and how does it implement the producer-consumer pattern?\nA queue where `take()` blocks the calling thread if the queue is empty (waiting for a producer to add something) and `put()` blocks if the queue is full (waiting for a consumer to make room) \u2014 the coordination between producers and consumers is built into the data structure itself, no manual `wait()`/`notify()` needed.\n```java\nBlockingQueue<Order> queue = new LinkedBlockingQueue<>(100);\n\n// Producer thread:\nqueue.put(newOrder);   // blocks if queue already has 100 orders waiting\n\n// Consumer thread:\nOrder order = queue.take();   // blocks until an order is available\nprocessOrder(order);\n```\nThis is the same conceptual shape as a message broker (Kafka/RabbitMQ, `kafka-questions.md`) \u2014 a producer and consumer decoupled by a buffer in between \u2014 just in-process and in-memory instead of across services over a network.\n\n## 19. `CountDownLatch` vs. `CyclicBarrier` vs. `Semaphore` \u2014 what does each coordinate?\n- **`CountDownLatch`**: one or more threads wait for N events to happen (counted down by other threads), then proceed \u2014 a **one-time** gate, can't be reset/reused.\n```java\nCountDownLatch latch = new CountDownLatch(3);\n// 3 worker threads each call latch.countDown() when done\nlatch.await();   // main thread blocks here until all 3 have finished\n```\n- **`CyclicBarrier`**: N threads all wait for **each other** to reach the same point, then all proceed together \u2014 and unlike `CountDownLatch`, it's **reusable** for repeated rounds.\n- **`Semaphore`**: limits how many threads can access a resource **concurrently** (a counting lock, not a strict mutual-exclusion lock \u2014 `new Semaphore(5)` lets up to 5 threads in at once, not just 1). This is the same idea as Resilience4j's semaphore-type bulkhead (`microservices-communication-questions.md` Q18), just as a raw Java primitive instead of a Spring annotation.\n\n## 20. `ThreadLocal` \u2014 what is it, and what's the leak gotcha with thread pools?\n`ThreadLocal<T>` gives each thread its own independent copy of a variable \u2014 reads/writes on one thread never see another thread's value, even though it's technically stored in one shared `ThreadLocal` object. Commonly used for per-request context that many layers need without passing it as a parameter everywhere (a trace ID, `microservices-communication-questions.md` Q10; the current authenticated user).\n```java\nprivate static final ThreadLocal<String> traceId = new ThreadLocal<>();\n\n// at the start of request handling:\ntraceId.set(UUID.randomUUID().toString());\n// ...deep in some other method, no parameter passing needed:\nlog.info(\"processing, trace={}\", traceId.get());\n```\n**The leak gotcha:** in a thread *pool* (Q12), threads are reused across many different tasks/requests. If you `set()` a `ThreadLocal` value and never `remove()` it, the next unrelated task that happens to run on that same pooled thread will see the *previous* task's stale value \u2014 a subtle, hard-to-reproduce bug (and a memory leak, since the value stays referenced as long as the thread lives). Always `remove()` in a `finally` block once you're done with it.\n\n## 21. Thread-safe lazy singleton initialization \u2014 what does double-checked locking actually fix?\nA naive lazy singleton has a race: two threads can both see `instance == null` and both construct a new instance.\n```java\n// BROKEN under concurrency:\npublic static Config getInstance() {\n    if (instance == null) {          // two threads can both pass this check\n        instance = new Config();     // both construct \u2014 you get two \"singletons\"\n    }\n    return instance;\n}\n```\n**Double-checked locking** fixes it by only synchronizing the (rare) first-time creation, not every single call:\n```java\nprivate static volatile Config instance;   // volatile matters \u2014 see below\n\npublic static Config getInstance() {\n    if (instance == null) {                 // fast path \u2014 no lock, cheap, for every call after the first\n        synchronized (Config.class) {\n            if (instance == null) {          // re-check INSIDE the lock \u2014 another thread might've just built it\n                instance = new Config();\n            }\n        }\n    }\n    return instance;\n}\n```\nThe `volatile` on `instance` isn't optional here \u2014 without it, another thread could observe a *partially constructed* object (a JVM reordering/visibility issue, Q22) through the outer, unsynchronized check. (In practice, the simplest fully correct alternative is often just an eagerly-initialized `static final` field, or Spring managing the singleton for you, Q11 \u2014 double-checked locking is worth understanding but rarely worth hand-rolling in real code.)\n\n## 22. What is the Java Memory Model, and what does \"happens-before\" mean?\nThe JVM (and the underlying CPU) is allowed to **reorder** instructions and cache values in CPU-local memory for performance, as long as it doesn't change the outcome *for a single thread running alone*. The problem: those same reorderings/caching can produce surprising results when *another* thread is watching \u2014 it might observe writes out of the order they were issued in, or a stale cached value (exactly the problem `volatile`, Q6, exists to prevent for a specific field). The **Java Memory Model (JMM)** formally defines which operations establish a **happens-before** relationship \u2014 a guarantee that everything before point A in one thread is visible to anything after point B in another thread, if A happens-before B. Concrete happens-before guarantees include: unlocking a `synchronized` block happens-before a later thread locking the *same* monitor; writing a `volatile` field happens-before any later read of that same field; and a thread's actions before calling `thread.start()` happen-before anything inside that new thread. Without one of these established relationships, there's genuinely no guarantee another thread sees your writes at all \u2014 this is the deeper \"why\" behind Q4/Q6/Q9's rules.\n\n## 23. Virtual threads (Java 21) \u2014 how are they different, and how does `synchronized` interact with them?\nA **platform thread** maps 1:1 to a real OS thread \u2014 expensive to create, and the OS can only schedule so many. A **virtual thread** is a lightweight thread managed by the JVM itself, many of which get multiplexed onto a small pool of real **carrier** (platform) threads \u2014 you can spin up *millions* of virtual threads cheaply, since blocking one doesn't tie up an OS thread the way blocking a platform thread does (the JVM parks the virtual thread and frees the carrier thread to run something else). This is exactly what the MCQ file's own Q77 (`spring.threads.virtual.enabled`) is about: virtual threads make a **blocked request thread cheap**, but they don't make whatever's actually behind that block (a JDBC connection pool, Q12) any bigger \u2014 the connection pool stays the real bottleneck for a blocking-JPA app like this one.\n\n**The `synchronized` gotcha:** a virtual thread that blocks inside a `synchronized` block/method historically gets **pinned** to its carrier thread instead of being unmounted \u2014 meaning that carrier thread is stuck too, defeating the \"cheap blocking\" benefit for exactly that section of code (JDK 24 largely fixed this for `synchronized`, but it's a real, commonly-asked gotcha for versions before that, and `ReentrantLock`, Q8, never had this problem in the first place \u2014 one more reason it's sometimes preferred in virtual-thread-heavy code).\n\n## 24. Optimistic vs. pessimistic concurrency control \u2014 the Java-level summary.\n- **Pessimistic**: assume a conflict *will* happen, so take a lock up front and block everyone else out until you're done \u2014 `synchronized`/`ReentrantLock` (Q4/Q8) at the JVM level, or `SELECT ... FOR UPDATE`/`@Lock(PESSIMISTIC_WRITE)` at the database level (MCQ file Q49). Safe, but limits concurrency \u2014 every contending thread/transaction just waits.\n- **Optimistic**: assume a conflict is *rare*, proceed without locking, and only check for a conflict at the very end \u2014 the atomic classes' CAS (Q7) at the JVM level, or `@Version`-based optimistic locking at the database level (MCQ file Q48). Higher throughput when conflicts are genuinely rare, but the loser has to detect the conflict and retry (or fail) rather than never having contended at all.\n\nThe choice is the same trade-off at every level this file and `relational-db-basics.md` touch it: how often do you actually expect two things to collide? Rare collisions favor optimistic (don't pay a locking cost for something that almost never happens); frequent, high-value collisions (the flash-sale stock decrement in MCQ Q49) favor pessimistic (avoid paying for repeated failed optimistic retries under heavy contention).\n"}, {"id": "redis", "title": "Redis beginner to pro", "group": "Caching", "path": "interview-questions/redis/redis-beginner-to-pro.md", "q": 43, "lines": 481, "md": "# Redis \u2014 Beginner to Pro (Interview Notes + E-Commerce Integration Plan)\n\nThis repo does **not** use Redis yet \u2014 current stack is Spring Boot 3.4 + PostgreSQL (JPA) + RabbitMQ + JWT (see `pom.xml`, `application.properties`). Part 1\u20133 are interview Q&A ordered from beginner to pro; **Part 4 is a concrete, step-by-step plan for introducing Redis into this e-commerce API**, pointing at the real classes it would touch (`ProductService`, `CartService`, `OrderService`, `AuthController`, `JwtFilter`).\n\nPairs with `spring-boot/kafka-questions.md` (Redis Streams vs Kafka, Q27) and `database/relational-db` (why the cache is never the source of truth).\n\n---\n\n## Part 1 \u2014 Beginner\n\n## 1. What is Redis, in short?\n**RE**mote **DI**ctionary **S**erver: an **in-memory key\u2013value data store**. All data lives in RAM, so reads/writes take microseconds instead of the milliseconds a disk-backed DB needs. Values aren't just strings \u2014 they're typed data structures (lists, hashes, sets, sorted sets, streams\u2026), and Redis gives you atomic commands that operate on them server-side.\n\nCommon roles: **cache**, **session store**, **rate limiter**, **distributed lock**, **leaderboard**, **pub/sub / lightweight queue**.\n\n## 2. Why is Redis so fast?\n1. **In memory** \u2014 no disk seek on the read path.\n2. **Single-threaded command execution** \u2014 no locks, no context switches between commands; each command runs start-to-finish atomically. (Redis 6+ uses extra threads for network I/O only; command execution is still one thread.)\n3. **I/O multiplexing** (epoll/kqueue) \u2014 one thread serves thousands of connections.\n4. **Simple, optimized data structures** \u2014 e.g. small hashes/lists stored as compact `listpack`s.\n\nTypical numbers: ~100k+ ops/sec per instance, sub-millisecond latency.\n\n## 3. Redis vs a relational DB (Postgres) \u2014 when to use which?\n| | PostgreSQL | Redis |\n|---|---|---|\n| Storage | Disk (with memory cache) | RAM (optional disk persistence) |\n| Data model | Tables, joins, SQL | Keys \u2192 typed values |\n| Durability | Strong (WAL, ACID) | Configurable, weaker by default |\n| Queries | Arbitrary (WHERE, JOIN, GROUP BY) | Lookup by key; no ad-hoc queries |\n| Size limit | Disk size | RAM size |\n| Role in our app | **Source of truth** (orders, users, payments) | **Speed layer** (cache, sessions, counters, locks) |\n\nRule of thumb: **if losing it would lose money, it lives in Postgres.** Redis holds data you can rebuild or can afford to lose.\n\n## 4. Core data types and what you'd use each for\n| Type | Example commands | E-commerce use |\n|---|---|---|\n| **String** | `SET`, `GET`, `INCR`, `SETEX` | Cached product JSON, counters, rate-limit buckets, locks |\n| **Hash** | `HSET`, `HGET`, `HINCRBY`, `HGETALL` | Cart: `cart:{userId}` \u2192 `{productId: qty}` |\n| **List** | `LPUSH`, `RPOP`, `LRANGE`, `LTRIM` | \"Recently viewed products\" (capped list) |\n| **Set** | `SADD`, `SISMEMBER`, `SINTER` | Wishlist product IDs, \"users who viewed this\" |\n| **Sorted Set (ZSet)** | `ZADD`, `ZINCRBY`, `ZREVRANGE` | Best-sellers leaderboard, trending products |\n| **Stream** | `XADD`, `XREADGROUP`, `XACK` | Event log (order events) with consumer groups |\n| **Bitmap / HyperLogLog** | `SETBIT`, `PFADD`, `PFCOUNT` | Daily active users, unique product-page visitors (approx.) |\n| **Geo** | `GEOADD`, `GEOSEARCH` | Nearest warehouse / pickup point |\n\n## 5. Basic commands you should know cold\n```bash\nSET product:42 '{\"id\":42,\"name\":\"Mouse\",\"price\":19.99}' EX 600   # set with 10-min TTL\nGET product:42\nTTL product:42          # seconds left (-1 = no expiry, -2 = key doesn't exist)\nEXPIRE product:42 60\nDEL product:42\nEXISTS product:42\nINCR page:views:42      # atomic counter\nKEYS product:*          # NEVER in production \u2014 blocks the server (see Q20)\nSCAN 0 MATCH product:* COUNT 100   # production-safe iteration\n```\n\n## 6. What is TTL and why does every cache key need one?\nTTL = time-to-live; after it elapses Redis deletes the key. Without TTLs, a cache (a) grows until memory runs out, and (b) keeps serving stale data forever if an invalidation is ever missed. A TTL is the **safety net** that bounds how stale data can get even when your invalidation code has a bug.\n\n## 7. Key naming conventions\nUse colon-separated namespaces: `app:entity:id[:field]` \u2192 `ecom:product:42`, `ecom:cart:7`, `ecom:ratelimit:login:203.0.113.5`. Keeps keys readable, lets you `SCAN` by prefix, and avoids collisions when several services share a Redis.\n\n## 8. Is Redis single-threaded? Does that mean it can't scale?\nCommand execution is single-threaded \u2014 which is exactly why each command is atomic. It scales by (1) being so fast one core is usually enough, (2) **read replicas**, and (3) **Redis Cluster** sharding across many nodes (Q24). The consequence for you: **one slow command (e.g. `KEYS *`, `HGETALL` on a 1M-field hash, a long Lua script) blocks every other client.**\n\n---\n\n## Part 2 \u2014 Intermediate\n\n## 9. Caching patterns: cache-aside vs read-through vs write-through vs write-behind\n| Pattern | Read | Write | Notes |\n|---|---|---|---|\n| **Cache-aside (lazy loading)** | App checks cache \u2192 on miss, reads DB and fills cache | App writes DB, then **deletes** cache key | Most common; what Spring `@Cacheable`/`@CacheEvict` does. **We'll use this.** |\n| Read-through | Cache library loads from DB on miss | \u2014 | Same as cache-aside but the loader lives in the cache layer |\n| Write-through | \u2014 | Write cache and DB synchronously | Cache always warm; slower writes |\n| Write-behind (write-back) | \u2014 | Write cache, flush to DB asynchronously | Fast writes; risk of data loss \u2014 avoid for orders/payments |\n\n## 10. On update, why *delete* the cache key instead of *updating* it?\nTwo concurrent writers can interleave: A writes DB (price=10), B writes DB (price=12), B updates cache (12), A updates cache (10) \u2192 cache says 10, DB says 12, until TTL. Deleting avoids that write-ordering race \u2014 the next reader repopulates from the DB. Always **write DB first, then delete cache** (deleting first lets a reader re-cache the old value before the DB commit).\n\nThere's still a tiny window (reader loaded old value before the commit, writes it back after the delete). Mitigations: short TTLs, **delayed double delete** (delete, then delete again ~500ms later), or evict **after transaction commit** (`@TransactionalEventListener(phase = AFTER_COMMIT)`).\n\n## 11. Cache penetration, breakdown (stampede), and avalanche\n| Problem | What happens | Fix |\n|---|---|---|\n| **Penetration** | Requests for IDs that don't exist (e.g. `/products/-1`, bots) always miss cache and hit DB | Cache the \"null\" result with short TTL; Bloom filter of valid IDs; validate input |\n| **Breakdown / stampede** | A single **hot key** expires \u2192 thousands of concurrent requests all miss and hammer the DB | Mutex/lock so only one request rebuilds (`@Cacheable(sync = true)`); logical expiry + background refresh |\n| **Avalanche** | **Many keys expire at the same moment** (all set with TTL=600 at deploy) or Redis goes down | Add random jitter to TTLs; replicas/HA; circuit breaker + fallback to DB |\n\nThese three come up in almost every Redis interview \u2014 know them by name.\n\n## 12. Eviction policies \u2014 what happens when memory is full?\nSet with `maxmemory` + `maxmemory-policy`:\n- `noeviction` \u2014 writes fail with an error (default; right for a **primary store/queue**, wrong for a cache)\n- `allkeys-lru` \u2014 evict least-recently-used key from all keys (**good default for a pure cache**)\n- `volatile-lru` \u2014 LRU among keys *with a TTL* only\n- `allkeys-lfu` / `volatile-lfu` \u2014 least-frequently-used (better when a few keys are persistently hot)\n- `allkeys-random`, `volatile-random`, `volatile-ttl`\n\nRedis's LRU/LFU are **approximated** by sampling (`maxmemory-samples`), not exact.\n\n## 13. How does Redis expire keys?\nTwo mechanisms combined:\n1. **Lazy (passive)** \u2014 on access, if the key is expired, delete it and return nil.\n2. **Active** \u2014 ~10\u00d7/sec, sample random keys with TTLs and delete expired ones; repeat if >25% of the sample was expired.\n\nSo an expired key may briefly still occupy memory, but you'll never *read* it.\n\n## 14. Persistence: RDB vs AOF\n| | RDB (snapshot) | AOF (append-only file) |\n|---|---|---|\n| How | Forks, dumps whole dataset to `dump.rdb` periodically | Logs every write command |\n| Data loss on crash | Everything since last snapshot (minutes) | ~1 second with `appendfsync everysec` |\n| Restart speed | Fast | Slower (replay), mitigated by AOF rewrite |\n| File size | Compact | Larger |\n\nProduction usually runs **both** (Redis 7 hybrid: AOF with an RDB preamble). A pure cache can run with persistence off.\n\n## 15. Transactions: MULTI / EXEC / WATCH\n```bash\nWATCH stock:42\nval = GET stock:42          # client reads\nMULTI\nDECRBY stock:42 1\nEXEC                        # returns nil if stock:42 changed since WATCH \u2192 retry\n```\n- `MULTI`/`EXEC` queues commands and runs them **back-to-back without interleaving** \u2014 but there's **no rollback**: if one command fails at runtime, the others still apply.\n- `WATCH` = optimistic locking (CAS). Abort if the watched key changed.\n- For conditional logic, a **Lua script** is usually simpler and truly atomic (Q16).\n\n## 16. Lua scripts \u2014 why and when?\n`EVAL` runs a script **atomically** on the server: no other command runs in between. Perfect for check-then-act logic that would otherwise race:\n```lua\n-- KEYS[1] = stock:{productId}, ARGV[1] = qty\nlocal stock = tonumber(redis.call('GET', KEYS[1]) or '-1')\nif stock < tonumber(ARGV[1]) then return -1 end\nreturn redis.call('DECRBY', KEYS[1], ARGV[1])\n```\nKeep scripts short \u2014 they block the server while running. Redis 7 adds **Functions** (`FUNCTION LOAD`) as the managed successor to ad-hoc `EVAL`.\n\n## 17. Pipelining vs transactions\n**Pipelining** batches many commands in one network round-trip (big latency win, e.g. warming 1,000 product keys), but gives **no atomicity**. `MULTI/EXEC` gives isolation. They can be combined.\n\n## 18. Pub/Sub vs Streams vs RabbitMQ (which we already have)\n| | Redis Pub/Sub | Redis Streams | RabbitMQ (in this repo) |\n|---|---|---|---|\n| Delivery | Fire-and-forget; offline subscribers miss messages | Persisted log, consumer groups, `XACK`, replay | Durable queues, acks, DLQ, routing |\n| Use | Cache-invalidation broadcast, live notifications | Lightweight event log | Business events (order placed \u2192 email, etc.) |\n\nFor this project: **keep RabbitMQ for business events**; Redis Pub/Sub is fine for broadcasting \"evict product 42\" to multiple app instances holding a local (L1) cache.\n\n## 19. How do you implement rate limiting with Redis?\n**Fixed window** (simplest):\n```bash\nINCR ratelimit:login:{ip}:{minute}\nEXPIRE ratelimit:login:{ip}:{minute} 60    # only on first INCR (== 1)\n# reject if value > 5\n```\n**Sliding window log** \u2014 ZSet of request timestamps: `ZREMRANGEBYSCORE` old entries, `ZCARD`, `ZADD` now \u2014 in a Lua script for atomicity. **Token bucket** \u2014 store `tokens` + `last_refill` in a hash, refill in Lua. Libraries: Bucket4j (with Redis backend), Resilience4j is in-memory only (per instance).\n\n## 20. Why is `KEYS *` dangerous? What instead?\n`KEYS` is O(N) over the whole keyspace and runs on the single command thread \u2014 on 10M keys it freezes Redis for seconds and every request times out. Use `SCAN` (cursor-based, incremental). Similarly avoid `FLUSHALL`, `HGETALL`/`SMEMBERS`/`LRANGE 0 -1` on huge collections (use `HSCAN`/`SSCAN`), and `DEL` on huge keys (use `UNLINK` \u2014 frees memory in a background thread).\n\n---\n\n## Part 3 \u2014 Pro / Senior\n\n## 21. Distributed locks: `SET NX PX` and its pitfalls\n```bash\nSET lock:order:checkout:7 <uuid> NX PX 10000   # acquire only if absent, auto-expire in 10s\n```\nRelease **only if you still own it** (Lua, compare-and-delete):\n```lua\nif redis.call('GET', KEYS[1]) == ARGV[1] then return redis.call('DEL', KEYS[1]) end\nreturn 0\n```\nPitfalls:\n- **No TTL** \u2192 a crashed holder deadlocks everyone. **TTL too short** \u2192 lock expires mid-work (GC pause) and two holders run at once. Fix: watchdog renewal (Redisson does this automatically).\n- **Failover**: primary grants lock, dies before replicating, replica promoted without the lock \u2192 two holders. **Redlock** (majority across N independent masters) reduces this; Martin Kleppmann's critique: without **fencing tokens** checked by the resource, no lease-based lock is safe for correctness.\n- Takeaway for interviews: **Redis locks are for efficiency (avoid duplicate work), not correctness.** For correctness (e.g. never oversell), back it with a DB constraint / optimistic locking \u2014 just like `CartService.addToCart` already relies on the `unique(user_id, product_id)` constraint.\n\n## 22. High availability: Replication vs Sentinel vs Cluster\n- **Replication** \u2014 primary \u2192 replicas, **asynchronous**. Replicas serve reads. Acknowledged writes can be lost on failover (`WAIT` reduces but doesn't eliminate this).\n- **Sentinel** \u2014 monitors primary, runs quorum-based automatic failover, tells clients the new primary. HA for a **single shard**.\n- **Cluster** \u2014 **sharding + HA**: 16,384 hash slots spread across multiple primaries, each with replicas. Use when data or throughput exceeds one node.\n\nManaged options: AWS ElastiCache / MemoryDB, Azure Cache for Redis, GCP Memorystore, Redis Cloud.\n\n## 23. Redis Cluster hash slots and hash tags\n`slot = CRC16(key) mod 16384`. Multi-key commands (`MGET`, `MULTI`, Lua with several keys) only work if **all keys are in the same slot**, otherwise `CROSSSLOT` error. Force co-location with **hash tags** \u2014 only the part in `{}` is hashed:\n```\ncart:{7}        stock-reservation:{7}     \u2192 same slot, can be used together in one Lua script\n```\nBeware: a hash tag that's too coarse (e.g. `{ecom}`) puts everything on one node \u2192 hot shard.\n\n## 24. Hot keys and big keys\n- **Big key**: a single value that's huge (a 50 MB string, a hash with 5M fields). Causes slow commands, uneven memory across shards, slow migration/deletion. Find with `redis-cli --bigkeys` / `MEMORY USAGE`. Fix: split (`cart:7` not `carts`), paginate, `UNLINK`.\n- **Hot key**: one key receiving a huge share of traffic (flash-sale product, homepage). One shard maxes out. Fix: **local L1 cache** (Caffeine) in front of Redis, replicate the key (`product:42:{1..N}` read randomly), read from replicas.\n\n## 25. Two-level cache (L1 Caffeine + L2 Redis)\nRequest \u2192 **Caffeine (in-JVM, ~ns)** \u2192 **Redis (network, ~0.5 ms)** \u2192 **Postgres (~ms)**. L1 absorbs hot keys; L2 is shared across instances. Invalidation: on write, delete Redis key and **publish** an eviction message (Redis Pub/Sub) so every instance clears its L1. Keep L1 TTL short (seconds) as a safety net.\n\n## 26. Cache consistency \u2014 can the cache ever be strongly consistent with the DB?\nNot cheaply. Options, from simplest to strongest:\n1. TTL only (bounded staleness)\n2. Cache-aside + delete-after-commit (+ delayed double delete)\n3. **CDC**: Debezium reads Postgres WAL \u2192 publishes changes \u2192 consumer evicts/updates Redis. Decouples invalidation from app code and catches writes made by other services/SQL scripts.\n4. Don't cache it (orders, payments, balances \u2014 read from DB).\n\nInterview answer: \"We accept eventual consistency with bounded staleness for catalog data, and never cache money.\"\n\n## 27. Redis Streams vs Kafka\nStreams: consumer groups, acks, pending-entries list, `XCLAIM` for stuck messages, in-memory (capped with `MAXLEN`). Great for modest volumes and when Redis is already there. Kafka: disk-based, huge retention, partitions for massive throughput, ecosystem (Connect, Streams). Retention is the usual deciding factor.\n\n## 28. Memory optimization\n- Set `maxmemory` explicitly; watch `used_memory`, `mem_fragmentation_ratio`, `evicted_keys`.\n- Prefer **hashes of small objects** over many tiny string keys (listpack encoding is very compact).\n- Serialize compactly (JSON with short field names, or Kryo/Protobuf/MessagePack).\n- Always TTL cache keys; use `UNLINK` for big deletes; `activedefrag yes` for fragmentation.\n\n## 29. Security\n- Never expose 6379 to the internet (bots scan it constantly; unauthenticated Redis has been used to write SSH keys and crontabs).\n- **ACLs** (Redis 6+): per-user passwords and command/key restrictions (`-@dangerous`, `~ecom:*`).\n- **TLS** in transit; rename/disable `FLUSHALL`, `CONFIG`, `DEBUG`.\n- Don't cache PII/secrets unless necessary; if you do, TTL it.\n\n## 30. Monitoring & debugging\n`INFO` (memory, stats, replication), `SLOWLOG GET`, `LATENCY DOCTOR`, `MONITOR` (debug only \u2014 expensive), `CLIENT LIST`, `redis-cli --bigkeys --hotkeys`. Key metrics: **hit ratio** (`keyspace_hits / (hits + misses)`), latency p99, evictions, memory, connected clients, replication lag. Spring Boot Actuator exposes a Redis health indicator and Micrometer cache metrics (`cache.gets{result=hit|miss}`).\n\n## 31. Licensing note (2024\u20132025)\nRedis moved from BSD to RSAL/SSPL in 2024 (7.4+), which triggered the Linux Foundation fork **Valkey** (BSD, API-compatible, adopted by AWS/Google). Redis 8 (2025) added **AGPLv3** as an option again. For our purposes the client code is identical \u2014 Spring Data Redis works against Redis or Valkey.\n\n## 32. Classic system-design prompts where Redis is the answer\n- \"Design a URL shortener\" \u2192 `INCR` for IDs, cache hot redirects.\n- \"Design a leaderboard\" \u2192 ZSet.\n- \"Flash sale / prevent overselling\" \u2192 Lua atomic decrement of pre-loaded stock + async order creation via queue + DB as final authority.\n- \"Rate-limit an API\" \u2192 Q19.\n- \"Online presence / who's online\" \u2192 keys with short TTL heartbeats, or bitmaps.\n- \"Session store for horizontally scaled app\" \u2192 Spring Session Redis.\n\n---\n\n## Part 4 \u2014 Introducing Redis into This E-Commerce API\n\n### 4.0 Current state \u2014 where it hurts today\n| Area | Today | Problem Redis fixes |\n|---|---|---|\n| `GET /api/v1/products`, `/products/{id}`, categories | Every request \u2192 `productRepository.findAll()` / `findById` \u2192 Postgres | Catalog is read-heavy, rarely changes \u2192 perfect cache target |\n| `POST /auth/login` | No attempt limiting | Brute-force / credential stuffing |\n| Logout | JWT is stateless; `JwtFilter` accepts any unexpired token (`expiration-time` is ~141 days!) | No way to revoke a stolen token |\n| `OrderService.placeOrder` | Double-click / client retry \u2192 two orders | Idempotency key |\n| Stock | `placeOrder` never checks or decrements `Product.stock` | Flash-sale overselling (Redis as fast gate, DB as authority) |\n| Best-sellers / recently viewed | Not implemented | ZSet / capped List are one-liners |\n\nAdopt in phases \u2014 each phase is independently shippable and **the app must keep working if Redis is down** (cache is an optimization, not a dependency).\n\n### 4.1 Phase 0 \u2014 Infrastructure\n\n**`docker-compose.yml`** \u2014 add a service:\n```yaml\n  redis:\n    image: redis:7.4-alpine\n    container_name: redis\n    command: [\"redis-server\", \"--appendonly\", \"yes\", \"--maxmemory\", \"256mb\", \"--maxmemory-policy\", \"allkeys-lru\"]\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis-data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 5s\n      retries: 5\n\nvolumes:\n  redis-data:\n```\nand in `springboot-app`: add `redis` to `depends_on` plus `SPRING_DATA_REDIS_HOST=redis`.\n\n**`pom.xml`**:\n```xml\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-data-redis</artifactId>  <!-- Lettuce client by default -->\n</dependency>\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-cache</artifactId>\n</dependency>\n```\n\n**`application.properties`**:\n```properties\nspring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}\nspring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}\nspring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}\nspring.data.redis.timeout=500ms\nspring.cache.type=redis\nspring.cache.redis.key-prefix=ecom:\nspring.cache.redis.time-to-live=10m\nspring.cache.redis.cache-null-values=false\nmanagement.endpoints.web.exposure.include=loggers,health,metrics,caches\n```\nFor `k8s/`: a `redis` Deployment/Service (or better, a managed Redis) and the same env vars in the app's ConfigMap/Secret.\n\n### 4.2 Phase 1 \u2014 Cache the catalog (biggest, safest win)\n\n**New `config/RedisConfig.java`** \u2014 JSON serialization (not JDK serialization: readable in `redis-cli`, no `Serializable` requirement, survives class changes better) and per-cache TTLs:\n```java\n@Slf4j\n@Configuration\n@EnableCaching\npublic class RedisConfig implements CachingConfigurer {\n\n    @Bean\n    public RedisCacheManager cacheManager(RedisConnectionFactory cf) {\n        ObjectMapper mapper = new ObjectMapper().registerModule(new JavaTimeModule());\n        mapper.activateDefaultTyping(mapper.getPolymorphicTypeValidator(),\n                ObjectMapper.DefaultTyping.NON_FINAL, JsonTypeInfo.As.PROPERTY);\n        var serializer = new GenericJackson2JsonRedisSerializer(mapper);\n\n        RedisCacheConfiguration base = RedisCacheConfiguration.defaultCacheConfig()\n                .prefixCacheNameWith(\"ecom:\")\n                .entryTtl(Duration.ofMinutes(10))\n                .disableCachingNullValues()\n                .serializeValuesWith(RedisSerializationContext.SerializationPair.fromSerializer(serializer));\n\n        return RedisCacheManager.builder(cf)\n                .cacheDefaults(base)\n                .withCacheConfiguration(\"products\",   base.entryTtl(Duration.ofMinutes(10)))\n                .withCacheConfiguration(\"product\",    base.entryTtl(Duration.ofMinutes(30)))\n                .withCacheConfiguration(\"categories\", base.entryTtl(Duration.ofHours(6)))\n                .build();\n    }\n\n    // If Redis is down, log and fall through to the DB instead of failing the request.\n    @Override\n    public CacheErrorHandler errorHandler() {\n        return new SimpleCacheErrorHandler() {\n            @Override public void handleCacheGetError(RuntimeException e, Cache c, Object k) { log.warn(\"cache get failed {}::{}\", c.getName(), k, e); }\n            @Override public void handleCachePutError(RuntimeException e, Cache c, Object k, Object v) { log.warn(\"cache put failed\", e); }\n            @Override public void handleCacheEvictError(RuntimeException e, Cache c, Object k) { log.warn(\"cache evict failed\", e); }\n        };\n    }\n}\n```\n\n**`service/ProductService.java`** \u2014 annotate the existing methods:\n```java\n@Cacheable(cacheNames = \"products\", key = \"'all'\", sync = true)   // sync = stampede protection (Q11)\npublic List<Product> findAll() { return productRepository.findAll(); }\n\n@Cacheable(cacheNames = \"product\", key = \"#id\", sync = true)\npublic Optional<Product> findById(Integer id) { return productRepository.findById(id); }\n\n@Caching(evict = {\n    @CacheEvict(cacheNames = \"product\",  key = \"#result.id\"),\n    @CacheEvict(cacheNames = \"products\", key = \"'all'\")\n})\npublic Product save(Product product) { return productRepository.save(product); }\n\n@Caching(evict = {\n    @CacheEvict(cacheNames = \"product\",  key = \"#id\"),\n    @CacheEvict(cacheNames = \"products\", key = \"'all'\")\n})\npublic void deleteById(Integer id) { productRepository.deleteById(id); }\n```\nSame pattern for `CategoryService` (`categories` cache).\n\nGotchas specific to this codebase:\n- **Cache DTOs, not JPA entities.** `Product` has `@ManyToOne Category`; caching entities risks `LazyInitializationException` (we have `spring.jpa.open-in-view=false`) and serializes whatever graph is loaded. Better: move the annotations to a method returning `ProductResponse` (via the existing `mapper/` package).\n- `Optional` return with `@Cacheable`: Spring unwraps it and caches the value; an empty Optional isn't cached (because `disableCachingNullValues`) \u2014 add short-TTL null caching later if bots probe missing IDs (Q11 penetration).\n- `findAll()` cached as one big list is fine for a small catalog; once there's pagination, cache per page (`key = \"#pageable.pageNumber + ':' + #pageable.pageSize\"`) and evict by prefix or version the key.\n- **Self-invocation**: `@Cacheable` works through a proxy \u2014 calling `this.findById()` from inside `ProductService` bypasses the cache.\n- Evict after commit if `save` ever becomes part of a larger `@Transactional` flow (Q10).\n\nExpected effect: product reads go from a Postgres round-trip to a sub-ms Redis GET; DB load for catalog browsing drops by the hit ratio (typically 90%+).\n\n### 4.3 Phase 2 \u2014 Login rate limiting (security win)\n\nIn `AuthController` (or a `OncePerRequestFilter` on `/auth/login`):\n```java\n@Service\n@RequiredArgsConstructor\npublic class LoginRateLimiter {\n    private final StringRedisTemplate redis;\n    private static final int MAX_ATTEMPTS = 5;\n\n    public boolean isAllowed(String ip, String username) {\n        String key = \"ecom:ratelimit:login:\" + ip + \":\" + username;\n        Long attempts = redis.opsForValue().increment(key);\n        if (attempts != null && attempts == 1) {\n            redis.expire(key, Duration.ofMinutes(15));\n        }\n        return attempts == null || attempts <= MAX_ATTEMPTS;   // fail open if Redis is down\n    }\n\n    public void reset(String ip, String username) {             // call on successful login\n        redis.delete(\"ecom:ratelimit:login:\" + ip + \":\" + username);\n    }\n}\n```\nReturn `429 Too Many Requests` via `GlobalExceptionHandler`. (INCR + EXPIRE is two commands \u2014 if the app dies between them the key never expires; fine for a demo, use a Lua script or `SET key 0 EX 900 NX` then `INCR` for production.)\n\n### 4.4 Phase 3 \u2014 JWT revocation / logout\n\nTokens live ~141 days (`security.jwt.expiration-time=12222200000`), so logout must be enforceable server-side:\n1. Add a `jti` (UUID) claim in `JwtService.generateToken`.\n2. `POST /auth/logout` \u2192 `SET ecom:jwt:denylist:{jti} 1 EXAT <token exp>` \u2014 the key auto-expires exactly when the token would have, so the denylist never grows unbounded.\n3. In `JwtFilter`, after signature validation: `if (redis.hasKey(\"ecom:jwt:denylist:\" + jti)) \u2192 401`.\n\n(Better long-term: shorten access token to 15 min and store **refresh tokens** in Redis, `ecom:refresh:{userId}:{tokenId}` with TTL \u2014 revoke by deleting.) Decide fail-open vs fail-closed here deliberately \u2014 for auth, fail-closed is safer.\n\n### 4.5 Phase 4 \u2014 Idempotent order placement\n\n`OrderService.placeOrder` is `@Transactional` but a client retry/double-click creates two orders. Require an `Idempotency-Key` header on `POST /api/v1/orders/place`:\n```java\nString key = \"ecom:idem:order:\" + userId + \":\" + idemKey;\nBoolean first = redis.opsForValue().setIfAbsent(key, \"IN_PROGRESS\", Duration.ofHours(24));\nif (Boolean.FALSE.equals(first)) {\n    String existing = redis.opsForValue().get(key);\n    if (\"IN_PROGRESS\".equals(existing)) throw new ConflictException(\"Order is being processed\");\n    return orderService.findById(Integer.valueOf(existing)).orElseThrow();   // replay original result\n}\ntry {\n    Order order = orderService.placeOrder(req);\n    redis.opsForValue().set(key, order.getId().toString(), Duration.ofHours(24));\n    return order;\n} catch (RuntimeException e) {\n    redis.delete(key);           // allow the client to retry after a real failure\n    throw e;\n}\n```\nFor hard guarantees, also persist the key in an `orders.idempotency_key` column with a unique constraint \u2014 Redis is the fast path, the DB constraint is the backstop (same philosophy as `CartService`).\n\n### 4.6 Phase 5 \u2014 Stock reservation for flash sales\n\nToday `placeOrder` doesn't touch `Product.stock` at all. When it does, the DB-only version is `UPDATE products SET stock = stock - :q WHERE id = :id AND stock >= :q` (check rows affected) \u2014 that's correct and should stay the authority. Under a flash sale (10k users, 100 units), Redis becomes a **gate** so 9,900 requests are rejected in memory without touching Postgres:\n1. Preload: `SET ecom:stock:{42} 100` when the sale starts.\n2. On checkout: run the Lua script from Q16 (`-1` \u2192 \"sold out\", return immediately).\n3. On success: create the order in Postgres (conditional UPDATE above). If the DB step fails, `INCRBY` the stock back (compensation \u2014 see the saga notes).\n4. Periodically reconcile Redis stock with DB stock.\n\n### 4.7 Phase 6 \u2014 Nice-to-haves\n- **Best-sellers**: on order placed (existing RabbitMQ consumer is a good hook), `ZINCRBY ecom:bestsellers:2026-09 <qty> <productId>`; `GET /products/bestsellers` \u2192 `ZREVRANGE ... 0 9`.\n- **Recently viewed**: on `GET /products/{id}` for a logged-in user, `LPUSH ecom:recent:{userId} 42` + `LTRIM 0 19` + `EXPIRE 30d`.\n- **Cart in Redis** (hash `ecom:cart:{userId}` \u2192 `productId: qty`): fast and good for guest carts, but our cart snapshots price and relies on a DB unique constraint \u2014 keep Postgres as the source of truth unless cart traffic becomes a bottleneck.\n- **Spring Session Redis**: only needed if we move away from stateless JWT to server-side sessions.\n- **Distributed scheduled jobs**: ShedLock with Redis provider so a `@Scheduled` job (e.g. cancel unpaid orders) runs on one instance only when scaled out in `k8s/`.\n\n### 4.8 What we will NOT put in Redis\nOrders, payments, user accounts, addresses \u2014 anything where loss or staleness costs money or trust. Redis holds **copies** (cache) and **ephemeral state** (counters, locks, denylist, idempotency keys).\n\n### 4.9 Testing\n- **Testcontainers**: `@Container static GenericContainer<?> redis = new GenericContainer<>(\"redis:7.4-alpine\").withExposedPorts(6379);` + `@DynamicPropertySource` for `spring.data.redis.host/port`.\n- Test: second `findById` call doesn't hit the repository (`verify(repo, times(1))` with a `@SpyBean`); `save` evicts; app still serves products when the Redis container is stopped (error handler works).\n- `@DataRedisTest` slice for templates/repositories.\n\n### 4.10 Rollout checklist\n- [ ] Redis in docker-compose + k8s, `maxmemory` + `allkeys-lru` set\n- [ ] Starter deps + properties, `RedisConfig` with JSON serializer and `CacheErrorHandler`\n- [ ] Phase 1 caching on products/categories (DTOs), with TTL jitter if many keys are warmed at once\n- [ ] Actuator health/metrics; dashboard for hit ratio, latency, memory, evictions\n- [ ] Phase 2 rate limit \u2192 Phase 3 JWT denylist \u2192 Phase 4 idempotency \u2192 Phase 5 stock gate\n- [ ] Load test before/after (e.g. k6 against `GET /api/v1/products`) to show the gain\n\n---\n\n## Quick-fire interview answers\n- **Is Redis a database?** Yes \u2014 an in-memory data store that can persist, but usually used as cache/ephemeral store alongside a primary DB.\n- **Why single-threaded is fine?** CPU is rarely the bottleneck; memory and network are. No locks = simple + atomic.\n- **Cache-aside write order?** Update DB, then delete cache.\n- **Stampede fix?** Lock/single-flight (`sync = true`), logical expiry, TTL jitter.\n- **Lock correctness?** Redis locks = efficiency; correctness needs fencing / DB constraints.\n- **Scale beyond one node?** Replicas for reads, Cluster for sharding.\n- **Data loss window?** AOF `everysec` \u2248 1s; async replication can lose acknowledged writes on failover.\n- **Most dangerous commands?** `KEYS`, `FLUSHALL`, big `DEL`, long Lua scripts, `MONITOR` in prod.\n"}, {"id": "rest", "title": "REST API basics", "group": "API", "path": "interview-questions/rest-api/rest-api-basic-questions.md", "q": 15, "lines": 97, "md": "# REST API \u2014 Basic Interview Questions\n\nPaired with the runnable example at `src/com/shihab/springboot` (the Employee\nManagement REST API) where useful.\n\n## 1. What is REST, and what makes an API \"RESTful\"?\nAn architectural style for building APIs over HTTP, built around **resources** (nouns, e.g. `/employees`) manipulated with standard HTTP methods, rather than custom action-based endpoints (`/getEmployee`, `/deleteEmployee`). Key constraints: statelessness, a uniform interface (standard HTTP verbs/status codes), client-server separation, and resources identified by URIs.\n\n`EmployeeController` follows this: `/api/employees` is the resource, and `GET`/`POST`/`PUT`/`DELETE` on that same URL express the different actions \u2014 not `/api/getEmployees`, `/api/createEmployee`, etc.\n\n## 2. What are the main HTTP methods, and which are \"safe\" or \"idempotent\"?\n- `GET` \u2014 read, safe (no side effects), idempotent.\n- `POST` \u2014 create, not safe, **not** idempotent (calling it twice creates two resources).\n- `PUT` \u2014 full update/replace, not safe, idempotent (calling it 5 times with the same body leaves the same end state).\n- `PATCH` \u2014 partial update, not safe, not guaranteed idempotent.\n- `DELETE` \u2014 remove, not safe, idempotent (deleting an already-deleted resource still ends with it gone).\n\n`EmployeeController` maps these directly: `getAllEmployees`/`getEmployeeById` (`GET`), `createEmployee` (`POST`), `updateEmployee` (`PUT`), `deleteEmployee` (`DELETE`).\n\n**Idempotent \u2260 safe.** Idempotent means repeating the call doesn't change the result further; safe means it doesn't change anything at all. `PUT`/`DELETE` are idempotent but not safe \u2014 they do modify data, just predictably.\n\n## 3. What's the difference between PUT and PATCH?\n`PUT` replaces the entire resource \u2014 every field you don't send is expected to be cleared/defaulted. `PATCH` updates only the fields provided.\n\n`EmployeeController.updateEmployee` is written as a `PUT`: it takes a full `EmployeeDTO` and overwrites every field on the entity. A `PATCH` version would instead accept a partial DTO (all fields optional/nullable) and only apply the ones present \u2014 often implemented with a `Map<String, Object>` body or a library like JSON Merge Patch, since Java DTOs don't naturally distinguish \"field omitted\" from \"field set to null.\"\n\n## 4. What do the common HTTP status codes mean?\n- `200 OK` \u2014 success, has a body (e.g. `GET`, successful `PUT`).\n- `201 Created` \u2014 resource created (`POST`), typically with a `Location` header pointing to it.\n- `204 No Content` \u2014 success, no body (e.g. `DELETE`).\n- `400 Bad Request` \u2014 client sent invalid data (validation failure).\n- `401 Unauthorized` \u2014 not authenticated.\n- `403 Forbidden` \u2014 authenticated, but not allowed to do this.\n- `404 Not Found` \u2014 resource doesn't exist.\n- `409 Conflict` \u2014 request conflicts with current state (e.g. duplicate unique field).\n- `500 Internal Server Error` \u2014 unhandled server-side failure.\n\nThis project's `GlobalExceptionHandler` maps exactly three of these: `ResourceNotFoundException` \u2192 404, `MethodArgumentNotValidException` \u2192 400, anything else \u2192 500. `EmployeeController.createEmployee` also returns 201 explicitly via `ResponseEntity.created(...)`, and `deleteEmployee` returns 204 via `ResponseEntity.status(HttpStatus.NO_CONTENT)`.\n\n## 5. What does \"statelessness\" mean in REST?\nEach request must contain everything the server needs to process it \u2014 the server doesn't store any client session state between requests. A request to `GET /api/employees/7` must be fully self-contained (auth token, params, etc.); the server can't rely on remembering something from a previous request by the same client.\n\nWhy it matters: statelessness is what lets you scale horizontally \u2014 any server instance behind a load balancer can handle any request, since none of them are holding onto session-specific state. It's also why REST APIs commonly use tokens (JWT, API keys) sent on every request instead of server-side sessions.\n\n## 6. How do you handle pagination in a REST API?\nCommon approaches:\n- **Offset-based**: `GET /api/employees?page=2&size=20` \u2014 simple, but can skip/duplicate rows if data changes between requests.\n- **Cursor-based**: `GET /api/employees?after=employee_123&size=20` \u2014 more consistent under concurrent writes, common in large-scale APIs.\n\n`EmployeeController.getAllEmployees` currently returns the full list \u2014 for a real-world version handling many rows, you'd change the return type to a `Page<EmployeeDTO>` and have `EmployeeRepository` (already a `JpaRepository`) accept a `Pageable` parameter, since Spring Data JPA supports offset-based pagination out of the box:\n```java\nPage<Employee> findByDepartment(Department department, Pageable pageable);\n```\n\n## 7. What is content negotiation?\nThe client and server agreeing on the response format via the `Accept` header (e.g. `Accept: application/json`), and the request body format via `Content-Type`. Spring's `@RestController` handles this automatically through Jackson \u2014 `EmployeeController` returns Java objects (`EmployeeDTO`), and Spring serializes them to JSON because that's the default (and the `Accept` header the client sends). Supporting XML too would just mean adding the JAXB dependency; no controller code changes.\n\n## 8. What is API versioning, and what are the common strategies?\nChanging an API's contract without breaking existing clients. Common approaches:\n- **URI versioning**: `/api/v1/employees`, `/api/v2/employees` \u2014 simplest, most visible, but duplicates routes over time.\n- **Header versioning**: a custom header like `X-API-Version: 2` \u2014 keeps URLs stable, less discoverable.\n- **Content-type versioning**: `Accept: application/vnd.company.v2+json` \u2014 \"purest\" REST approach, more complex to set up.\n\n`EmployeeController` uses `/api/employees` with no version \u2014 fine for an internal/demo API, but a public API with external consumers would need one of the above before the first breaking change ships.\n\n## 9. What is CORS, and when do you need it?\nCross-Origin Resource Sharing \u2014 a browser security mechanism that blocks a web page on one origin (e.g. `https://myapp.com`) from calling an API on a different origin (e.g. `https://api.myapp.com`) unless the server explicitly allows it via response headers (`Access-Control-Allow-Origin`, etc.).\n\nIt only matters for browser-based clients \u2014 a mobile app or `curl` calling `EmployeeController` directly isn't affected by CORS at all, since CORS is enforced by the browser, not the server. To allow a frontend to call this API from a different origin, you'd add `@CrossOrigin(origins = \"https://myapp.com\")` on the controller, or configure it globally via a `WebMvcConfigurer` bean.\n\n## 10. What's the difference between authentication and authorization?\n**Authentication** \u2014 verifying *who* you are (logging in, presenting a valid token). **Authorization** \u2014 verifying *what you're allowed to do* once identified (can this user delete this employee, or only view it?).\n\nNone of this project's endpoints currently enforce either \u2014 `EmployeeController` is fully open. Adding Spring Security would typically mean: authentication via a login endpoint issuing a JWT, then each request carrying `Authorization: Bearer <token>`, and authorization enforced with something like `@PreAuthorize(\"hasRole('ADMIN')\")` on `deleteEmployee` specifically, while `getAllEmployees` stays open to any authenticated user.\n\n## 11. What is idempotency, and why does it matter for retries?\nAn idempotent operation produces the same end result no matter how many times it's repeated. This matters specifically for network retries: if a client calls `DELETE /api/employees/7`, doesn't get a response (timeout), and retries, idempotency guarantees the second call is harmless \u2014 the employee is still just deleted, not \"double deleted\" or erroring unexpectedly.\n\n`POST` is the odd one out \u2014 retrying a timed-out `POST /api/employees` risks creating a duplicate employee, since `POST` isn't idempotent. This is why some APIs support an `Idempotency-Key` header on `POST` requests: the client generates a unique key per logical request, and the server recognizes a retried key and returns the original result instead of creating a second resource.\n\n## 12. What are some REST API design best practices?\n- Use plural nouns for resources: `/employees`, not `/employee` or `/getEmployees`.\n- Nest resources to express relationships: `/employees/7/transactions`, not a flat `/employeeTransactions?employeeId=7`.\n- Use HTTP status codes correctly (Q4) i
