tOrderId().toString(), event);\n    }\n}\n```\n```java\n// Consumer (e.g. inside InventoryService)\n@Component\npublic class InventoryEventListener {\n    @KafkaListener(topics = \"order-placed\", groupId = \"inventory-service\")\n    public void onOrderPlaced(OrderPlacedEvent event) {\n        // reserve stock for event.getProductId() / event.getQuantity()\n    }\n}\n```\n`OrderService` doesn't need to know who's listening (`InventoryService`, an email service, analytics, etc.) — this is the choreography style from `microservices-communication-questions.md` Q19, and it's what backs a Saga's compensating-transaction chain (`spring-boot-expert-questions.md` Q7) when a downstream step fails.\n\n## 11. Kafka vs. RabbitMQ — when would you pick which?\n| | Kafka | RabbitMQ |\n|---|---|---|\n| **Model** | Durable log, consumers pull and track their own offset | Traditional queue, broker pushes and tracks delivery/ack per message |\n| **Replay** | Yes — reset a consumer's offset to re-read old messages | No — once acked/consumed, it's gone (unless re-published) |\n| **Ordering** | Per-partition only | Per-queue (FIFO), simpler to reason about for a single queue |\n| **Throughput** | Very high, built for large event streams / stream processing | High, but optimized more for flexible routing than raw log throughput |\n| **Routing** | Simple (topic name, sometimes topic + key) | Rich (exchanges: direct/topic/fanout/headers) |\n| **Best fit** | Event streaming, event sourcing, high-volume pipelines, multiple independent consumers needing the full history | Task queues, RPC-style messaging, complex routing, when you don't need replay |\n\nThis project uses RabbitMQ, which fits a simpler task-queue/routing need; Kafka would be the better fit if the system grew into needing multiple independent consumers replaying the same event history (e.g. adding an analytics pipeline later without touching existing consumers).\n"}, {"id": "microservices", "title": "Microservices communication", "group": "Spring Boot", "path": "interview-questions/spring-boot/microservices-communication-questions.md", "q": 20, "lines": 206, "md": "# Microservices Communication (Spring Boot) — Beginner to Mid-Level\n\nFocused specifically on how services call each other, and how failures surface across a chain of calls. Pairs with `spring-boot-basic-questions.md` (single-service) and `spring-boot-expert-questions.md` (production-scale depth).\n\n## 1. What is a microservice, in short?\nA small, independently deployable service owning one piece of business capability (e.g. \"orders,\" \"payments,\" \"employees\") with its own database, built and released separately from every other service. Contrast with a monolith, where everything ships as one deployable unit.\n\n## 2. Why split into microservices instead of one big app?\nIndependent deployment (release the payment service without redeploying everything), independent scaling (scale the busy service, not the whole app), technology freedom (each service can pick its own DB/language), and fault isolation (one service crashing doesn't necessarily take the whole system down — though as Q6 shows, it can still cause problems downstream).\n\n## 3. Synchronous communication — calling another service and waiting for the answer\nThe caller sends a request and blocks until it gets a response — same mental model as calling any REST API. Use when the caller genuinely needs the result to proceed (e.g. \"check payment status before confirming the order\"). Spring gives you four real choices for the HTTP client itself — which one to reach for is its own common interview question.\n\n**OpenFeign — declarative, an interface you never implement:**\n```java\n@FeignClient(name = \"payment-service\")\npublic interface PaymentClient {\n    @GetMapping(\"/api/payments/{orderId}\")\n    PaymentDTO getPayment(@PathVariable Long orderId);\n}\n\n// in OrderService:\nPaymentDTO payment = paymentClient.getPayment(orderId);   // blocks here until payment-service responds\n```\nYou declare an interface with `@FeignClient` + Spring MVC-style mapping annotations; Spring Cloud OpenFeign generates the implementation at startup — no HTTP-building code anywhere. This is the least boilerplate of the four, and it integrates directly with service discovery (Q8) and Resilience4j (`@CircuitBreaker`/`@Retry`, Q7/Q15) with just configuration, no wiring code. Best fit for a service that calls **many** other services — one clean interface per downstream dependency.\n\n**`RestClient` — fluent, synchronous, the modern default (Spring 6.1+/Boot 3.2+):**\n```java\n@Bean\npublic RestClient paymentRestClient(RestClient.Builder builder) {\n    return builder.baseUrl(\"http://payment-service\").build();\n}\n\n// in OrderService:\nPaymentDTO payment = paymentRestClient.get()\n        .uri(\"/api/payments/{orderId}\", orderId)\n        .retrieve()\n        .body(PaymentDTO.class);   // blocks here, same as Feign\n```\nA fluent, builder-style API, blocking (like Feign), built into Spring itself (no extra dependency, unlike Feign which needs `spring-cloud-starter-openfeign`). Good default for a small number of outgoing calls where a full `@FeignClient` interface would be overkill.\n\n**`WebClient` — fluent, reactive/non-blocking:**\n```java\n@Bean\npublic WebClient paymentWebClient(WebClient.Builder builder) {\n    return builder.baseUrl(\"http://payment-service\").build();\n}\n\n// in OrderService (reactive stack):\nMono<PaymentDTO> payment = paymentWebClient.get()\n        .uri(\"/api/payments/{orderId}\", orderId)\n        .retrieve()\n        .bodyToMono(PaymentDTO.class);   // does NOT block — returns immediately, resolves later\n```\nSame fluent shape as `RestClient`, but non-blocking end-to-end — the calling thread is freed immediately instead of waiting, and the actual response is delivered later via the reactive pipeline (`Mono`/`Flux`). This only pays off if the *whole* call chain is reactive (a WebFlux app, not a classic Spring MVC/blocking-JDBC app like this repo) — mixing a non-blocking client into an otherwise-blocking service (blocking JDBC/JPA calls elsewhere in the same request) gains little, since the thread still ends up blocking somewhere else in the same request anyway.\n\n**`RestTemplate` — the old blocking client, in maintenance mode:**\n```java\nPaymentDTO payment = restTemplate.getForObject(\"http://payment-service/api/payments/{orderId}\", PaymentDTO.class, orderId);\n```\nPredates `RestClient`; Spring's own docs mark it in maintenance mode (no new features), and `RestClient` is its direct fluent successor. Only relevant for legacy code — avoid it in anything new.\n\n**The one-line comparison an interviewer wants:** `RestClient` for a few simple outgoing calls (modern default, no extra dependency); `OpenFeign` once you're calling several downstream services and want one interface per dependency with minimal boilerplate; `WebClient` only inside a genuinely reactive (WebFlux) application; `RestTemplate` only in code you haven't migrated off yet. This repo's own `/v1` REST endpoints (`ProductController`, `CartController`, etc.) are themselves plain blocking Spring MVC, so if they ever needed to call another service, `RestClient` or `OpenFeign` — not `WebClient` — would be the natural fit.\n\n## 4. Asynchronous communication — publish an event, don't wait\nThe caller publishes a message and moves on immediately; some other service consumes it whenever it's ready.\n```java\n// Order service — fires the event and returns right away\nkafkaTemplate.send(\"order-created\", new OrderCreatedEvent(orderId, customerId));\n\n// Notification service — consumes it independently, on its own time\n@KafkaListener(topics = \"order-created\")\npublic void onOrderCreated(OrderCreatedEvent event) {\n    emailService.sendConfirmation(event.getCustomerId());\n}\n```\nUse when the caller doesn't need an immediate answer, or when you want services decoupled (the order service doesn't need to know or care that a notification service exists).\n\n## 5. Sync or async — how do you decide?\nAsk: does the caller need the result *right now* to continue? If yes → synchronous (REST/Feign). If it's a \"let others know, whenever\" — a notification, an audit log, a side effect that doesn't block the main flow → asynchronous (messaging). Most real systems use both: synchronous for the request/response the user is waiting on, asynchronous for everything that can happen after the response is already sent.\n\n## 6. Scenario: A calls C through B (A → B → C). If B's call to C fails, how does A find out?\nThis is really two different designs, and the answer depends entirely on whether **B → C** is synchronous or asynchronous.\n\n**If A → B and B → C are both synchronous (typical case):**\n```java\n// Service B\n@GetMapping(\"/api/b-endpoint\")\npublic ResponseEntity<ResultDTO> handle() {\n    try {\n        ResultDTO result = serviceCClient.call();   // B calling C\n        return ResponseEntity.ok(result);\n    } catch (FeignException ex) {\n        // C failed (down, timeout, 500, etc.) — B decides what A sees\n        return ResponseEntity.status(HttpStatus.BAD_GATEWAY).body(ResultDTO.failed(\"C unavailable\"));\n    }\n}\n```\nA never talks to C directly — A only ever sees **B's response**. So the honest answer is: *A is notified because B's response to A reflects what happened when B called C* — either:\n- B **propagates the failure** — returns an error status (502/503) or an error body to A, and A's own call to B fails/returns an error it then handles.\n- B **applies a fallback** (Q7, circuit breaker) — catches C's failure, returns a degraded-but-successful response to A. In this case **A does *not* know C failed at all** — from A's point of view, the call to B just succeeded with slightly different data. This is a real design decision, not a bug: sometimes hiding the failure and degrading gracefully is exactly what you want (e.g. show cached/default data instead of erroring the whole page).\n\n**If B → C is asynchronous** (B fires an event to C and doesn't wait), B has likely *already returned a response to A* before C even starts processing — often a `202 Accepted`, meaning \"request received, still working on it.\" If C then fails *after* B has already responded to A, A can't find out through the original response at all — some other mechanism is needed:\n- **Callback/webhook** — C (or B, once it hears back from C) calls a URL A exposed, notifying it of the outcome.\n- **A polls a status endpoint** — A periodically checks `GET /api/orders/{id}/status` until it shows success or failure.\n- **A subscribes to an event** — A listens on a \"result\" topic (e.g. `order-failed`) the same way C listens on \"order-created\" (Q4), correlating by a request/order ID.\n- **Push channel** — WebSocket/Server-Sent Events pushing the outcome to a still-connected client.\n\n**The one-line answer interviewers are fishing for:** in a synchronous chain, failure naturally propagates back up through each call's response/exception — A finds out because B's answer to A changes. In an asynchronous chain, nothing propagates automatically — you have to explicitly design a notification path (callback, polling, or a subscribed event) back to A, because A already got its response before the failure even happened.\n\n## 7. What's a circuit breaker's role in this chain?\nWrapping B's call to C in `@CircuitBreaker` (see the expert doc, Q3) means repeated C failures make B stop calling C for a while and immediately return a fallback — protecting B from piling up slow/timed-out calls, and protecting A from waiting on a call that's very likely to fail anyway. This is *why* the fallback-vs-propagate choice in Q6 exists: the circuit breaker is the mechanism that decides \"return degraded data\" instead of \"wait and then fail.\"\n\n## 8. Why doesn't A just hardcode B's URL, and B just hardcode C's?\nBecause instances scale up/down and move around (especially in Kubernetes) — a hardcoded IP/port breaks the moment a pod restarts elsewhere. Services register with a discovery mechanism (Eureka, or Kubernetes' built-in DNS-based service discovery) under a logical name (`payment-service`), and the caller resolves that name to a live instance at call time, with load balancing across replicas handled automatically.\n\n## 9. Where does an API Gateway fit into A → B → C?\nTypically, external clients don't call A directly at all — they go through a **Gateway** (Spring Cloud Gateway, Kong), which routes to A. The Gateway is a good place to centralize cross-cutting concerns that would otherwise need repeating in every service: authentication, rate limiting (see the expert doc, Q15), and request logging. A → B → C (internal, service-to-service) calls usually bypass the gateway and talk directly (via service discovery, Q8) — the gateway is the front door, not every internal hop.\n\n## 10. How do you debug a failure somewhere in an A → B → C chain?\nThis is exactly what **distributed tracing** (expert doc, Q4) is for: a single trace ID is generated for the original request and passed along on every hop (A → B → C), so you can pull up one timeline showing all three services' spans for that one request and see exactly where it broke and how long each hop took, instead of manually cross-referencing separate log files from three different services by timestamp and guessing.\n\n## 11. Why can't microservices just share one database?\nSharing a DB across services quietly turns them back into a monolith — any service can read/write another's tables, so you can't change B's schema without checking every other service that might depend on it, and you lose independent deployability (the whole point from Q2). The standard rule is **database-per-service**: B owns its tables exclusively, and if A needs B's data, it asks B (via Q3/Q4), never queries B's database directly.\n\n## 12. What's the difference between REST and gRPC for service-to-service calls?\nREST/JSON over HTTP is what A/B/C use in this doc's examples — simple, human-readable, widely supported. **gRPC** uses Protocol Buffers (a compact binary format) over HTTP/2, and defines the contract in a `.proto` file that generates client/server code in multiple languages:\n```protobuf\nservice PaymentService {\n    rpc GetPayment (PaymentRequest) returns (PaymentResponse);\n}\n```\ngRPC is faster (smaller payloads, HTTP/2 multiplexing) and gives you a strict, generated contract — but it's less human-debuggable than JSON and less natural for public-facing APIs. Common pattern: gRPC for internal service-to-service calls (B → C), REST for the external-facing edge (client → A).\n\n## 13. What's the difference between Kafka and RabbitMQ, at a basic level?\nBoth are message brokers, but built around different models. **RabbitMQ** is a traditional message queue — a message is pushed to a queue and consumed (typically once) by a worker, good for task distribution. **Kafka** is a distributed log — messages are appended to a topic and *retained*, so multiple independent consumers can each read the same stream at their own pace (and even replay old messages), which is why Kafka is the more common choice for event-driven architectures with several services all reacting to the same event (like `order-created` in Q4).\n\n## 14. In the async version of Q6 (B → C fails), what happens to the message that failed?\nIf C's consumer throws while processing a message, most brokers will retry it. But after enough failed retries, you don't want it retried forever — it gets routed to a **Dead Letter Queue (DLQ)**, a separate topic/queue holding messages that repeatedly failed processing, so they don't block the rest of the stream and someone can inspect/reprocess them later instead of losing them silently.\n```java\n@KafkaListener(topics = \"order-created\")\n@RetryableTopic(attempts = \"3\", dltStrategy = DltStrategy.FAIL_ON_ERROR)\npublic void onOrderCreated(OrderCreatedEvent event) { ... }\n// after 3 failed attempts, the message lands on \"order-created-dlt\" instead of vanishing\n```\n\n## 15. What is the retry pattern, and how does it interact with timeouts?\nAutomatically re-attempt a failed call a bounded number of times before giving up — useful for transient failures (a brief network blip, a downstream service mid-restart).\n```java\n@Retry(name = \"paymentService\", fallbackMethod = \"fallback\")\npublic PaymentDTO getPayment(Long orderId) { return paymentClient.getPayment(orderId); }\n```\nRetries only make sense paired with a sensible **timeout** — without one, a single slow call to C can hang B far longer than expected, and B retrying a request that's still technically in flight risks duplicate processing (see Q16 on idempotency). Retries are usually combined with **exponential backoff** (wait longer between each attempt) so a struggling service isn't immediately hit with a second wave of retries on top of the first failure.\n\n**Resilience4j specifics:** `@Retry` defaults to 3 attempts with a 500ms wait; turn on `enableExponentialBackoff` for growing delays. Retry only at one layer of a call chain: if a gateway, `Order` and `Payment` each retry 3 times, one user request can become 27 calls to the failing bank API. See the expert doc, Q3, for how `@Retry` stacks with `@CircuitBreaker`.\n\n## 16. Why does idempotency matter when B retries a failed call to C?\nIf B calls C, the request actually succeeds on C's end, but the *response* to B is lost (timeout, network blip) — B doesn't know it succeeded, and retries. If \"create a payment\" isn't idempotent, that retry creates a **second** payment. Making an endpoint idempotent (e.g. requiring an `Idempotency-Key` header, or designing \"create payment for order X\" so calling it twice for the same order X is a no-op the second time) means B's retry is always safe, regardless of whether the original call actually got through.\n\n## 17. Why is having no timeout on a synchronous call dangerous?\nIf B calls C with no timeout configured and C hangs (not down, just very slow), B's thread sits there waiting indefinitely. Under load, more and more of B's request-handling threads end up stuck waiting on the same slow C — eventually B runs out of threads entirely and can't serve *any* request, including ones that have nothing to do with C. This is **thread pool exhaustion**, and it's how one slow downstream service can take down an otherwise-healthy upstream service. Fix: always set an explicit timeout on inter-service calls, so a stuck call fails fast instead of holding a thread forever.\n\n## 18. What's the bulkhead pattern, and how does it relate to Q17?\nNamed after ship bulkheads (compartments that stop one flooded section from sinking the whole ship): isolate the resources (usually thread pool/connection limit) used for calling one downstream service from the resources used for everything else.\n```java\n// SEMAPHORE (the default): caps concurrent calls, runs on the caller's own thread\n@Bulkhead(name = \"paymentService\")\npublic PaymentDTO getPayment(Long orderId) { ... }\n\n// THREADPOOL: runs on a dedicated pool, so the method must return CompletableFuture\n@Bulkhead(name = \"paymentService\", type = Bulkhead.Type.THREADPOOL)\npublic CompletableFuture<PaymentDTO> getPaymentAsync(Long orderId) { ... }\n```\nResilience4j has two bulkhead types. The **semaphore** type limits how many calls may be in flight at once (`maxConcurrentCalls`); when the limit is reached, further calls fail with `BulkheadFullException` after `maxWaitDuration` (default 0, so immediately). The **thread-pool** type also isolates the work onto its own threads, which is why the method has to return a `CompletableFuture`.\nIf C is slow and its calls exhaust *their own* dedicated thread pool, B's other functionality (calls to other services, or requests that don't touch C at all) keeps working normally — the damage from Q17 stays contained to just the C-related calls instead of spreading to all of B.\n\n## 19. Orchestration vs. choreography — the short version\nTwo ways to coordinate multiple services for one business process. **Orchestration**: a central coordinator explicitly calls each service in sequence and decides what happens next (closer to how A calling B calling C works — someone is directing traffic). **Choreography**: no coordinator — each service reacts to events from the previous one and publishes its own event, and the overall flow emerges from everyone just doing their part (closer to the async event-chain style from Q4/Q14). Orchestration is easier to reason about/debug (one place shows the whole flow); choreography scales better and avoids a single coordinator becoming a bottleneck or single point of failure, at the cost of the overall flow being harder to see in one place.\n\n**বাংলায় — এটা কি Saga pattern?** হ্যাঁ, সরাসরি সম্পর্কিত — Orchestration আর Choreography হলো Saga pattern বাস্তবায়নের দুইটা আলাদা \"স্টাইল\", Saga-র বিকল্প কিছু না। Saga (spring-boot-expert Q7) মানে: প্রতিটা step একটা local transaction, কোনো step fail করলে compensating transaction দিয়ে আগের step গুলো undo করা হয়। পার্থক্যটা শুধু — **\"কে ঠিক করে দেয় পরের কাজটা কী\"**:\n\n```\nSaga pattern = \"প্রতিটা step local transaction, fail করলে compensate করে undo করা\"\n                            │\n              ┌─────────────┴─────────────┐\n              ▼                           ▼\n      Orchestration style          Choreography style\n```\n\n- **Orchestration** — একটা central coordinator সরাসরি প্রতিটা service-কে call করে, ক্রমানুসারে, আর সিদ্ধান্ত নেয় পরে কী হবে:\n  ```\n  Orchestrator ──► Order service (create order)\n               ──► Payment service (charge)\n               ──► Inventory service (reserve stock)\n  ```\n- **Choreography** — কোনো central coordinator নেই। প্রতিটা service নিজের কাজ শেষ করে একটা event publish করে, পরের service সেই event শুনে নিজের কাজ করে:\n  ```\n  Order service ──event: OrderPlaced──► Payment service\n  Payment service ──event: PaymentDone──► Inventory service\n  ```\n\n**সহজ মনে রাখার নিয়ম:** Saga হলো \"ব্যাপারটা\" (local transaction + compensation দিয়ে distributed transaction সামলানো), আর orchestration/choreography হলো \"কীভাবে\" সেটা বাস্তবায়ন করবে — একটা central বস দিয়ে (orchestration), নাকি সবাই মিলে event শুনে নিজে নিজে (choreography)।\n\n## 20. What is contract testing, and why does it matter between A, B, and C?\nA way to verify that B's API still matches what A *expects* it to look like, without spinning up all three services together for every test. A defines a \"contract\" (example request/response pairs) against B's API; that contract is checked both from A's side (does A handle this shape correctly) and B's side (does B's real API actually still produce this shape) — commonly done with a tool like **Pact**. This catches \"B changed a field name and broke A\" *before* it reaches a shared staging environment, which matters more as the number of services (and teams owning them) grows — nobody wants to manually re-test every A→B→C combination after every deploy.\n"}, {"id": "sbbasic", "title": "Spring Boot basics", "group": "Spring Boot", "path": "interview-questions/spring-boot/spring-boot-basic-questions.md", "q": 16, "lines": 225, "md": "# Spring Boot — Basic Interview Questions\n\nPaired with the runnable example at `src/com/shihab/springboot` (an Employee\nManagement REST API). Each question below points to where that concept\nshows up in the code.\n\n## 1. What is Spring Boot and how is it different from the Spring Framework?\nSpring Boot is an opinionated layer on top of the Spring Framework that removes boilerplate configuration: auto-configuration, embedded servers (Tomcat/Jetty), starter dependencies, and sensible defaults so you can run a production-ready app with minimal setup. Plain Spring requires you to wire most of this manually (XML or Java config).\n\n**Concretely, what does \"removes boilerplate\" mean?** With plain Spring (pre-Boot), running this project's Employee API would require: manually declaring a `DispatcherServlet` in `web.xml`, wiring an embedded Tomcat yourself (or deploying a WAR to an external server), configuring a `DataSource` bean, an `EntityManagerFactory` bean, a `TransactionManager` bean, and a Jackson `ObjectMapper` for JSON — all by hand, typically in XML.\n\nWith Spring Boot, `build.gradle` declares one starter dependency (`spring-boot-starter-web`), and `@SpringBootApplication` on `SpringBootInterviewApplication.java` does the rest: it detects Tomcat and spring-webmvc on the classpath and auto-configures the whole web stack, detects the H2 driver + Spring Data JPA and auto-configures the `DataSource`/`EntityManagerFactory`/`TransactionManager`, and `mvn`/`gradle bootRun` gives you a runnable, embedded-server app with `public static void main` — no external app server, no XML. That's the \"opinionated defaults\" trade: less control over each bean's wiring, in exchange for almost none of it being your problem until you need to override something.\n\n## 2. What is a bean?\nA bean is an object that the Spring container (the `ApplicationContext`) creates, configures, and manages the lifecycle of, instead of your code doing `new SomeClass()` yourself. Once a class is registered as a bean, Spring can inject it wherever it's needed — that's the mechanism dependency injection (Q4) actually runs on.\n\nEvery one of `EmployeeServiceImpl`, `EmployeeController`, and `DataLoader` in this project is a bean. None of them is ever constructed with `new` anywhere in the codebase — Spring creates each one once, at startup, because the class is annotated `@Service`/`@RestController`/`@Component` and sits in a component-scanned package (Q3). Once created, Spring hands the right instance to whatever constructor asks for it:\n```java\n@RestController\npublic class EmployeeController {\n    private final EmployeeService employeeService;\n\n    public EmployeeController(EmployeeService employeeService) {  // Spring injects the EmployeeServiceImpl bean here\n        this.employeeService = employeeService;\n    }\n}\n```\nSpring sees `EmployeeController` needs an `EmployeeService`, finds the `EmployeeServiceImpl` bean it already created, and passes it in — no code anywhere says \"use `EmployeeServiceImpl`\" explicitly; the wiring is entirely up to the container.\n\nA few details worth knowing:\n- **Default scope is singleton** — Spring creates exactly one instance of a given bean per application context and reuses it everywhere, rather than a new instance per injection or per HTTP request.\n- **Two ways to register a bean**: component scanning (`@Component`/`@Service`/`@Repository`/`@Controller` on a class you own, like everything in this project), or an explicit `@Bean`-annotated method inside a `@Configuration` class (typically for third-party classes you don't own the source of, e.g. a `RestTemplate` or a custom `ObjectMapper`).\n- **The container is the `ApplicationContext`** — you can ask it directly for a bean (`applicationContext.getBean(EmployeeService.class)`), though in practice you almost never do this manually; you declare what you need as a constructor parameter and let Spring inject it instead.\n\n## 3. What does `@SpringBootApplication` do?\nIt's a combination of three annotations: `@Configuration` (this class can define beans), `@ComponentScan` (scan this package and sub-packages for components), and `@EnableAutoConfiguration` (configure beans automatically based on what's on the classpath). See `SpringBootInterviewApplication.java`.\n\nSince it sits at `com.shihab.springboot`, `@ComponentScan` picks up `EmployeeController`, `EmployeeServiceImpl`, and `DataLoader` from the sub-packages automatically — which is also why this class isn't placed directly under `com.shihab` (that would scan every unrelated package in the repo too). `@EnableAutoConfiguration` is what sees `spring-boot-starter-web`/`spring-boot-starter-data-jpa` on the classpath and wires up the embedded Tomcat, `DataSource`, and `EntityManagerFactory` for you.\n\n## 4. What is dependency injection, and what are the ways to do it in Spring?\nInstead of a class creating its own dependencies, the framework supplies them. Three ways: constructor injection (recommended — see `EmployeeServiceImpl`, `EmployeeController`), setter injection, and field injection (`@Autowired` on a field — discouraged because it hides dependencies and makes unit testing without Spring harder).\n\n`EmployeeServiceImpl` uses constructor injection without even needing an explicit `@Autowired`:\n```java\n@Service\npublic class EmployeeServiceImpl implements EmployeeService {\n    private final EmployeeRepository employeeRepository;\n\n    public EmployeeServiceImpl(EmployeeRepository employeeRepository) {\n        this.employeeRepository = employeeRepository;\n    }\n    // ...\n}\n```\n(Since Spring 4.3, `@Autowired` is optional on a constructor if the class has exactly one.)\n\n**Why this matters in practice — testability.** Because the dependency is a `final` field set through the constructor, you can unit test `EmployeeServiceImpl` with a plain Mockito mock and zero Spring context:\n```java\n@Test\nvoid getEmployeeById_throwsWhenMissing() {\n    EmployeeRepository mockRepo = mock(EmployeeRepository.class);\n    when(mockRepo.findById(99L)).thenReturn(Optional.empty());\n\n    EmployeeServiceImpl service = new EmployeeServiceImpl(mockRepo);\n\n    assertThrows(ResourceNotFoundException.class, () -> service.getEmployeeById(99L));\n}\n```\nThat test runs in milliseconds with no `@SpringBootTest`, no embedded database, nothing. If `employeeRepository` were instead a private field with `@Autowired` (field injection), you couldn't construct `EmployeeServiceImpl` with a mock at all without reflection tricks — you'd be forced into a slower, heavier Spring-context-based test just to check one branch of logic. That's the concrete cost field injection has, beyond just \"it's discouraged.\"\n\n## 5. What's the difference between `@Component`, `@Service`, `@Repository`, and `@Controller`?\nAll four register a class as a Spring bean via component scanning — `@Service`, `@Repository`, and `@Controller` are just `@Component` under the hood, with extra meaning layered on:\n\n- `@Component` — generic bean, no special role (`DataLoader`)\n- `@Service` — business logic (`EmployeeServiceImpl`)\n- `@Controller`/`@RestController` — web layer (`EmployeeController`)\n- `@Repository` — data access; also auto-translates low-level DB exceptions (e.g. `SQLException`) into Spring's `DataAccessException` — so callers don't need to know if they're on H2, MySQL, or Postgres\n\n`EmployeeRepository` gets that `@Repository` behavior for free, just by extending `JpaRepository`.\n\n## 6. What is Spring Data JPA, and how do \"derived query methods\" work?\nAn abstraction over JPA that generates repository implementations at runtime — you write an interface, Spring provides the SQL/JPQL behind it.\n\n```java\npublic interface EmployeeRepository extends JpaRepository<Employee, Long> {\n    List<Employee> findByDepartment(Department department);\n    Optional<Employee> findByEmail(String email);\n}\n```\nNo implementation exists anywhere — Spring parses the method name (`findBy` + `Department`) and generates `SELECT e FROM Employee e WHERE e.department = :department` automatically.\n\nMore examples the parser understands: `findByLastNameOrderByJoinDateDesc(...)` (sorting), `countByDepartment(...)` (aggregate), `existsByEmail(...)` (boolean).\n\n**Limit:** once a query needs a join, subquery, or DB-specific function, drop to `@Query(\"...\")` (JPQL) or `@Query(nativeQuery = true)` (raw SQL) instead.\n\n## 7. What is the difference between `@Entity` and a DTO? Why not return entities directly from a controller?\n`@Entity` (`Employee.java`) maps to a DB table and stays inside the persistence layer. A DTO (`EmployeeDTO.java`) is the shape exposed to clients. `EmployeeServiceImpl` converts between them explicitly on the way in and out:\n\n```java\n// Entity -> DTO (out)          // DTO -> Entity (in, see createEmployee)\nnew EmployeeDTO(employee.getId(), ...);   new Employee(dto.getFirstName(), ...);\n```\n\nWhy bother with two classes for the same data? A few concrete reasons: `EmployeeDTO` carries validation annotations (`@NotBlank`, `@Email`) that shouldn't apply to every path creating an `Employee` (e.g. `DataLoader` seeding data); returning entities risks Jackson serializing a lazy-loading proxy if the entity later gains a relationship (`LazyInitializationException`); and it decouples your API contract from your DB schema — change the table, don't break every client.\n\n## 8. What does `@Transactional` do?\nWraps a method in a database transaction: commits on success, rolls back on unchecked exceptions.\n\n```java\n@Transactional(readOnly = true)                       // hint: no writes, skip dirty-checking overhead\npublic List<EmployeeDTO> getAllEmployees() { ... }\n\n@Transactional                                        // full read-write transaction\npublic EmployeeDTO createEmployee(EmployeeDTO dto) { ... }\n```\n\nTwo gotchas worth knowing:\n- **Rollback is unchecked-exceptions-only by default** — a checked exception thrown inside a `@Transactional` method still commits. Use `@Transactional(rollbackFor = SomeCheckedException.class)` to override.\n- **It's a proxy, so self-calls don't work** — calling a `@Transactional` method from another method in the *same* class (`this.someMethod()`) skips the proxy, silently losing the transaction. Only calls from outside the bean apply it (e.g., `EmployeeController` → `EmployeeServiceImpl`).\n\n## 9. What is \"dirty checking\" in JPA/Hibernate?\nWithin an open transaction, Hibernate tracks changes to **managed** entities and issues an `UPDATE` automatically at commit — no explicit `save()` needed.\n\n```java\n@Transactional\npublic EmployeeDTO updateEmployee(Long id, EmployeeDTO dto) {\n    Employee employee = findEmployeeOrThrow(id);   // managed — came from findById in this same transaction\n    employee.setFirstName(dto.getFirstName());\n    // ...more setters, no employeeRepository.save() call anywhere\n    return toDTO(employee);\n}\n```\nHibernate compares the entity's values at commit time against the snapshot taken when it was loaded, and writes an `UPDATE` for whatever changed.\n\n**Managed vs. detached is the key distinction:** this only works because `employee` is still tracked (loaded in the same transaction). A detached entity (loaded in a closed transaction, or built manually) needs an explicit `employeeRepository.save(employee)` — which is exactly why `createEmployee` (a brand-new entity) calls `save()` but `updateEmployee` doesn't.\n\n## 10. How do you validate incoming request bodies in Spring Boot?\nAnnotate DTO fields with Bean Validation constraints (`@NotBlank`, `@Email`, `@Positive` — see `EmployeeDTO`), then add `@Valid` to the controller parameter:\n```java\n@PostMapping\npublic ResponseEntity<EmployeeDTO> createEmployee(@Valid @RequestBody EmployeeDTO employeeDTO) { ... }\n```\nAn invalid body (blank name, bad email, negative salary) fails all three rules at once, and Spring collects every violation into a `MethodArgumentNotValidException` — handled centrally by `GlobalExceptionHandler` (Q11), returning one response listing every failing field instead of a raw 500.\n\nRequires `spring-boot-starter-validation` on the classpath (already in `build.gradle`) — without it, `@Valid` is silently ignored.\n\n## 11. How do you handle exceptions/errors globally in Spring Boot?\nWith `@RestControllerAdvice` + `@ExceptionHandler` methods (see `GlobalExceptionHandler.java`) — intercepts exceptions from any controller and converts them into a consistent JSON error, instead of a raw stack trace.\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n    @ExceptionHandler(ResourceNotFoundException.class)       public ... handleNotFound(...) { ... }   // -> 404\n    @ExceptionHandler(MethodArgumentNotValidException.class) public ... handleValidation(...) { ... } // -> 400\n    @ExceptionHandler(Exception.class)                       public ... handleGeneric(...) { ... }    // -> 500\n}\n```\nSpring picks the *most specific* matching handler for a thrown exception's type. Doing this globally (instead of try/catch in every controller method) means one place to maintain, and every error comes back in the same shape (`ApiError`: timestamp, status, message, details) — regardless of which handler produced it.\n\n## 12. What is `CommandLineRunner` used for?\nA functional interface whose `run()` method fires once, right after the Spring context starts — used here in `DataLoader` to seed 3 demo employees, so `GET /api/employees` already returns data with no manual setup.\n\n```java\n@Component\npublic class DataLoader implements CommandLineRunner {\n    public void run(String... args) {\n        employeeRepository.save(new Employee(\"Ada\", \"Lovelace\", ...));\n    }\n}\n```\n\n`ApplicationRunner` is the alternative — same idea, but gives you parsed `ApplicationArguments` instead of a raw `String[]`, handy if startup logic needs to branch on flags.\n\nGotcha: with multiple runner beans, execution order isn't guaranteed unless you add `@Order(1)`, `@Order(2)`, etc.\n\n## 13. What embedded server does Spring Boot use by default, and can you change it?\nTomcat, via `spring-boot-starter-web`. Swap it for Jetty or Undertow by excluding the Tomcat starter and adding the alternative:\n```groovy\nimplementation('org.springframework.boot:spring-boot-starter-web') {\n    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'\n}\nimplementation 'org.springframework.boot:spring-boot-starter-jetty'\n```\nNo application code changes — the server is purely an auto-configured infrastructure concern (Q1). Teams usually only switch for a specific reason (Undertow's smaller memory footprint, etc.), not by default.\n\n## 14. What is `application.properties` (or `.yml`) for?\nExternalized configuration — datasource URLs, ports, logging, feature flags — without touching code:\n```properties\nspring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1\nspring.jpa.hibernate.ddl-auto=create-drop\nserver.port=8080\n```\nNone of this appears in Java code — auto-configuration reads it at startup and wires the `DataSource`/`EntityManagerFactory`/Tomcat accordingly.\n\n**Profiles:** real projects usually add `application-prod.properties` etc., overriding a subset of values (e.g. a real Postgres URL instead of H2). `spring.profiles.active=prod` picks which one loads, so the same jar runs anywhere.\n\n## 15. What's the difference between `@PathVariable` and `@RequestParam`?\n`@PathVariable` reads a value from the URL path; `@RequestParam` reads it from the query string.\n\n```java\n@GetMapping(\"/{id}\")\npublic EmployeeDTO getEmployeeById(@PathVariable Long id) { ... }     // GET /api/employees/7\n\n@GetMapping\npublic List<EmployeeDTO> getEmployees(@RequestParam(required = false) Department department) { ... }\n                                                                        // GET /api/employees?department=ENGINEERING\n```\nRule of thumb: `@PathVariable` when the value identifies *which resource* (the URL is meaningless without it, like an id). `@RequestParam` for optional filters/sorting — the request is still valid without it.\n\n## 16. How would you test this layered architecture?\nEach layer gets a progressively wider (and slower) test slice:\n\n- **Unit test** `EmployeeServiceImpl` with a mocked `EmployeeRepository` (Mockito) — no Spring context, milliseconds. See Q4's example.\n- **`@WebMvcTest(EmployeeController.class)`** — loads only the web layer, service mocked via `@MockBean`. Good for verifying routing, JSON, validation, and `GlobalExceptionHandler` wiring (e.g. asserting a missing employee returns 404).\n- **`@DataJpaTest`** — loads only the JPA layer against a real in-memory H2 DB. Verifies a derived query like `findByDepartment` actually returns the right rows, not just that it compiles.\n- **`@SpringBootTest`** — the full context, real HTTP round-trip through controller → service → repository → H2.\n\nA healthy suite leans on the first two for speed, uses `@DataJpaTest` for query-specific logic, and reserves `@SpringBootTest` for a handful of critical end-to-end paths.\n\n## How to run the example\n```bash\n./gradlew bootRun\n```\nThen hit `http://localhost:8080/api/employees`. The H2 console is available at `http://localhost:8080/h2-console` (JDBC URL `jdbc:h2:mem:employeedb`, user `sa`, empty password).\n"}, {"id": "sbexpert", "title": "Spring Boot expert", "group": "Spring Boot", "path": "interview-questions/spring-boot/spring-boot-expert-questions.md", "q": 15, "lines": 157, "md": "# Spring Boot — Expert-Level Interview Questions\n\nBuilds on `spring-boot-basic-questions.md`. Past single-service CRUD into microservices, resilience, and production-scale concerns.\n\n## 1. How do you configure multiple datasources (Postgres + Oracle + MongoDB)?\nBoot auto-configures only **one** primary `DataSource`. Each extra relational source needs its own `@Configuration` class (own `DataSource`/`EntityManagerFactory`/`TransactionManager`, scoped via `@EnableJpaRepositories`), with exactly one marked `@Primary`.\n```java\n@Configuration\n@EnableJpaRepositories(basePackages = \"com.company.orders.postgres\",\n        entityManagerFactoryRef = \"postgresEmf\", transactionManagerRef = \"postgresTx\")\npublic class PostgresConfig {\n    @Primary @Bean @ConfigurationProperties(\"spring.datasource.postgres\")\n    public DataSource postgresDataSource() { return DataSourceBuilder.create().build(); }\n    // + EntityManagerFactory, TransactionManager beans, same pattern repeated for Oracle\n}\n```\nMongoDB is separate again — `spring-boot-starter-data-mongodb` auto-configures its own `MongoTemplate`/`MongoRepository` stack independently, since it isn't JPA/relational at all.\n\nWhy three stores: Postgres for transactional core data, Oracle because a legacy system already owns it, MongoDB for flexible/high-volume documents (logs, audit trails) that don't fit a fixed schema.\n\n## 2. How does Actuator tie into Kubernetes health checks?\nSince Boot 2.3+: **liveness** (`/actuator/health/liveness` — is the process fundamentally broken?) vs **readiness** (`/actuator/health/readiness` — can it serve traffic right now, e.g. DB up?).\n```yaml\nlivenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8080 } }\nreadinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 } }\n```\nGotcha: tying liveness to a flaky downstream dependency causes needless pod restarts — liveness should only reflect \"this process is broken,\" not \"a dependency is slow.\"\n\n## 3. What's the circuit breaker pattern (Resilience4j)?\nStops calling a failing downstream service for a while instead of piling up timeouts.\n```java\n@CircuitBreaker(name = \"employeeService\", fallbackMethod = \"fallback\")\npublic EmployeeDTO getEmployeeById(Long id) { ... }\npublic EmployeeDTO fallback(Long id, Throwable t) { return EmployeeDTO.unknown(id); }\n```\nStates: **closed** (normal) → **open** (failures exceed threshold, fail fast, no network call) → **half-open** (test a few calls) → closed or open again. Often paired with `@Retry` and `@Bulkhead` (limits concurrent calls).\n\n### Resilience4j at a glance\n**Setup (Boot 3):** `io.github.resilience4j:resilience4j-spring-boot3` plus `spring-boot-starter-aop` (the annotations work through Spring AOP proxies). Configure each named instance under `resilience4j.<module>.instances.<name>` in `application.yml`.\n\n**Modules:** `CircuitBreaker`, `Retry`, `Bulkhead`, `TimeLimiter`, `RateLimiter`, `Cache`.\n\n| Module | Protects against | Key settings |\n|---|---|---|\n| CircuitBreaker | A dependency that keeps failing or is very slow | `slidingWindowSize`, `minimumNumberOfCalls`, `failureRateThreshold`, `waitDurationInOpenState`, `permittedNumberOfCallsInHalfOpenState` |\n| Retry | Short transient failures | `maxAttempts` (default 3), `waitDuration` (default 500ms), `enableExponentialBackoff` |\n| Bulkhead | One slow dependency eating all your threads | `maxConcurrentCalls`, `maxWaitDuration` (default 0) |\n| TimeLimiter | A call that hangs (needs an async return type such as `CompletableFuture`) | `timeoutDuration` |\n| RateLimiter | Calling a dependency (or being called) too often | `limitForPeriod`, `limitRefreshPeriod` |\n\n**How the circuit breaker moves:** it opens when the failure rate over the sliding window reaches the threshold (after `minimumNumberOfCalls`). After `waitDurationInOpenState` it goes to half-open on the next call (unless `automaticTransitionFromOpenToHalfOpenEnabled=true`), admits only `permittedNumberOfCallsInHalfOpenState` trial calls, then closes if their failure rate is under the threshold, or reopens.\n\n**Fallback rules:** the fallback method must return the same type, take the same parameters, and accept the exception as an extra last parameter. Several fallbacks can be declared for different exception types.\n\n**Stacking order** when several annotations are on one method: `Retry ( CircuitBreaker ( RateLimiter ( TimeLimiter ( Bulkhead ( method ) ) ) ) )`. Retry is outermost, so each retry attempt counts as a separate call to the breaker.\n\n**Gotchas:**\n- **Self-invocation bypasses the proxy.** Calling the annotated method from another method in the same class runs it without any protection (same proxy pitfall as `@Transactional`).\n- **Retries multiply across layers.** Three layers with 3 attempts each can send 27 calls to a struggling dependency. Retry at one layer, with backoff and jitter, inside the overall deadline.\n- **Only retry idempotent calls**, or pair the retry with an idempotency key (see microservices Q16).\n- **An open breaker throws `CallNotPermittedException`.** Map it to `503 Service Unavailable` in the `@RestControllerAdvice`; otherwise a catch-all `@ExceptionHandler(Exception.class)` (as in this repo's `GlobalExceptionHandler`) turns it into a `500`.\n\n**In this repo:** Resilience4j is not used yet, because everything is one monolith with local calls. It becomes relevant when `Order` calls a separate `Payment` or `Catalog` service, or when calling an external API.\n\n## 4. How does distributed tracing work across microservices?\nA **trace ID** (whole request) + **span ID** (per hop) propagate via headers across services, so logs/spans correlate into one timeline. Micrometer Tracing auto-instruments HTTP/DB calls, exports to Zipkin/Jaeger — no manual span code needed for the common case. It's the tool for \"why is this one request slow\" when logs alone can't reconstruct the call graph.\n\n## 5. Spring MVC vs. WebFlux?\nMVC: thread-per-request, blocking — a thread is held until the response completes. WebFlux: non-blocking (`Mono`/`Flux`, Project Reactor), a small fixed thread pool handles many concurrent requests.\n```java\n// MVC: EmployeeDTO getById(...)      WebFlux: Mono<EmployeeDTO> getById(...)\n```\nWebFlux pays off under high concurrency + slow I/O (gateways, streaming). For typical CRUD, MVC is simpler and the right default — and WebFlux only helps if the *whole* stack is non-blocking (standard JDBC/JPA defeats the purpose; needs R2DBC).\n\n## 6. How do you build a custom Spring Boot starter?\nA dependency bundling a library + an `@AutoConfiguration` class, activated conditionally:\n```java\n@AutoConfiguration\n@ConditionalOnClass(SomeAuditClient.class)      // only if the library's on the classpath\npublic class AuditAutoConfiguration {\n    @Bean @ConditionalOnMissingBean              // let consumers override\n    public AuditService auditService(AuditProperties props) { ... }\n}\n```\nRegistered via `META-INF/spring/...AutoConfiguration.imports`. `@ConditionalOn...` is the real mechanism behind \"how does auto-configuration work\" — it's exactly how Boot decides whether to wire a `DataSource` at all.\n\n## 7. How do you handle distributed transactions across services/datastores?\n`@Transactional` only covers one datasource — it doesn't reach across process boundaries. Standard pattern: **Saga** — a sequence of local transactions, each firing an event that triggers the next step, with **compensating transactions** to undo prior steps on failure (e.g. \"cancel order\" undoes \"reserve inventory\").\n\nTwo flavors: **choreography** (services react to each other's events, no coordinator — simple, harder to trace) vs **orchestration** (a central saga coordinator calls each step explicitly — visible, more complex). Bottom line for Postgres+MongoDB consistency: you generally design for *eventual* consistency, not strong.\n\n## 8. `@Async` vs. messaging (Kafka/RabbitMQ) for background work?\n`@Async` runs on a thread pool in the *same JVM* — fire-and-forget, lost on crash, doesn't scale past one instance.\n```java\n@Async\npublic void sendWelcomeEmail(Employee e) { ... }\n```\nA broker persists the work item outside the JVM — survives a crash, can be consumed by another instance/service, load-balances across consumers. Use `@Async` for cheap in-process work; use messaging when it must survive a crash or cross service boundaries.\n\n## 9. How do you tune HikariCP for production?\n```properties\nspring.datasource.hikari.maximum-pool-size=10   # bounded by DB max_connections & CPU cores, not \"as high as possible\"\nspring.datasource.hikari.connection-timeout=3000  # fail fast, don't queue forever\nspring.datasource.hikari.max-lifetime=1800000     # recycle before DB/LB kills it first\n```\nTrap: bigger pool ≠ more throughput past a point — more connections just means more DB-side contention. Also remember it's *per instance*: 10 pods × pool size 10 = 100 DB connections.\n\n## 10. How do you test against a real database instead of H2?\n**Testcontainers** — spins up real Postgres/MongoDB/Kafka in Docker for the test's lifetime.\n```java\n@Testcontainers @SpringBootTest\nclass EmployeeRepositoryIT {\n    @Container static PostgreSQLContainer<?> postgres = new PostgreSQLContainer<>(\"postgres:15\");\n    @DynamicPropertySource\n    static void props(DynamicPropertyRegistry r) { r.add(\"spring.datasource.url\", postgres::getJdbcUrl); }\n}\n```\nH2 is fine for fast, generic query-shape tests; Testcontainers is for confidence against the *actual* engine (Oracle-specific SQL, Postgres JSONB, etc.).\n\n## 11. How does stateless JWT auth work in microservices?\nClient sends a signed JWT on every request; a filter validates it and populates the security context — nothing stored server-side.\n```java\npublic class JwtAuthFilter extends OncePerRequestFilter {\n    protected void doFilterInternal(HttpServletRequest req, ...) {\n        if (jwtService.isValid(token)) SecurityContextHolder.getContext().setAuthentication(auth);\n    }\n}\n```\nOne auth service issues tokens; every downstream service only needs the shared signing key to *validate* locally — no callback per request, which is what makes it scale horizontally. `@PreAuthorize(\"hasRole('ADMIN')\")` layers authorization on top.\n\n## 12. `@Cacheable` vs. manually caching with Redis?\n`@Cacheable` is a declarative abstraction over whatever backend is configured (in-memory by default, Redis if configured):\n```java\n@Cacheable(value = \"employees\", key = \"#id\")\npublic EmployeeDTO getEmployeeById(Long id) { ... }\n@CacheEvict(value = \"employees\", key = \"#id\")\npublic void updateEmployee(Long id, EmployeeDTO dto) { ... }  // must evict, or reads go stale\n```\nGotcha: forgetting `@CacheEvict` on a new write path = stale data bugs. In-memory cache is also per-instance (pods don't see each other's writes) — the reason to use Redis once you're running more than one instance.\n\n## 13. How do you do graceful shutdown, and why does K8s care?\nWithout it, `SIGTERM` can kill the JVM mid-request, dropping in-flight calls.\n```properties\nserver.shutdown=graceful\nspring.lifecycle.timeout-per-shutdown-phase=30s\n```\nStops accepting new requests, lets in-flight ones finish (up to the timeout). Must line up with K8s' `terminationGracePeriodSeconds` — set that a bit higher, or K8s force-kills before Spring finishes draining.\n\n## 14. How do you reduce startup time / memory footprint (Kubernetes autoscaling)?\nSlow-starting pods delay absorbing traffic spikes.\n- **Lazy initialization** — beans created on first use, not all at startup.\n- **Exclude unused auto-configuration** explicitly.\n- **GraalVM native image** — ahead-of-time compiled binary; startup drops to milliseconds, smaller memory footprint, at the cost of longer builds and reflection/proxy limitations needing explicit hints.\n\n## 15. How do you rate-limit a Spring Boot API across multiple pods?\nA per-instance in-memory counter under-counts across pods (100 req/min *per pod*, not per user overall). Centralize the counter in Redis (sliding window/token bucket shared across instances), or push it up to an API Gateway (Spring Cloud Gateway, Kong) so no individual service reimplements it. Rate limiting is a cross-cutting concern — centralizing it avoids inconsistent per-service implementations.\n"}, {"id": "sbqa", "title": "Spring Boot interview Q&A", "group": "Spring Boot", "path": "interview-questions/spring-boot/spring-boot-interview-qa.md", "q": 85, "lines": 455, "md": "# Spring Boot Interview Questions - Self-Test (Basic + Expert)\n\n85 questions, each followed directly by its answer and a short explanation.\n\n**Based on:** Spring Boot 3.4 / Spring Framework 6.2 / Spring Security 6 / Hibernate 6 / Jakarta EE 10. Answers tagged `repo:` point at real code in this e-commerce project.\n\n**Related notes (same folder / repo):** [spring-boot-basic-questions.md](spring-boot-basic-questions.md), [spring-boot-expert-questions.md](spring-boot-expert-questions.md), [jpa-fetching-questions.md](jpa-fetching-questions.md), [microservices-communication-questions.md](microservices-communication-questions.md), [../rest-api/rest-api-basic-questions.md](../rest-api/rest-api-basic-questions.md), [../database/relational-db/relational-db-basics.md](../database/relational-db/relational-db-basics.md).\n\n## Contents\n\n- Basic: Core Spring Boot (Q1-Q12)\n- Basic: Security & Testing Basics (Q13-Q18)\n- Basic: MVC & REST (Q19-Q30)\n- Basic: Spring Data JPA Basics (Q31-Q40)\n- Expert: JPA & Hibernate Deep Dive (Q41-Q54)\n- Expert: Concurrency & Data Integrity (Q55-Q60)\n- Expert: Microservices with Spring (Q61-Q73)\n- Expert: Production Readiness (Q74-Q81)\n- Expert: Advanced Security & Testing (Q82-Q85)\n\n---\n\n# Part 1 - Basic\n\n## Core Spring Boot (Q1-Q12)\n\n**1. SecurityConfig takes a JwtFilter in its constructor, yet no code in the project ever calls new JwtFilter(...). What makes this work?**\n\nThis is inversion of control: the container, not your code, creates and wires objects. JwtFilter is a @Component in a scanned package, so it becomes a singleton bean that Spring passes to any constructor asking for it (see spring-boot-basic Q2). *(repo: SecurityConfig / JwtFilter)*\n\n**2. UserDetailsServiceImpl declares `private final UserRepository userRepository;` and sets it in its constructor. What is a concrete benefit over putting @Autowired on a private field?**\n\nWith constructor injection the object cannot exist without its dependencies, the field can be final, and plain Mockito tests can build it directly. Field injection hides the dependency and forces reflection or a Spring context in tests (see spring-boot-basic Q4). *(repo: UserDetailsServiceImpl)*\n\n**3. ECommerceApiApplication carries a single @SpringBootApplication annotation. Which annotations does it combine?**\n\n@SpringBootApplication is meta-annotated with @SpringBootConfiguration (a specialization of @Configuration), @EnableAutoConfiguration, and @ComponentScan. The scan starts at the annotated class's package, com.shihab.ecommerceapi, and covers its sub-packages. *(repo: ECommerceApiApplication)*\n\n**4. Boot's UserDetailsServiceAutoConfiguration (default in-memory user with a generated password) is guarded by @ConditionalOnMissingBean for types such as AuthenticationProvider and UserDetailsService. This project defines both beans. What happens?**\n\nAuto-configuration classes are processed after user configuration, so @ConditionalOnMissingBean can see your beans and skips its own definition. This back-off is how Boot lets you override its defaults simply by declaring a bean. *(repo: ApplicationConfiguration)*\n\n**5. The project's pom.xml declares spring-boot-starter-web, and the built jar runs with plain `java -jar` on a machine with no Tomcat installed. Why?**\n\nA starter is a dependency descriptor with no code of its own; spring-boot-starter-web transitively brings in spring-boot-starter-tomcat and Spring MVC. Boot's web server auto-configuration then starts embedded Tomcat within the application process (see spring-boot-basic Q13). *(repo: pom.xml)*\n\n**6. application.properties sets `security.jwt.secret-key=${JWT_SECRET_KEY}` with no default. application-test.properties sets the same key to a literal value. You start with the test profile active and JWT_SECRET_KEY unset. What happens?**\n\nProfile-specific files always override the non-specific ones for the same key. Without that override, the unresolvable placeholder makes the app fail fast at startup instead of running with a missing secret (see spring-boot-basic Q14). *(repo: application-test.properties)*\n\n**7. The jar's application.properties has server.port=8080. The container sets the environment variable SERVER_PORT=9090, and the app is launched with `java -jar app.jar --server.port=7070`. Which port is used?**\n\nBoot's externalized configuration lets later sources override earlier ones: packaged application.properties is overridden by OS environment variables, which are overridden by command-line arguments. This is what lets one jar run unchanged in any environment.\n\n**8. JwtService reads security.jwt.secret-key and security.jwt.expiration-time with separate @Value fields. What is a real advantage of @ConfigurationProperties(prefix = \"security.jwt\") for this?**\n\n@ConfigurationProperties gives type-safe binding of a prefix-grouped set of properties, full relaxed binding (e.g. env-var style names), and Bean Validation via @Validated. @Value is fine for a single value but supports SpEL instead and only limited relaxed binding. *(repo: JwtService)*\n\n**9. JwtService is annotated only with @Service and no @Scope. What is its scope, and what follows from that?**\n\nSingleton is the default bean scope: the container creates one instance and reuses it everywhere. Any mutable field in such a bean is shared across all concurrent requests, so per-request state does not belong there (see spring-boot-basic Q2). *(repo: JwtService)*\n\n**10. JwtService declares `@Value(\"${security.jwt.secret-key}\") private String secretKey;` on a field. Why would reading secretKey inside a constructor of JwtService give null?**\n\nBean creation is instantiate, then populate properties and injected fields, then initialization callbacks (@PostConstruct, InitializingBean). Constructor parameters are available immediately, which is another reason to prefer constructor injection. *(repo: JwtService)*\n\n**11. BCryptPasswordEncoder is a Spring Security class the project cannot annotate. How does ApplicationConfiguration make it available for injection?**\n\nStereotype annotations like @Component only apply to classes whose source you own. For third-party classes, a @Bean method inside a @Configuration class is the way to register an instance (see spring-boot-basic Q2). *(repo: ApplicationConfiguration.passwordEncoder())*\n\n**12. Two beans depend on each other through constructors:**\n\n```java\n@Service class OrderService { OrderService(PaymentService p) {} }\n@Service class PaymentService { PaymentService(OrderService o) {} }\n```\n\n**What happens at startup on Spring Boot 3.4 with default settings?**\n\nA constructor cycle cannot be satisfied because each object needs the other to exist first, and this fails even if spring.main.allow-circular-references is enabled. Since Boot 2.6, setter and field cycles are also rejected by default; the fix is to redesign the dependency (or, as a last resort, use @Lazy).\n\n## Security & Testing Basics (Q13-Q18)\n\n**13. SecurityConfig calls `.addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)`. What does this do?**\n\nSpring Security runs an ordered list of filters inside a SecurityFilterChain, and addFilterBefore positions a custom filter relative to a known one. The JWT filter must run before AuthorizationFilter so the request is already authenticated when access rules such as anyRequest().authenticated() are evaluated. *(repo: SecurityConfig)*\n\n**14. A caller sends a valid JWT for an existing account to an endpoint that requires a role the account does not have. Under standard Spring Security behavior, what is the outcome?**\n\nAuthentication establishes who the caller is; authorization decides what that identity may do. An authenticated caller who fails an access check gets 403 from the access-denied handler, whereas the entry point (HttpStatusEntryPoint returning 401 here) is used for callers who are not authenticated. *(repo: SecurityConfig)*\n\n**15. JwtService signs tokens with HS256 using the configured secret key. Which statement about the resulting JWT is correct?**\n\nA signed JWT (JWS) is encoded, not encrypted: the claims can be decoded by anyone, so never put secrets in them. The server validates the signature and the expiry claim itself, which is why no server-side session is needed (stateless auth). *(repo: JwtService)*\n\n**16. ApplicationConfiguration exposes a BCryptPasswordEncoder, and calling encode(\"secret\") twice returns two different strings. How should a login check verify a password?**\n\nBCrypt is a one-way, salted, adaptive hash: each encode() generates a fresh random salt and stores it inside the resulting string. matches() extracts that salt, re-hashes the raw password, and compares the results, so hashes are never decrypted or compared directly. *(repo: ApplicationConfiguration.passwordEncoder())*\n\n**17. CartControllerTest uses @WebMvcTest(controllers = CartController.class) and declares `@MockBean CartService cartService`. Why is that mock needed?**\n\nA test slice builds only the beans relevant to one layer: @WebMvcTest covers controllers, advice, converters, and filters, but not @Service or @Repository beans. @DataJpaTest slices the JPA layer, and @SpringBootTest loads the full context (see spring-boot-basic Q16). *(repo: CartControllerTest)*\n\n**18. CartServiceTest uses @Mock with MockitoExtension, while CartControllerTest uses @MockBean. What is the difference?**\n\n@Mock has no Spring involvement, so it suits fast unit tests with @InjectMocks. @MockBean puts the mock into the Spring test context so that MockMvc and other beans use it. Since Boot 3.4 it is deprecated in favour of Spring Framework 6.2's @MockitoBean, which does the same job but is not identical (for example, it is not supported on @Configuration classes). *(repo: CartServiceTest / CartControllerTest)*\n\n## MVC & REST (Q19-Q30)\n\n**19. What does the @RestController annotation add compared with a plain @Controller?**\n\n@RestController is a meta-annotation combining @Controller and @ResponseBody. Every handler's return value is serialized by an HttpMessageConverter (Jackson for JSON) instead of being treated as a view name. *(repo: ProductController)*\n\n**20. CartController.getCart declares `@RequestParam Integer userId`. A client calls GET /api/v1/cart with no query string. With default settings, what happens?**\n\n@RequestParam is required by default, so a missing parameter raises MissingServletRequestParameterException before the method body runs; the repo's GlobalExceptionHandler maps it to 400 as well. Use required = false or a defaultValue to make it optional. *(repo: CartController.getCart)*\n\n**21. ProductController.create builds a URI as shown and returns it via ResponseEntity.created(location). For a POST to /api/v1/products that saves id 7, what does the client receive?**\n\n```java\nServletUriComponentsBuilder.fromCurrentRequest()\n    .path(\"/{id}\")\n    .buildAndExpand(saved.getId())\n    .toUri();\n```\n\nThe builder starts from the current request URL (/api/v1/products), appends /{id} and expands it with the saved id. ResponseEntity.created(location) sets status 201 and the Location header, telling the client where the new resource lives. *(repo: ProductController.create)*\n\n**22. ProductController.delete returns `ResponseEntity.noContent().build()`. What does a client receive after a successful DELETE /api/v1/products/7?**\n\nnoContent() sets status 204, which by definition carries no response body. The ResponseEntity<Void> return type matches that: there is nothing to serialize. *(repo: ProductController.delete)*\n\n**23. ProductController.create takes `@Valid @RequestBody Product product`, and Product.name is @NotBlank. A client POSTs `{\"name\": \"\"}`. What happens by default?**\n\n@Valid on a @RequestBody makes Spring run Bean Validation right after deserialization; on failure it throws MethodArgumentNotValidException and the handler never executes. In this repo the exception is caught by GlobalExceptionHandler and returned as a 400 ValidationErrorResponse. *(repo: ProductController.create; GlobalExceptionHandler.handleValidationException)*\n\n**24. What is the difference between @Valid and @Validated?**\n\n@Valid comes from the Jakarta Bean Validation spec and has no groups attribute. @Validated is Spring's own annotation, which adds group selection (and, at class level, method-level validation).\n\n**25. ProductController.getById calls `productService.findById(id).orElseThrow(() -> new EntityNotFoundException(...))`. How does the client end up with a 404 response?**\n\n@RestControllerAdvice is @ControllerAdvice plus @ResponseBody, so its @ExceptionHandler methods apply to all controllers and return serialized bodies. GlobalExceptionHandler maps EntityNotFoundException to a 404 ApiErrorResponse. *(repo: GlobalExceptionHandler.handleEntityNotFoundException)*\n\n**26. In Spring Framework 6 and Spring Boot 3, what is ProblemDetail?**\n\nProblemDetail is Spring's container for the RFC 9457 (formerly RFC 7807) standard error body, rendered with the application/problem+json media type. Setting spring.mvc.problemdetails.enabled=true makes Boot use it for built-in MVC exceptions.\n\n**27. An endpoint produces JSON only (no XML converter is on the classpath) and a client sends `Accept: application/xml`. With default Spring MVC behaviour and no custom exception handlers, what status is returned?**\n\nContent negotiation matches the Accept header against the media types the handler can produce; with no match Spring throws HttpMediaTypeNotAcceptableException, which maps to 406. 415 is for an unsupported request Content-Type instead.\n\n**28. A controller method is declared `getAll(Pageable pageable)`. For `GET /products?page=0&size=10&sort=name,desc`, where do the Pageable values come from?**\n\nSpring Data's PageableHandlerMethodArgumentResolver, auto-configured by Boot when Spring Data web support is present, builds the Pageable from the page (zero-based), size and sort=property,direction query parameters.\n\n**29. All CRUD controllers in this repo are mounted under /api/v1/. What is the main trade-off of this URI-path versioning strategy?**\n\nPath versioning makes the version visible in every URL, which is simple to route, cache and try from a browser. The cost is that the resource URLs change per version. See rest-api Q8 for header and media-type alternatives. *(repo: All controllers under /api/v1/ (e.g. ProductController))*\n\n**30. A client times out and retries the same request. Comparing PUT /api/v1/products/42 (full body) with POST /api/v1/products, which statement is correct?**\n\nIdempotent means repeating the call leaves the same server state; PUT replaces the resource at a known URI, so repeats converge. POST typically creates a new resource each time. Idempotent is not the same as safe (see rest-api Q2). *(repo: ProductController.update / create)*\n\n## Spring Data JPA Basics (Q31-Q40)\n\n**31. Spring Data JPA sees this method on CartRepository. What does it do with it?**\n\n```java\nOptional<Cart> findByUserIdAndProductId(\n    Integer userId, Integer productId);\n```\n\nSpring Data parses the method name at startup: Cart has no userId property, so UserId is resolved as the nested path user.id (same for product.id), joined with AND. The Optional return type yields empty when no row matches. *(repo: CartRepository.findByUserIdAndProductId)*\n\n**32. CartRepository extends JpaRepository<Cart, Integer> and overrides `List<Cart> findAll()`. What does JpaRepository offer beyond CrudRepository?**\n\nJpaRepository (which extends ListCrudRepository and ListPagingAndSortingRepository) adds flush(), saveAllAndFlush(), deleteAllInBatch() and similar, and its finders return List rather than Iterable. Derived queries work with any repository interface. *(repo: CartRepository)*\n\n**33. A method annotated with @Transactional throws a checked exception (for example IOException). With default settings, what happens to the transaction?**\n\nSpring's default rule rolls back for unchecked exceptions (RuntimeException) and Error, but not for checked ones. Use @Transactional(rollbackFor = ...) to change that.\n\n**34. What does this method do to the database?**\n\n```java\n@Transactional\npublic void rename(Integer id) {\n    Product p = repo.findById(id).orElseThrow();\n    p.setName(\"New\");\n}\n```\n\nEntities loaded inside a transaction are managed; at flush time Hibernate compares them with their loaded snapshot (dirty checking) and writes an UPDATE for any changes. See spring-boot Q9.\n\n**35. ProductController.update calls `updatedProduct.setId(id)` and then `productService.save(updatedProduct)`, which delegates to JpaRepository.save. What does Spring Data JPA do?**\n\nSimpleJpaRepository.save checks whether the entity is new (for a wrapper id type and no version, id == null). New entities go through EntityManager.persist; others go through merge, which copies the state onto a managed instance. *(repo: ProductController.update; ProductService.save)*\n\n**36. Cart uses `@GeneratedValue(strategy = GenerationType.IDENTITY)`. What is a notable consequence compared with SEQUENCE?**\n\nWith IDENTITY the id only exists after the INSERT executes, so Hibernate cannot defer inserts and transparently disables insert batching. SEQUENCE can pre-allocate ids (pooled optimizer) and keep inserts batchable. *(repo: Cart)*\n\n**37. Given `@OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL, orphanRemoval = true) List<OrderItem> items`, what does orphanRemoval = true add?**\n\nCascadeType.REMOVE only propagates when the parent is removed. orphanRemoval = true additionally deletes a child row once it is removed from the parent's collection (at flush), instead of just detaching it.\n\n**38. How does this @Query differ from one declared with nativeQuery = true?**\n\n```java\n@Query(\"select p from Product p where p.price > :min\")\nList<Product> findExpensive(@Param(\"min\") Double min);\n```\n\nJPQL is written against the entity model (Product, p.price) and Hibernate translates it into the database's SQL dialect, which keeps it portable. A native query is passed as raw SQL using real table and column names.\n\n**39. application.properties sets `spring.jpa.hibernate.ddl-auto=update`. Why is that risky in production?**\n\nupdate makes Hibernate additively patch the schema on boot: it never drops or renames columns or migrates data, and the changes are unversioned and unreviewed. Production should use Flyway or Liquibase, with ddl-auto set to validate or none. *(repo: application.properties)*\n\n**40. A repository method returns `Slice<Product>` instead of `Page<Product>`. What is the difference?**\n\nA Page triggers an additional count query to know the total elements and pages, which can be expensive. A Slice only knows whether another slice follows, which is enough for infinite scroll or next/previous navigation.\n\n# Part 2 - Expert\n\n## JPA & Hibernate Deep Dive (Q41-Q54)\n\n**41. `Product` declares `@ManyToOne @JoinColumn(name = \"category_id\") private Category category;` with no fetch attribute. A job calls `productRepository.findAll()` on 500 products that belong to 8 categories. What does Hibernate 6 actually do?**\n\n`@ManyToOne` defaults to EAGER. `em.find`/`findById` can join it into the same SQL, but a JPQL or derived query like `findAll()` does not, so Hibernate fills each EAGER association with secondary selects; the persistence context de-duplicates repeated ids. See jpa-fetching Q1-Q3. *(repo: Product.category)*\n\n**42. A screen lists 100 `Order` rows and touches the lazy `@OneToMany items` of each, producing 101 queries. The repository method is a derived query you may not change; you can only change the entity mapping. Which change cuts the query count the most?**\n\n`@BatchSize` lets Hibernate initialize up to N pending lazy collections in one IN-list query, turning 100 lookups into roughly 100/20 extra queries. It is a mapping-level mitigation; JOIN FETCH or `@EntityGraph` remain the exact fix when you control the query (jpa-fetching Q4).\n\n**43. With `spring.jpa.open-in-view=false`, a new endpoint returns an `Order` entity and Jackson fails with `LazyInitializationException` on `items`. The service is under heavy load. Which fix is best?**\n\nDeciding the fetch plan per use case, inside the service/repository, keeps the connection short-lived and makes N+1 visible instead of hiding it. Keeping the session open across the web layer (OSIV or a controller transaction) holds a pooled connection during serialization. See jpa-fetching Q6. *(repo: application.properties open-in-view=false; CartRepository @EntityGraph)*\n\n**44. `findByUserId` is temporarily declared WITHOUT `@EntityGraph`, `open-in-view` is false and the caller has no transaction, so `Cart.product` is an uninitialized lazy proxy. After `Cart c = cartRepository.findByUserId(1).get(0);` which line throws `LazyInitializationException`?**\n\nOnly a call that needs state beyond the identifier forces initialization, and that needs an open Session. Holding or null-checking the proxy touches no data, and by default Hibernate answers `getId()` from the identifier the proxy already holds (unless `hibernate.jpa.compliance.proxy` is enabled). *(repo: Cart.product; CartRepository.findByUserId)*\n\n**45. `Order` has `List<OrderItem> items` and `List<Payment> payments`, both lazy `@OneToMany`. The query `select o from Order o join fetch o.items join fetch o.payments where o.id = :id` throws `MultipleBagFetchException`. An order has 20 items and 10 payments. Which fix avoids the exception AND the row explosion?**\n\nJoining two collections in one SQL produces items x payments = 200 rows per order, and with bags Hibernate cannot tell duplicates from real rows, so it refuses. Loading one collection per query in the same persistence context keeps each result at 20 and 10 rows and attaches both to the same managed `Order`. `Set` silences the exception but keeps the Cartesian product.\n\n**46. Suppose `OrderService.placeOrder` (`@Transactional`, default REQUIRED) calls `auditService.record(...)` on another bean whose method is `@Transactional(propagation = REQUIRES_NEW)`, and then throws a `RuntimeException`. What happens to the audit row?**\n\nREQUIRES_NEW suspends the current transaction and starts a new physical one, which commits or rolls back independently of the outer one. The cost is a second pooled connection held at the same time, and it only takes effect when the call crosses a Spring proxy (see Q52). *(repo: OrderService.placeOrder)*\n\n**47. PostgreSQL. Rows A and B in `oncall(doctor, on_duty)` are both on duty; the rule is that at least one must stay on duty.**\n\n```\nTx1: SELECT count(*) FROM oncall WHERE on_duty;  -- 2\nTx2: SELECT count(*) FROM oncall WHERE on_duty;  -- 2\nTx1: UPDATE oncall SET on_duty=false WHERE doctor='A'; COMMIT;\nTx2: UPDATE oncall SET on_duty=false WHERE doctor='B'; COMMIT;\n```\n\n**Both commit under REPEATABLE READ. What is this anomaly, and what prevents it?**\n\nUnder PostgreSQL's snapshot-based REPEATABLE READ each transaction sees its own snapshot and the two UPDATEs hit different rows, so both commit and violate the invariant. Only SERIALIZABLE detects the read/write dependency and raises a serialization failure (SQLSTATE 40001), so the application must retry. See relational-db Q10.\n\n**48. `Product` has `@Version private Long version;`. Two admins load the same product at version 5 and each saves a different stock value. What is the outcome?**\n\n@Version adds the expected version to the UPDATE's WHERE clause; a stale writer updates zero rows, Hibernate throws an optimistic-locking failure (Spring translates it to `ObjectOptimisticLockingFailureException`), and no DB lock is held while the user is thinking. The caller must reload and retry or report a conflict.\n\n**49. A flash sale decrements `Product.stock` for one hot product from about 500 concurrent requests. With `@Version` most updates fail and clients retry in storms. What does switching the lookup to `@Lock(LockModeType.PESSIMISTIC_WRITE)` change?**\n\nPESSIMISTIC_WRITE takes a row lock (`SELECT ... FOR UPDATE`) that is held until commit or rollback, serializing writers on the hot row instead of letting them fail and retry. Keep the transaction short, lock rows in a consistent order to avoid deadlocks, and expect lock-wait timeouts under load. *(repo: Product.stock)*\n\n**50. Under READ COMMITTED, inside one `@Transactional` method:**\n\n```\nProduct a = productRepository.findById(1).get();          // SELECT\n// another transaction commits: UPDATE products SET price = 99 WHERE id = 1\nProduct b = productRepository.findByName(a.getName()).get(); // JPQL\n```\n\n**What does `b.getPrice()` return?**\n\nThe persistence context guarantees one managed instance per id. A query still runs SQL, but each returned row is resolved to the instance already in the context, whose loaded state is not overwritten. Use `em.refresh(a)` or `em.clear()` to see newer data.\n\n**51. `CartController.getCart` calls `Collectors.groupingBy(Cart::getProduct, ...)`. `Product` (Lombok `@Getter`/`@Setter` only) overrides neither `equals` nor `hashCode`. Why does the grouping work today, and when would it silently break?**\n\nWithout an override, `Object` identity is used. Within one persistence context Hibernate returns a single instance per row id, which makes identity equal id-equality; detached copies, instances from another session, or a proxy versus a real instance would not be equal. A safe entity `equals` must be proxy-aware and based on a stable key. *(repo: CartController.getCart; Product)*\n\n**52. A teammate makes `CartService.bumpQuantity` public and adds `@Transactional(propagation = REQUIRES_NEW)` to it. `addToCart` (unannotated, same class) still calls it as `bumpQuantity(existing.get(), quantity)`. What does the annotation do for that call?**\n\nSpring's default proxy-based AOP only intercepts calls that enter through the proxy; a call on `this` from inside the same bean runs the raw method. Move the method to another bean, inject a self-reference, or use AspectJ weaving. *(repo: CartService.bumpQuantity)*\n\n**53. A service method is annotated `@Transactional(readOnly = true)` and by mistake modifies a loaded entity's field before returning. With Spring Boot 3.4 and Hibernate, which description is most accurate?**\n\nIn Spring's `HibernateJpaDialect` a read-only transaction sets `F
