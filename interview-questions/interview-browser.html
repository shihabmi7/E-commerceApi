<!doctype html><title>Interview Question Browser</title>


<style>
/* Layout: file list on the left, rendered markdown on the right; on phones the list and the reader swap. */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#dde3e8;
  --accent:#0b6e5c; --accent-soft:#dff1ec; --code-bg:#eef2f4; --code-fg:#15303a;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --panel:#162027; --fg:#e3eaef; --muted:#93a3b0; --line:#26343e;
  --accent:#4fc7ad; --accent-soft:#17382f; --code-bg:#0c1318; --code-fg:#cfe3e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --panel:#162027; --fg:#e3eaef; --muted:#93a3b0; --line:#26343e;
  --accent:#4fc7ad; --accent-soft:#17382f; --code-bg:#0c1318; --code-fg:#cfe3e8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-head{padding:18px 16px 12px;display:flex;flex-direction:column;gap:10px}
.side-head h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.side-head p{margin:0;color:var(--muted);font-size:13px}
#filter{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
#filter:focus-visible,.item:focus-visible,#back:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list{overflow-y:auto;padding:4px 8px 20px;min-height:0}
.group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 5px}
.item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);flex:none}
.item[aria-current="true"] .n{color:var(--accent)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
#back{display:none;background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;cursor:pointer}
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.doc{overflow-y:auto;padding:28px 24px 64px;min-height:0}
.md{max-width:780px;margin:0 auto;min-width:0;overflow-wrap:anywhere}
.md h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 18px;text-wrap:balance}
.md h2{font-size:20px;line-height:1.3;margin:34px 0 10px;padding-top:22px;border-top:1px solid var(--line);text-wrap:balance}
.md h3{font-size:16px;margin:24px 0 6px}
.md p,.md li{max-width:72ch}
.md a{color:var(--accent)}
.md code{font-family:var(--font-mono);font-size:.87em;background:var(--code-bg);color:var(--code-fg);padding:.1em .35em;border-radius:4px}
.md pre{background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:14px 0;line-height:1.5}
.md pre code{background:none;padding:0;font-size:12.5px;overflow-wrap:normal}
.md .tw{overflow-x:auto;margin:14px 0}
.md table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.md blockquote{margin:14px 0;padding:2px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.empty{max-width:520px;margin:12vh auto 0;color:var(--muted)}
.empty h2{color:var(--fg);font-size:20px;margin:0 0 8px}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .app[data-view="list"] .main{display:none}
  .app[data-view="doc"] .side{display:none}
  #back{display:inline-block}
  .bar{padding:10px 16px}
  .doc{padding:20px 16px 56px}
  .md h1{font-size:23px}
  .side-head,.list{padding-inline:16px}
}
@media (prefers-reduced-motion:no-preference){.item{transition:background .12s}}
</style>
<div class="app" id="app" data-view="list">
  <nav class="side" aria-label="Interview question files">
    <div class="side-head">
      <h1>Interview questions</h1>
      <p id="count"></p>
      <input id="filter" type="search" placeholder="Filter files" aria-label="Filter files" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
  </nav>
  <section class="main" aria-live="polite">
    <div class="bar"><button id="back" type="button">&larr; Files</button><span class="crumb" id="crumb"></span></div>
    <div class="doc" id="doc"><div class="empty"><h2>Pick a file</h2><p>Choose a topic on the left to read its questions here.</p></div></div>
  </section>
</div>

const FILES=[{"id": "angular", "title": "Angular basics", "group": "Frontend", "path": "interview-questions/angular/angular-basic-questions.md", "q": 15, "lines": 169, "md": "# Angular \u2014 Basic Interview Questions\n\n## 1. What is Angular, and how is it different from AngularJS?\nAngular is a TypeScript-based, component-driven front-end framework (versions 2+). AngularJS (1.x) is its JavaScript-based predecessor, built around `$scope` and controllers rather than components. They're effectively separate frameworks sharing a name \u2014 there's no direct upgrade path, only migration.\n\n## 2. What is a component?\nThe basic building block of an Angular UI: a TypeScript class with a template (HTML) and styles, decorated with `@Component`.\n```typescript\n@Component({\n  selector: 'app-employee-list',\n  templateUrl: './employee-list.component.html',\n  styleUrls: ['./employee-list.component.css']\n})\nexport class EmployeeListComponent {\n  employees: Employee[] = [];\n}\n```\n`selector` is what you use as a custom HTML tag (`<app-employee-list></app-employee-list>`) to embed this component elsewhere.\n\n## 3. What's the difference between a Module (NgModule) and a standalone component?\nHistorically, every component had to be declared inside an `NgModule` (`AppModule`, `EmployeeModule`, etc.), which grouped components/directives/pipes and imported other modules.\n```typescript\n@NgModule({\n  declarations: [EmployeeListComponent],\n  imports: [CommonModule, HttpClientModule],\n})\nexport class EmployeeModule {}\n```\nSince Angular 14+, **standalone components** skip `NgModule` entirely \u2014 a component declares its own imports directly:\n```typescript\n@Component({\n  selector: 'app-employee-list',\n  standalone: true,\n  imports: [CommonModule, RouterModule],\n  templateUrl: './employee-list.component.html'\n})\nexport class EmployeeListComponent {}\n```\nModern Angular (17+) defaults new projects to standalone \u2014 worth mentioning both since plenty of existing codebases still use `NgModule`.\n\n## 4. What are the types of data binding?\n- **Interpolation**: `{{ employee.name }}` \u2014 component \u2192 template, text only.\n- **Property binding**: `[value]=\"employee.name\"` \u2014 component \u2192 template, any DOM property.\n- **Event binding**: `(click)=\"deleteEmployee(employee.id)\"` \u2014 template \u2192 component.\n- **Two-way binding**: `[(ngModel)]=\"employee.name\"` \u2014 both directions at once (needs `FormsModule`).\n\nTwo-way binding is really property binding + event binding combined under the hood \u2014 `[(ngModel)]` is shorthand for `[ngModel]=\"x\" (ngModelChange)=\"x=$event\"`.\n\n## 5. What is a directive? Structural vs. attribute directives?\nA directive adds behavior to an existing DOM element.\n- **Structural** (change the DOM layout, prefixed `*`): `*ngIf=\"condition\"`, `*ngFor=\"let e of employees\"`.\n- **Attribute** (change appearance/behavior of an existing element): `[ngClass]=\"{active: isActive}\"`, `[ngStyle]`, or a custom `[appHighlight]`.\n\n```html\n<tr *ngFor=\"let employee of employees\" [ngClass]=\"{'high-earner': employee.salary > 100000}\">\n  {{ employee.name }}\n</tr>\n```\n\n## 6. What is a service, and how does dependency injection work?\nA service is a plain TypeScript class holding logic/data meant to be shared across components (API calls, state) \u2014 decorated with `@Injectable`.\n```typescript\n@Injectable({ providedIn: 'root' })  // registers it as a singleton, app-wide\nexport class EmployeeService {\n  constructor(private http: HttpClient) {}\n  getAll(): Observable<Employee[]> {\n    return this.http.get<Employee[]>('/api/employees');\n  }\n}\n```\n`providedIn: 'root'` registers the service with Angular's root injector \u2014 a component just declares it as a constructor parameter and Angular supplies the same singleton instance, the same DI pattern as Spring's constructor injection.\n```typescript\nconstructor(private employeeService: EmployeeService) {}\n```\n\n## 7. What are the main component lifecycle hooks?\n- `ngOnChanges` \u2014 fires when an `@Input()` property changes.\n- `ngOnInit` \u2014 fires once, after the component's inputs are set \u2014 the usual place to fetch initial data.\n- `ngAfterViewInit` \u2014 fires once the component's view (and child views) are fully initialized \u2014 needed before using `@ViewChild`.\n- `ngOnDestroy` \u2014 fires right before the component is removed \u2014 the place to unsubscribe from Observables/clean up timers, to avoid memory leaks.\n\n```typescript\nexport class EmployeeListComponent implements OnInit, OnDestroy {\n  private sub!: Subscription;\n  ngOnInit() {\n    this.sub = this.employeeService.getAll().subscribe(data => this.employees = data);\n  }\n  ngOnDestroy() {\n    this.sub.unsubscribe();\n  }\n}\n```\n\n## 8. What is RxJS, and why does Angular use Observables instead of Promises?\nRxJS is a library for composing asynchronous/event-based logic using **Observables** \u2014 streams of values over time. Angular's `HttpClient` returns Observables rather than Promises.\n\nKey differences from a Promise:\n- A Promise resolves once; an Observable can emit multiple values over time (e.g. a WebSocket stream, or `valueChanges` on a form).\n- Observables are **lazy** \u2014 nothing happens until you call `.subscribe()`. A Promise's executor runs immediately on creation.\n- Observables are **cancellable** (`subscription.unsubscribe()`); a Promise, once started, can't be cancelled.\n- RxJS provides composable operators (`map`, `filter`, `switchMap`, `debounceTime`) for transforming/combining streams \u2014 e.g. debouncing a search input before calling an API.\n\n## 9. What is the `async` pipe, and why use it over manual subscription?\n```html\n<tr *ngFor=\"let employee of employees$ | async\">{{ employee.name }}</tr>\n```\nThe `async` pipe subscribes to an Observable (or Promise) directly in the template and **automatically unsubscribes** when the component is destroyed \u2014 removing the need for a manual `ngOnDestroy` unsubscribe (Q7) for that specific stream. It also triggers change detection automatically when a new value arrives.\n\n## 10. What is Angular routing, and how do route guards work?\n`RouterModule` maps URL paths to components:\n```typescript\nconst routes: Routes = [\n  { path: 'employees', component: EmployeeListComponent },\n  { path: 'employees/:id', component: EmployeeDetailComponent, canActivate: [AuthGuard] },\n];\n```\n`routerLink=\"/employees\"` navigates without a full page reload (client-side routing). A **guard** (`canActivate`, `canDeactivate`) is a class implementing a check that runs before a route resolves \u2014 e.g. `AuthGuard` returning `false`/redirecting if the user isn't logged in, the routing-layer equivalent of `@PreAuthorize` in Spring Security.\n\n## 11. What is a pipe? Built-in vs. custom.\nA pipe transforms a displayed value in the template without changing the underlying data.\n```html\n{{ employee.joinDate | date:'mediumDate' }}\n{{ employee.salary | currency:'USD' }}\n```\nBuilt-in pipes: `date`, `currency`, `uppercase`, `json`, `async` (Q9). A custom pipe implements `PipeTransform`:\n```typescript\n@Pipe({ name: 'truncate' })\nexport class TruncatePipe implements PipeTransform {\n  transform(value: string, limit = 20): string {\n    return value.length > limit ? value.slice(0, limit) + '...' : value;\n  }\n}\n```\n\n## 12. What is change detection, and what does `OnPush` do?\nAngular's mechanism for detecting when component data changes and updating the DOM to match. By default (`ChangeDetectionStrategy.Default`), Angular checks every component on every browser event (click, timer, HTTP response) via Zone.js patching async APIs \u2014 safe, but can be wasteful on large component trees.\n\n`ChangeDetectionStrategy.OnPush` tells a component to skip that default check and only re-render when: an `@Input()` reference changes, an event originates from within the component itself, or an Observable bound via `async` emits.\n```typescript\n@Component({ changeDetection: ChangeDetectionStrategy.OnPush, ... })\n```\nThe common gotcha: with `OnPush`, mutating an `@Input()` object in place (`employee.salary = 5000`) won't trigger re-render, because the object *reference* didn't change \u2014 you need to pass a new object/array reference instead (immutable update pattern).\n\n## 13. What's the difference between `@ViewChild` and `@ContentChild`?\n`@ViewChild` gets a reference to an element/component defined in *this component's own template*. `@ContentChild` gets a reference to something *projected into* this component via `<ng-content>` (i.e., passed in by whatever's using this component). Both are only reliably available after `ngAfterViewInit`/`ngAfterContentInit` respectively (Q7).\n\n## 14. What is lazy loading, and why use it?\nSplitting the app into separate JavaScript bundles per feature, loaded on demand instead of all upfront.\n```typescript\n{ path: 'employees', loadChildren: () => import('./employee/employee.module').then(m => m.EmployeeModule) }\n```\nThe `employee` feature's code only downloads when the user actually navigates to `/employees`, shrinking the initial bundle size and speeding up first load \u2014 the front-end equivalent of not eagerly initializing every Spring bean you might never use.\n\n## 15. Template-driven vs. reactive forms \u2014 what's the difference?\n- **Template-driven**: form structure/validation defined mostly in the HTML template, using `[(ngModel)]` and directives (`required`, `minlength`). Simpler for basic forms, needs `FormsModule`.\n- **Reactive**: form structure defined in the component class as a `FormGroup`/`FormControl` tree, template just binds to it. More explicit, easier to unit test, better for complex/dynamic forms. Needs `ReactiveFormsModule`.\n```typescript\nemployeeForm = new FormGroup({\n  firstName: new FormControl('', [Validators.required]),\n  email: new FormControl('', [Validators.required, Validators.email]),\n});\n```\n```html\n<form [formGroup]=\"employeeForm\">\n  <input formControlName=\"firstName\" />\n</form>\n```\nReactive forms are generally preferred in larger apps for the same reason constructor injection is preferred over field injection in Spring (Q4 in the Spring Boot doc) \u2014 the dependencies/structure are explicit in code, not implicit in markup, which makes them easier to test.\n"}, {"id": "mysql", "title": "MySQL basics", "group": "Database", "path": "interview-questions/database/relational-db/mysql/mysql-basic-questions.md", "q": 14, "lines": 139, "md": "# MySQL \u2014 Basic Interview Questions\n\n## 1. What are the storage engines in MySQL? What's the difference between InnoDB and MyISAM?\n- **InnoDB** (default since 5.5): supports transactions, foreign keys, row-level locking, crash recovery.\n- **MyISAM**: no transaction support, table-level locking, faster for read-heavy workloads but less safe (no crash recovery, no foreign keys).\n\n## 2. What is the difference between CHAR and VARCHAR?\n`CHAR(n)` is fixed-length, padded with spaces; faster for fixed-size data. `VARCHAR(n)` is variable-length, stores only the actual characters plus a length prefix; saves space for variable-size data.\n\n## 3. What is AUTO_INCREMENT?\nAn attribute applied to a column (usually the primary key) that automatically generates a unique, incrementing integer value for each new row.\n\n## 4. What is the difference between MySQL's `NOW()` and `CURDATE()`?\n`NOW()` returns the current date and time. `CURDATE()` returns only the current date.\n\n## 5. How do you find duplicate rows in a MySQL table?\n```sql\nSELECT column_name, COUNT(*)\nFROM table_name\nGROUP BY column_name\nHAVING COUNT(*) > 1;\n```\n\n## 6. What is the difference between InnoDB row-level locking and table-level locking?\nRow-level locking (InnoDB) locks only the specific rows being modified, allowing higher concurrency. Table-level locking (MyISAM, or an explicit `LOCK TABLES`) locks the entire table for a write, blocking other reads/writes until released.\n\n| | Row-level (InnoDB) | Table-level (MyISAM / `LOCK TABLES`) |\n|---|---|---|\n| Concurrency | High: many users can write to different rows at once | Low: one writer at a time |\n| Overhead | Higher: MySQL tracks many locks | Very low: one lock per table |\n| Deadlock risk | Possible | Rare |\n| Transactions | Supported | Not supported in MyISAM |\n\n**Why it matters:** with row-level locking, two customers buying different products update different rows, so neither waits. With table-level locking, the second customer waits until the first write finishes, which gets slow when many users write at the same time.\n\n**When to use row-level locking:** busy apps with many concurrent writes (orders, payments, stock updates). InnoDB is the default engine, so this is what you get automatically.\n\n**When to use table-level locking:**\n- Bulk imports or full-table updates, where one lock is cheaper than millions of row locks.\n- Read-heavy tables that almost never change.\n- Maintenance tasks where nobody else should touch the table.\n\n```sql\n-- Row-level: locks only the row with id = 1\nSTART TRANSACTION;\nSELECT * FROM products WHERE id = 1 FOR UPDATE;\nUPDATE products SET stock = stock - 1 WHERE id = 1;\nCOMMIT;\n\n-- Table-level: locks the whole table\nLOCK TABLES products WRITE;\n-- ... do the bulk work ...\nUNLOCK TABLES;\n```\n\n**Gotcha:** InnoDB locks rows through indexes. If the `WHERE` column has no index, InnoDB may lock many rows, which acts almost like a table lock. Always index the columns you filter on.\n\n## 7. What is a MySQL EXPLAIN plan used for?\nIt shows how MySQL executes a query \u2014 which indexes are used, join order, estimated rows scanned \u2014 helping identify performance bottlenecks.\n\n## 8. What is replication in MySQL?\nCopying data from a master (source) server to one or more replica servers, used for read scaling, backups, and high availability. Can be statement-based, row-based, or mixed replication.\n\n## 9. What is the difference between `INT`, `BIGINT`, and `TINYINT`?\nThey differ in storage size and range: `TINYINT` (1 byte, -128 to 127 or 0-255 unsigned), `INT` (4 bytes), `BIGINT` (8 bytes, for very large numbers).\n\n## 10. How does MySQL handle full-text search?\nVia `FULLTEXT` indexes on `CHAR`/`VARCHAR`/`TEXT` columns, queried with `MATCH() AGAINST()`, supporting natural language and boolean search modes.\n\n## 11. What is the difference between `COMMIT` and `ROLLBACK`?\n`COMMIT` permanently saves all changes made in the current transaction. `ROLLBACK` undoes all changes made in the current transaction since the last commit.\n\n## 12. What are MySQL's ENUM and SET types?\n`ENUM` stores one value from a predefined list of allowed values. `SET` can store zero or more values from a predefined list, stored as a bitmap.\n\n**ENUM example (one value only):**\n```sql\nCREATE TABLE orders (\n    id     INT PRIMARY KEY AUTO_INCREMENT,\n    status ENUM('PENDING', 'PAID', 'SHIPPED', 'CANCELLED') NOT NULL DEFAULT 'PENDING'\n);\n\nINSERT INTO orders (status) VALUES ('PAID');       -- OK\nINSERT INTO orders (status) VALUES ('REFUNDED');   -- error in strict mode: not in the list\n```\n\n**SET example (many values allowed):**\n```sql\nCREATE TABLE users (\n    id    INT PRIMARY KEY AUTO_INCREMENT,\n    roles SET('USER', 'ADMIN', 'SELLER', 'SUPPORT')\n);\n\nINSERT INTO users (roles) VALUES ('USER');               -- one value\nINSERT INTO users (roles) VALUES ('USER,SELLER');        -- two values\nINSERT INTO users (roles) VALUES ('');                   -- empty set is allowed\n\nSELECT * FROM users WHERE FIND_IN_SET('ADMIN', roles);   -- users who have ADMIN\n```\n\n**Key points:**\n- `ENUM` is stored as a number internally (1 byte for up to 255 values), so it is small and fast.\n- `ENUM` sorts by the order in the list, not alphabetically.\n- `SET` holds up to 64 values.\n- Changing the list later needs an `ALTER TABLE`, which can be slow on big tables.\n- Many teams prefer a lookup table (like `order_status`) or a plain `VARCHAR` with a check, because those are easier to change.\n\n## 13. How do you back up and restore a MySQL database?\nCommon tools: `mysqldump` (logical backup, e.g., `mysqldump -u user -p dbname > backup.sql`) and restoring with `mysql -u user -p dbname < backup.sql`. For larger databases, physical tools like Percona XtraBackup are used.\n\n## 14. Should you store images in the database?\n**Short answer:** usually no. Store the image file outside the database (disk or object storage like S3) and keep only the path/URL and metadata (name, size, type) in the database.\n\n**Why not store images in the DB (as `BLOB`):**\n- The database gets big fast, so backups, restores, and replication get slow.\n- Image bytes fill the buffer pool (memory cache), pushing out the hot rows your queries need.\n- Every image read goes through the DB connection and your app, instead of a CDN or web server.\n- No easy browser caching or CDN delivery.\n- Large rows slow down queries on that table, and big files can hit `max_allowed_packet`.\n\n**When storing in the DB is fine:**\n- Very small images (icons, thumbnails, under about 100 KB).\n- You need the image and its row to be saved or rolled back together in one transaction.\n- A small internal app where simplicity matters more than scale.\n\nBLOB types in MySQL: `BLOB` (64 KB), `MEDIUMBLOB` (16 MB), `LONGBLOB` (4 GB).\n\n**Recommended way: file storage + path in the DB**\n```java\n// Save the file to disk (or upload to S3), then store only the path\nPath target = Paths.get(\"/data/uploads\", UUID.randomUUID() + \".jpg\");\nFiles.copy(file.getInputStream(), target);\n\nproduct.setImagePath(target.toString());   // VARCHAR column in the DB\nproductRepository.save(product);\n```\n\n**Rule of thumb:** store images in object storage (or on disk) and keep only the URL or path in the database.\n"}, {"id": "postgres", "title": "PostgreSQL basics", "group": "Database", "path": "interview-questions/database/relational-db/postgresql/postgresql-basic-questions.md", "q": 14, "lines": 382, "md": "# PostgreSQL \u2014 Basic Interview Questions\n\n## 1. Is PostgreSQL an object-relational database?\nYes. PostgreSQL is an **object-relational database (ORDBMS)**. It is a relational database (tables, rows, columns, SQL) with object-oriented features added.\n\n**Object features PostgreSQL has:**\n- **Custom data types:** you can create your own types.\n- **Table inheritance:** a table can inherit columns from another table.\n- **Arrays:** a column can hold an array of values.\n- **Function overloading:** the same function name can work with different input types.\n- **Rich types:** `JSONB`, ranges, and geometric types.\n\n```sql\n-- Custom type\nCREATE TYPE address AS (street TEXT, city TEXT, zip TEXT);\n\nCREATE TABLE customers (\n    id      SERIAL PRIMARY KEY,\n    name    TEXT,\n    home    address,            -- custom type as a column\n    phones  TEXT[]              -- array column\n);\n\n-- Table inheritance\nCREATE TABLE vehicles (id SERIAL PRIMARY KEY, brand TEXT);\nCREATE TABLE cars (doors INT) INHERITS (vehicles);\n```\n\n**Compared with MySQL:** MySQL is a plain relational database (RDBMS). It has a `JSON` column type, but it has no custom types, table inheritance, or arrays.\n\n## 2. What is PostgreSQL and how is it different from MySQL?\nPostgreSQL is an open-source, object-relational database known for strict standards compliance, advanced data types (JSONB, arrays, ranges), extensibility (custom types/functions), and strong support for complex queries. Compared to MySQL, it generally offers richer feature sets and better handling of complex/analytical workloads, while MySQL has historically been favored for simpler, high-throughput read-heavy web apps.\n\n## 3. What is MVCC (Multi-Version Concurrency Control)?\nPostgreSQL's mechanism for handling concurrent access: instead of locking rows for reads, each transaction sees a \"snapshot\" of the data as of its start, allowing readers and writers to avoid blocking each other.\n\n## 4. What is a sequence in PostgreSQL?\nA database object that generates unique numeric identifiers, commonly used to implement auto-incrementing primary keys (via `SERIAL`/`BIGSERIAL` or `GENERATED ... AS IDENTITY`).\n\n## 5. What is the difference between `SERIAL` and `IDENTITY` columns?\n`SERIAL` is a shorthand that creates a sequence and sets the column default to `nextval()`. `GENERATED AS IDENTITY` (SQL-standard, added in PG10) is the modern, safer approach with more control over whether values can be overridden.\n\n## 6. What is JSONB and how does it differ from JSON?\nBoth store JSON data. `JSON` stores an exact text copy and re-parses it on read. `JSONB` stores data in a decomposed binary format \u2014 slightly slower to insert but much faster to query, and supports indexing (e.g., GIN indexes).\n\n**JSON vs JSONB:**\n\n| | `JSON` | `JSONB` |\n|---|---|---|\n| Storage | Exact text copy | Binary format |\n| Insert speed | Faster (no conversion) | Slightly slower (converts to binary) |\n| Query speed | Slow (re-parsed on every read) | Fast |\n| Indexing | No | Yes (GIN index) |\n| Whitespace | Kept as written | Removed |\n| Key order | Kept as written | Not kept |\n| Duplicate keys | All kept | Last one wins |\n| Operators like `@>` and `?` | No | Yes |\n\n**Example:**\n```sql\nCREATE TABLE products (\n    id    SERIAL PRIMARY KEY,\n    name  TEXT,\n    attrs JSONB\n);\n\nINSERT INTO products (name, attrs)\nVALUES ('T-shirt', '{\"color\": \"red\", \"size\": \"M\", \"tags\": [\"sale\", \"new\"]}');\n\nSELECT attrs->>'color' FROM products;                  -- get one field as text\nSELECT * FROM products WHERE attrs @> '{\"color\": \"red\"}';  -- filter by a value inside\n\n-- Speed up the filter above with a GIN index\nCREATE INDEX idx_products_attrs ON products USING GIN (attrs);\n```\n\n**Same input, different output:**\n```sql\nSELECT '{\"b\": 1,  \"a\": 2, \"a\": 3}'::json;    -- {\"b\": 1,  \"a\": 2, \"a\": 3}\nSELECT '{\"b\": 1,  \"a\": 2, \"a\": 3}'::jsonb;   -- {\"a\": 3, \"b\": 1}\n```\n\n**When to use which:**\n- Use `JSONB` in almost every case, because you can query and index it.\n- Use `JSON` only when you must keep the exact original text (key order, spacing, duplicate keys), for example when you store raw API logs.\n\n**Tip:** keep important columns like price and status as normal columns. Use `JSONB` for flexible data, like product attributes or settings.\n\n## 7. What are PostgreSQL schemas?\nA schema is like a folder inside one database. It groups tables and other objects, and it avoids name clashes: two schemas can each have a table with the same name. Think of it this way: database = the whole drive, schema = a folder, table = a file.\n\n```sql\nCREATE SCHEMA sales;\nCREATE SCHEMA hr;\n\nCREATE TABLE sales.orders (id SERIAL PRIMARY KEY, total NUMERIC);\nCREATE TABLE hr.employees (id SERIAL PRIMARY KEY, name TEXT);\n\nSELECT * FROM sales.orders;   -- use schema.table\nSELECT * FROM orders;         -- no schema given: uses \"public\" (the default schema)\n```\n\n**Why use schemas:** organize tables, avoid name clashes, run multi-tenant apps (one schema per customer), and control permissions per schema.\n\n## 8. What is a CTE (Common Table Expression)?\nA named temporary result set defined with `WITH`, used to simplify complex queries and enable recursive queries.\n```sql\nWITH regional_sales AS (\n    SELECT region, SUM(amount) AS total\n    FROM orders\n    GROUP BY region\n)\nSELECT * FROM regional_sales WHERE total > 10000;\n```\n\n## 9. What is the difference between `VACUUM` and `VACUUM FULL`?\n**What is VACUUM:** PostgreSQL's cleaning job for tables. When you `UPDATE` or `DELETE` a row, the old row stays in the table as a \"dead row\" (because of MVCC). Dead rows pile up and make the table bloated. `VACUUM` cleans them.\n\n| | `VACUUM` | `VACUUM FULL` |\n|---|---|---|\n| What it does | Marks dead-row space as reusable inside the table | Rewrites the whole table into a new compact file |\n| Disk space back to the OS | No (mostly) | Yes |\n| Locking | No blocking; reads and writes continue | Full table lock; no reads or writes |\n| Speed | Fast | Slow on big tables |\n| When to use | Regular cleanup (autovacuum does it) | Rare, in a maintenance window |\n\nThink of a messy shelf: `VACUUM` removes old items and reuses the empty spots (same shelf size). `VACUUM FULL` repacks everything into a smaller shelf, but nobody can use the shelf meanwhile.\n\n**Why use it:** stops table bloat, reuses space, keeps queries fast, and keeps PostgreSQL healthy (updates statistics, prevents transaction ID wraparound). PostgreSQL runs `autovacuum` automatically, so you rarely run plain `VACUUM` by hand.\n\n```sql\nVACUUM orders;\nVACUUM (VERBOSE, ANALYZE) orders;\nVACUUM FULL orders;   -- locks the table, use only when needed\n```\n\n## 10. What index types does PostgreSQL support?\nB-Tree (default, general purpose), Hash, GIN (good for JSONB, arrays, full-text search), GiST (geometric/full-text data), BRIN (large, naturally ordered tables like time-series).\n\n## 11. What is the difference between `TEXT` and `VARCHAR(n)` in PostgreSQL?\nFunctionally almost identical \u2014 both store variable-length strings. `VARCHAR(n)` enforces a length limit; `TEXT` has no limit. Unlike some databases, there's negligible performance difference between them in PostgreSQL.\n\n## 12. What are PostgreSQL's window functions?\nA window function calculates across a group of related rows but **keeps every row**. `GROUP BY` collapses rows into one; a window function does not.\n\nExample table `employees`:\n\n| name | dept | salary |\n|---|---|---|\n| Ali | IT | 5000 |\n| Sara | IT | 7000 |\n| John | IT | 7000 |\n| Mia | HR | 4000 |\n| Tom | HR | 6000 |\n\n**1) `GROUP BY` (rows collapse, names are lost):**\n\n```sql\nSELECT dept, SUM(salary) FROM employees GROUP BY dept;\n```\n\n| dept | sum |\n|---|---|\n| IT | 19000 |\n| HR | 10000 |\n\n**2) Window function (all 5 rows stay, total shown next to each):**\n\n```sql\nSELECT name, dept, salary,\n       SUM(salary) OVER (PARTITION BY dept) AS dept_total\nFROM employees;\n```\n\n| name | dept | salary | dept_total |\n|---|---|---|---|\n| Ali | IT | 5000 | 19000 |\n| Sara | IT | 7000 | 19000 |\n| John | IT | 7000 | 19000 |\n| Mia | HR | 4000 | 10000 |\n| Tom | HR | 6000 | 10000 |\n\n- `PARTITION BY dept` = do it separately for each department.\n- `ORDER BY` inside `OVER` = order rows inside each department.\n\n**3) Ranking inside each department (highest salary first):**\n\n```sql\nSELECT name, dept, salary,\n  ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) AS row_num,\n  RANK()       OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk\nFROM employees;\n```\n\n| name | dept | salary | row_num | rnk |\n|---|---|---|---|---|\n| Sara | IT | 7000 | 1 | 1 |\n| John | IT | 7000 | 2 | 1 (tie: same RANK) |\n| Ali | IT | 5000 | 3 | 3 (RANK skips 2) |\n| Tom | HR | 6000 | 1 | 1 |\n| Mia | HR | 4000 | 2 | 2 |\n\n- `ROW_NUMBER` = always unique (1, 2, 3).\n- `RANK` = ties share a number and the next number is skipped.\n\nInterview use: \"top earner per department\" = wrap query 3 in a subquery and filter `WHERE rnk = 1`.\n\n## 13. How does PostgreSQL handle full-text search?\nFull-text search is like a \"Google search\" inside your database. Unlike `LIKE`, it understands word forms (searching \"run\" also finds \"running\") and skips small words like \"the\" and \"is\".\n\n- `tsvector`: the text turned into searchable words.\n- `tsquery`: what you search for.\n- `@@`: checks if the text matches the search.\n- **GIN index**: makes it fast on big tables (like the index at the back of a book).\n\n```sql\nSELECT * FROM articles\nWHERE to_tsvector('english', body) @@ to_tsquery('english', 'fox & run');\n\nCREATE INDEX idx_articles_fts ON articles USING GIN (to_tsvector('english', body));\n```\n\n## 14. What is the difference between `pg_dump` and physical backups?\n`pg_dump` performs a logical backup (SQL statements or custom archive format) of one database, portable across versions. Physical backups (e.g., `pg_basebackup`, WAL archiving) copy the actual data files and are used for point-in-time recovery and replication.\n\n---\n\n## Practice: GROUP BY, HAVING, COUNT\n\nSample table `employees`:\n\n| id | name | dept | salary | city |\n|---|---|---|---|---|\n| 1 | Ali | IT | 5000 | KL |\n| 2 | Sara | IT | 7000 | Penang |\n| 3 | John | IT | 7000 | KL |\n| 4 | Mia | HR | 4000 | KL |\n| 5 | Tom | HR | 6000 | Penang |\n| 6 | Zed | Sales | 3000 | KL |\n| 7 | Amy | Sales | 3500 | Johor |\n| 8 | Raj | Sales | 4500 | KL |\n| 9 | Eva | Sales | 3000 | Penang |\n\nReminders: `WHERE` filters rows before grouping. `HAVING` filters groups after grouping. `HAVING` needs the full expression (`COUNT(*) > 2`), not an alias.\n\n**Questions**\n\n- Q1. How many employees are there in total?\n- Q2. What is the highest and the lowest salary?\n- Q3. How many employees work in each department?\n- Q4. Show each department with its total salary.\n- Q5. Show each department with its average salary, highest first.\n- Q6. Show each city with the number of employees in it.\n- Q7. Show only the departments that have more than 2 employees.\n- Q8. Show only the departments whose average salary is above 5000.\n- Q9. Ignore employees in KL. Then show the number of employees per department.\n- Q10. Ignore employees earning less than 3500. Then show only the departments with more than 1 person left.\n- Q11. Which salary values appear more than once? Show the salary and how many times.\n- Q12. Show each department and city together, with the number of employees for each pair.\n\n**Answers**\n\n```sql\n-- Q1  -> 9\nSELECT COUNT(*) FROM employees;\n\n-- Q2  -> 7000, 3000\nSELECT MAX(salary) AS high_sal, MIN(salary) AS low_sal FROM employees;\n\n-- Q3  -> IT 3, HR 2, Sales 4\nSELECT dept, COUNT(*) FROM employees GROUP BY dept;\n\n-- Q4  -> IT 19000, HR 10000, Sales 14000\nSELECT dept, SUM(salary) AS total_sal FROM employees GROUP BY dept;\n\n-- Q5  -> IT 6333.33, HR 5000, Sales 3500\nSELECT dept, AVG(salary) AS avg_sal\nFROM employees GROUP BY dept\nORDER BY avg_sal DESC;            -- not ORDER BY salary\n\n-- Q6  -> KL 5, Penang 3, Johor 1\nSELECT city, COUNT(*) AS n FROM employees GROUP BY city;\n\n-- Q7  -> IT 3, Sales 4\nSELECT dept, COUNT(*) AS n\nFROM employees GROUP BY dept\nHAVING COUNT(*) > 2;              -- not HAVING n > 2\n\n-- Q8  -> IT 6333.33 (HR is exactly 5000, so it is not above 5000)\nSELECT dept, AVG(salary) AS avg_sal\nFROM employees GROUP BY dept\nHAVING AVG(salary) > 5000;\n\n-- Q9  -> IT 1, HR 1, Sales 2\nSELECT dept, COUNT(*) AS n\nFROM employees\nWHERE city <> 'KL'                -- != also works\nGROUP BY dept;\n\n-- Q10 -> IT 3, HR 2, Sales 2\nSELECT dept, COUNT(*) AS n\nFROM employees\nWHERE salary >= 3500              -- \"less than 3500 ignored\" keeps 3500\nGROUP BY dept\nHAVING COUNT(*) > 1;\n\n-- Q11 -> 7000 appears 2 times, 3000 appears 2 times\nSELECT salary, COUNT(*) AS n\nFROM employees GROUP BY salary\nHAVING COUNT(*) > 1;\n\n-- Q12 -> IT/KL 2, IT/Penang 1, HR/KL 1, HR/Penang 1,\n--        Sales/KL 2, Sales/Johor 1, Sales/Penang 1\nSELECT dept, city, COUNT(*) AS n\nFROM employees GROUP BY dept, city;\n```\n\nRules to remember:\n\n- Every column in `SELECT` must be in `GROUP BY` or inside an aggregate (`COUNT`, `SUM`, `AVG`, `MAX`, `MIN`).\n- `COUNT(*)` counts all rows. `COUNT(column)` skips `NULL` values.\n- `ORDER BY` can use an alias. `WHERE` and `HAVING` cannot.\n- Edge values: \"more than 3500\" is `> 3500`. \"Less than 3500 ignored\" is `>= 3500`.\n\n---\n\n## Practice: window functions\n\nSample table `employees` (small version):\n\n| name | dept | salary |\n|---|---|---|\n| Ali | IT | 5000 |\n| Sara | IT | 7000 |\n| John | IT | 7000 |\n| Mia | HR | 4000 |\n| Tom | HR | 6000 |\n\n**Questions**\n\n- W1. Show every employee with the average salary of their department next to them.\n- W2. Number all employees from 1 to 5, highest salary first.\n- W3. Number employees inside each department, lowest salary first.\n- W4. Show every employee with the total of all salaries in the company.\n- W5. Show each employee with the salary of the person before them in the same department (ordered by salary).\n- W6. Show only the top earner in each department.\n\n**Answers**\n\n```sql\n-- W1  IT 6333.33, HR 5000 next to each person\nSELECT *, AVG(salary) OVER (PARTITION BY dept) AS dept_avg\nFROM employees;\n\n-- W2  unique 1..5 (RANK would give ties the same number)\nSELECT *, ROW_NUMBER() OVER (ORDER BY salary DESC) AS n\nFROM employees;\n\n-- W3  numbering restarts at 1 for each department\nSELECT *, ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary ASC) AS n\nFROM employees;\n\n-- W4  every row shows 29000 (empty OVER () = whole table is one group)\nSELECT *, SUM(salary) OVER () AS tot_salary\nFROM employees;\n\n-- W5  first person in each department gets NULL\nSELECT *, LAG(salary) OVER (PARTITION BY dept ORDER BY salary) AS prev_salary\nFROM employees;\n\n-- W6  IT: Sara and John (tie at 7000), HR: Tom\nSELECT name, dept, salary\nFROM (\n  SELECT name, dept, salary,\n         RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk\n  FROM employees\n) t\nWHERE rnk = 1;                    -- WHERE cannot use a window function directly\n```\n\nRule to remember: function + `OVER (...)` = window function. No `OVER` means a normal aggregate that collapses rows.\n"}, {"id": "reldb", "title": "Relational DB basics", "group": "Database", "path": "interview-questions/database/relational-db/relational-db-basics.md", "q": 41, "lines": 940, "md": "# Relational Database \u2014 Interview Questions (Basic + Expert)\n\nGeneral concepts that apply across all relational databases (MySQL, PostgreSQL, Oracle, SQL Server, etc.). Q1-Q28 are core/basic concepts; Q29-Q40 go past table design and single-query tuning into engine internals and production-scale concerns (replication, distributed transactions, consistency) \u2014 Postgres-flavored, since that's this repo's database (`application.properties`).\n\n## 1. What is a relational database?\nA database that stores data in tables (rows and columns) where relationships between tables are defined using keys (primary key, foreign key). Data integrity is enforced through constraints, and data is queried using SQL.\n\n**A bit more on \"constraints\":** these are rules attached directly to a table's columns that the database itself enforces on every write \u2014 so bad data gets rejected at insert/update time, no matter which application or query is doing the writing.\n\nThe common ones: `NOT NULL` (a value must always be provided), `UNIQUE` (no two rows can share this value), `PRIMARY KEY` (unique + not null, identifies the row), `FOREIGN KEY` (a value must actually exist in another table), `CHECK` (a custom condition, e.g. balance can't go negative), and `DEFAULT` (a value used automatically if none is given).\n\n`FOREIGN KEY` is the one worth pausing on here, since it's what makes the \"relationships between tables\" part of this answer actually enforced, not just implied.\n\nThis is why constraints matter for \"relational\" specifically: without them, the keys linking your tables together are just conventions you *hope* every piece of code respects. With them, the database refuses any write that would break the relationship.\n\nSee Q20 for a full worked example on an `accounts` table using all of these together.\n\n## 2. What is a primary key?\nA column (or set of columns) that uniquely identifies each row in a table. It cannot be NULL and must be unique.\n\n## 3. What is a foreign key?\nA column that references the primary key of another table, used to enforce referential integrity between two tables.\n\n## 4. What is normalization? Explain 1NF, 2NF, 3NF.\nNormalization is the process of organizing data to reduce redundancy and improve integrity, done in stages \u2014 each stage (normal form) fixes a specific kind of redundancy/anomaly.\n\n**A few terms used below:**\n- **Composite key** \u2014 a primary key made up of *more than one column*, where it's the combination of those columns (not either one alone) that's unique per row. In the example below, no single column identifies an enrollment row \u2014 you need both `StudentID` and `CourseID` together (the same student appears in many rows, and the same course appears in many rows, but that exact *pair* only appears once). Written as `(StudentID, CourseID)`.\n- **Partial dependency** \u2014 happens only when you *have* a composite key: a non-key column depends on just part of the composite key, not the whole thing.\n- **Transitive dependency** \u2014 a non-key column depends on another non-key column, instead of depending on the key directly (A \u2192 B \u2192 C, where C should really only depend on A).\n- **Anomaly** \u2014 a data-integrity bug that redundant, unnormalized data causes: an **update anomaly** (change one instructor's office, forget to update it on some rows), an **insertion anomaly** (can't add a course until a student enrolls in it), or a **deletion anomaly** (deleting the last student enrolled in a course wipes out the course/instructor info too).\n\n**Starting point \u2014 an unnormalized `StudentCourse` table:**\n\n| StudentID | StudentName | Courses                  | InstructorName | InstructorOffice |\n|-----------|-------------|---------------------------|-----------------|-------------------|\n| 1         | Alice       | Math101, Physics201       | Dr. Lee         | B-12              |\n| 2         | Bob         | Math101                   | Dr. Lee         | B-12              |\n\nProblems: the `Courses` column holds multiple values in one cell, and instructor info is duplicated per student.\n\n### 1NF \u2014 atomic values, no repeating groups\nRule: every column must hold a single, indivisible value \u2014 no comma-separated lists, no arrays, no \"repeating groups\" of columns like `Course1, Course2, Course3`.\n\nWhy it matters: in the unnormalized table above, you can't easily ask \"which students take Physics201?\" with a simple `WHERE` clause \u2014 the value is buried inside a string alongside other values. You also can't limit or index on it properly, and there's no fixed number of courses a row can hold.\n\n**Fix:** split the multi-valued `Courses` column into one row per (student, course) pair.\n\n| StudentID | StudentName | CourseID | InstructorName | InstructorOffice |\n|-----------|-------------|----------|-----------------|-------------------|\n| 1         | Alice       | Math101  | Dr. Lee         | B-12              |\n| 1         | Alice       | Physics201| Dr. Chen       | C-04              |\n| 2         | Bob         | Math101  | Dr. Lee         | B-12              |\n\nThis is now in 1NF (every cell holds one atomic value) \u2014 but notice the primary key is no longer a single column. No column here is unique on its own (StudentID 1 appears twice, Math101 appears twice), so the key has to be the **composite** `(StudentID, CourseID)` \u2014 that pair, together, is what's unique per row.\n\n### 2NF \u2014 1NF + no partial dependency\nRule: every non-key column must depend on the **whole** composite key, not just part of it. (If your primary key is a single column already, you automatically satisfy 2NF \u2014 this rule only bites when you have a composite key.)\n\nHere the key is `(StudentID, CourseID)`, but look at `StudentName`: it only depends on `StudentID` \u2014 it doesn't change based on which course we're looking at. That's a *partial* dependency (dependent on part of the key, not the whole thing). Same story for `InstructorName`/`InstructorOffice` depending only on `CourseID`.\n\nThe anomaly this causes: Alice's name is copied onto every row she has a course in. Misspell it on one row during an update and now the same student has two different names in the table (update anomaly).\n\n**Fix:** split into two tables.\n\n`Student`\n\n| StudentID | StudentName |\n|-----------|-------------|\n| 1         | Alice       |\n| 2         | Bob         |\n\n`Enrollment`\n\n| StudentID | CourseID  | InstructorName | InstructorOffice |\n|-----------|-----------|-----------------|-------------------|\n| 1         | Math101   | Dr. Lee         | B-12              |\n| 1         | Physics201| Dr. Chen        | C-04              |\n| 2         | Math101   | Dr. Lee         | B-12              |\n\n`StudentName` now lives in exactly one row per student, keyed by the single column `StudentID` \u2014 no partial dependency possible anymore. But `Enrollment` still has a problem 3NF will catch.\n\n### 3NF \u2014 2NF + no transitive dependency\nRule: non-key columns must depend **only** on the primary key, directly \u2014 not on some other non-key column that happens to sit in the same table.\n\nIn `Enrollment`, ask: does `InstructorOffice` describe the *enrollment* (the student+course pairing), or does it describe the *course*? It's really a fact about the course \u2014 every student in Math101 has the same instructor and office. So `InstructorOffice` depends on `InstructorName`, and `InstructorName` depends on `CourseID` \u2014 a chain: `CourseID \u2192 InstructorName \u2192 InstructorOffice`. That chain is the transitive dependency: `InstructorOffice` depends on the key only *indirectly*, through another non-key column.\n\nThe anomaly: \"Dr. Lee, B-12\" gets copied onto every row where any student takes Math101. Change offices, and you must update every one of those rows \u2014 miss one and the data disagrees with itself. Delete the last student enrolled in Physics201 and you lose the only record that Dr. Chen's office is C-04 (deletion anomaly). You also can't record that a new course exists with an assigned instructor until at least one student enrolls (insertion anomaly).\n\n**Fix:** pull course/instructor info into its own table.\n\n`Course`\n\n| CourseID   | InstructorName | InstructorOffice |\n|------------|-----------------|-------------------|\n| Math101    | Dr. Lee         | B-12              |\n| Physics201 | Dr. Chen        | C-04              |\n\n`Enrollment` (now just the relationship)\n\n| StudentID | CourseID   |\n|-----------|------------|\n| 1         | Math101    |\n| 1         | Physics201 |\n| 2         | Math101    |\n\nNow: `Student` holds student facts, `Course` holds course/instructor facts, `Enrollment` just links the two. No column depends on anything other than its own table's primary key \u2014 this is 3NF. Updating an instructor's office now means changing exactly one row.\n\n## 5. What is denormalization and when would you use it?\nIntentionally introducing redundancy (merging tables, duplicating data) to improve read performance, typically in reporting/analytics systems where read speed matters more than write efficiency.\n\n## 6. What are the different types of SQL joins?\n- **INNER JOIN**: rows matching in both tables.\n- **LEFT JOIN**: all rows from the left table + matching rows from the right (NULLs if no match).\n- **RIGHT JOIN**: all rows from the right table + matching rows from the left.\n- **FULL OUTER JOIN**: all rows from both tables, matched where possible.\n- **CROSS JOIN**: cartesian product of both tables.\n- **SELF JOIN**: a table joined with itself.\n\n**Real-life scenario:** using the same `customers` and `accounts` tables from the rest of this doc (`accounts.customer_id` links back to `customers.customer_id`). Not every customer has opened an account yet, so the two tables don't perfectly overlap \u2014 which is exactly what makes the join types behave differently.\n\n```sql\n-- INNER JOIN: only customers who actually have an account.\n-- A customer who signed up but never opened one is simply left out.\nSELECT c.customer_name, a.account_id, a.balance\nFROM customers c\nINNER JOIN accounts a ON a.customer_id = c.customer_id;\n\n-- LEFT JOIN: every customer, whether they have an account or not.\n-- Customers with no account show up with NULL account/balance columns\n-- \u2014 handy for \"find customers who haven't opened an account yet\":\n--   ... WHERE a.account_id IS NULL\nSELECT c.customer_name, a.account_id, a.balance\nFROM customers c\nLEFT JOIN accounts a ON a.customer_id = c.customer_id;\n\n-- RIGHT JOIN: every account, plus the owning customer's info.\n-- Equivalent to swapping the table order in a LEFT JOIN \u2014 rarely used in\n-- practice since it reads less naturally, but produces the same result as:\n--   accounts a LEFT JOIN customers c ON c.customer_id = a.customer_id\nSELECT c.customer_name, a.account_id, a.balance\nFROM customers c\nRIGHT JOIN accounts a ON a.customer_id = c.customer_id;\n\n-- FULL OUTER JOIN: every customer AND every account, matched where possible.\n-- Surfaces customers with no account (a.account_id IS NULL) in the same\n-- query as any account somehow missing a valid customer (c.customer_id IS NULL)\n-- \u2014 a quick way to audit both sides of the relationship at once.\nSELECT c.customer_name, a.account_id, a.balance\nFROM customers c\nFULL OUTER JOIN accounts a ON a.customer_id = c.customer_id;\n\n-- CROSS JOIN: every combination of two small tables \u2014 e.g. building a matrix\n-- of every account type offered at every branch, before deciding which\n-- combinations to actually launch.\nSELECT b.branch_name, t.account_type\nFROM branches b\nCROSS JOIN account_types t;\n\n-- SELF JOIN: join accounts to itself to find customers holding more than\n-- one account (a1 and a2 are the same table, aliased twice).\nSELECT a1.customer_id, a1.account_id AS account_1, a2.account_id AS account_2\nFROM accounts a1\nJOIN accounts a2 ON a1.customer_id = a2.customer_id\n               AND a1.account_id < a2.account_id;  -- avoids matching a row with itself or listing each pair twice\n```\n\n## 7. What is the difference between WHERE and HAVING?\n`WHERE` filters rows before grouping/aggregation. `HAVING` filters groups after `GROUP BY` has been applied.\n\n**Real-life scenario:** using the `transactions` table, find customers whose total spending this month exceeds $5,000.\n\n```sql\n-- WHERE: filters individual transaction rows before they're grouped \u2014\n-- e.g. only look at this month's transactions in the first place.\nSELECT customer_id, SUM(amount) AS total_spent\nFROM transactions\nWHERE transaction_date >= '2026-07-01'\nGROUP BY customer_id\n-- HAVING: filters the grouped result \u2014 applied *after* SUM(amount) is\n-- calculated per customer, since \"total_spent > 5000\" doesn't exist as a\n-- column on any single row, only after aggregation.\nHAVING SUM(amount) > 5000;\n```\n\nTrying to write `WHERE SUM(amount) > 5000` instead would fail \u2014 at the point `WHERE` runs, the rows haven't been grouped yet, so there's no per-customer total to compare against.\n\n## 8. What is an index and why does it matter?\nA data structure (commonly a B-Tree) that speeds up row lookups at the cost of extra storage and slower writes (inserts/updates need to update the index too).\n\n**Real-life scenario:** customer support looks up accounts by `account_number` dozens of times a day.\n\n```sql\n-- Without an index, this scans every row in accounts to find a match.\nSELECT * FROM accounts WHERE account_number = 'ACC-004521';\n\n-- Add an index on the column that's actually searched on:\nCREATE INDEX idx_account_number ON accounts (account_number);\n\n-- Same query now uses the index: the engine looks account_number up in a\n-- B-Tree instead of scanning the whole table, turning a lookup that might\n-- scan millions of rows into one that reads just a handful.\nSELECT * FROM accounts WHERE account_number = 'ACC-004521';\n```\n\nThe trade-off: every `INSERT`/`UPDATE` that touches `account_number` now also has to update this index, so it's not free \u2014 which is why you index columns that are searched/joined on often, not every column.\n\n## 9. What is a transaction? What are the ACID properties?\nA transaction is a unit of work executed as a single logical operation.\n- **Atomicity**: all or nothing.\n- **Consistency**: brings the DB from one valid state to another.\n- **Isolation**: concurrent transactions don't interfere with each other.\n- **Durability**: once committed, changes survive crashes.\n\n**Real-life scenario: transferring money between two bank accounts.**\n\nMoving $100 from Account A to Account B is really two updates that must happen together:\n\n```sql\nBEGIN TRANSACTION;\n\nUPDATE accounts\nSET balance = balance - 100\nWHERE account_id = 'A';\n\nUPDATE accounts\nSET balance = balance + 100\nWHERE account_id = 'B';\n\nCOMMIT;\n```\n\nHere's what each ACID property guarantees about this exact transaction:\n\n- **Atomicity** \u2014 both `UPDATE`s succeed, or neither does. If the app crashes right after debiting A but before crediting B, the database rolls the whole transaction back on restart \u2014 you never end up with money deducted from A and not added to B. Without atomicity, a crash mid-transfer could make $100 vanish.\n\n- **Consistency** \u2014 the database enforces its rules (e.g., a `CHECK (balance >= 0)` constraint) across the whole transaction. If debiting A would push its balance negative and that violates a constraint, the entire transaction is rejected \u2014 you can't end up with a state that breaks the bank's invariants (\"no account may be negative\").\n\n- **Isolation** \u2014 if another transaction is reading Account A's balance at the same time (say, to display it in a mobile app), it won't see the intermediate state where A has been debited but B hasn't been credited yet. It sees either the balance before the transfer or after, never the half-finished version. This is what an isolation level like `READ COMMITTED` or `SERIALIZABLE` controls (see Q10).\n\n- **Durability** \u2014 once `COMMIT` returns successfully, the transfer is permanent. Even if the database server loses power one second later, the updated balances survive (typically because the change was already written to a transaction log on disk before the commit was acknowledged).\n\n**Who actually gives the ACID guarantee?** The **database engine itself** (Postgres, MySQL, etc.) \u2014 never the application framework. A framework annotation like Spring's `@Transactional` doesn't add ACID behavior; it just marks where a transaction starts/commits/rolls back and hands control to the DB driver, which then calls `BEGIN`/`COMMIT`/`ROLLBACK` on the real database. The atomicity, consistency enforcement, isolation, and durability all happen inside the DB engine \u2014 the application layer is only a caller.\n\n## 10. What are the transaction isolation levels?\nRead Uncommitted, Read Committed, Repeatable Read, Serializable \u2014 each trades off consistency guarantees against concurrency/performance. Higher isolation prevents more anomalies (dirty reads, non-repeatable reads, phantom reads) but reduces concurrency.\n\n**Real-life scenario:** Account A has a balance of $500. Transaction 1 debits $100 from A but hasn't committed yet. At the same moment, Transaction 2 reads A's balance to show it in a mobile banking app.\n\n```sql\n-- Transaction 1\nBEGIN TRANSACTION;\nUPDATE accounts SET balance = balance - 100 WHERE account_id = 'A'; -- now $400, not committed\n\n-- Transaction 2 (running concurrently)\nSELECT balance FROM accounts WHERE account_id = 'A';\n```\n\n- Under `READ UNCOMMITTED`, Transaction 2 sees $400 \u2014 a **dirty read**. If Transaction 1 then rolls back, the app just showed the customer money that never actually left their account.\n- Under `READ COMMITTED` (the common default, e.g. in PostgreSQL/SQL Server), Transaction 2 sees the last committed value, $500, until Transaction 1 actually commits.\n- Under `SERIALIZABLE`, the database behaves as if Transaction 1 and Transaction 2 ran one after another, fully preventing any overlap-related anomaly, at the cost of more blocking/retries under load.\n\nIn Spring, the isolation level is set per method via `@Transactional(isolation = ...)`:\n```java\n@Transactional(isolation = Isolation.SERIALIZABLE)\npublic void criticalOperation() {\n    // ...\n}\n```\n`Isolation.DEFAULT` (the default when omitted) just uses whatever the underlying database's own default is \u2014 `READ COMMITTED` for PostgreSQL/SQL Server, `REPEATABLE READ` for MySQL/InnoDB.\n\n## 11. What is a deadlock? How can it be avoided?\nTwo or more transactions waiting on locks held by each other, none able to proceed. Avoided by acquiring locks in a consistent order, keeping transactions short, and using timeouts/deadlock detection.\n\n**\u09ac\u09be\u0982\u09b2\u09be\u09af\u09bc:** Deadlock \u09b9\u09b2\u09cb \u2014 \u09a6\u09c1\u0987 (\u09ac\u09be \u09ac\u09c7\u09b6\u09bf) transaction \u098f\u0995\u09c7 \u0985\u09aa\u09b0\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u0986\u099f\u0995\u09c7 \u09ac\u09b8\u09c7 \u09a5\u09be\u0995\u09c7, \u0995\u09be\u09b0\u09a3 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09c7\u0995\u09c7 \u098f\u0995\u099f\u09be row lock \u0995\u09b0\u09c7 \u09b0\u09c7\u0996\u09c7\u099b\u09c7 \u09af\u09c7\u099f\u09be \u0985\u09a8\u09cd\u09af\u099c\u09a8\u09c7\u09b0 \u09a6\u09b0\u0995\u09be\u09b0 (\u09a8\u09bf\u099a\u09c7\u09b0 \u0989\u09a6\u09be\u09b9\u09b0\u09a3\u09c7 A \u09a7\u09b0\u09c7 B \u099a\u09be\u0987\u099b\u09c7, B \u09a7\u09b0\u09c7 A \u099a\u09be\u0987\u099b\u09c7 \u2014 \u0995\u09c7\u0989 \u098f\u0997\u09cb\u09a4\u09c7 \u09aa\u09be\u09b0\u099b\u09c7 \u09a8\u09be)\u0964 DB \u09a8\u09bf\u099c\u09c7 \u09a5\u09c7\u0995\u09c7 \u098f\u0987 \u099a\u0995\u09cd\u09b0 (cycle) \u09a7\u09b0\u09c7 \u09ab\u09c7\u09b2\u09c7 \u098f\u09ac\u0982 \u098f\u0995\u099f\u09be\u0995\u09c7 rollback \u0995\u09b0\u09c7 \u09a6\u09c7\u09af\u09bc \u2014 \u098f\u099f\u09be **recovery**, prevention \u09a8\u09be\u0964 \u0986\u09b8\u09b2 avoid \u0995\u09b0\u09be\u09b0 \u0989\u09aa\u09be\u09af\u09bc \u09b9\u09b2\u09cb **consistent lock ordering** (\u09a8\u09bf\u099a\u09c7 \u0995\u09cb\u09a1 \u09a6\u09c7\u0996\u09cb): \u09b8\u09ac\u09b8\u09ae\u09af\u09bc \u099b\u09cb\u099f ID \u0986\u0997\u09c7 lock \u0995\u09b0\u09cb, \u09a4\u09be\u09b9\u09b2\u09c7 cycle-\u0987 \u09a4\u09c8\u09b0\u09bf \u09b9\u09ac\u09c7 \u09a8\u09be\u0964\n\n**Real-life scenario:** two transfers happen at the same time in opposite directions.\n\n```sql\n-- Transaction 1: transfer $50 from A to B\nBEGIN TRANSACTION;\nUPDATE accounts SET balance = balance - 50 WHERE account_id = 'A'; -- locks row A\n-- ...about to lock row B next...\nUPDATE accounts SET balance = balance + 50 WHERE account_id = 'B'; -- waits, B is locked by Transaction 2\n\n-- Transaction 2: transfer $30 from B to A (running at the same time)\nBEGIN TRANSACTION;\nUPDATE accounts SET balance = balance - 30 WHERE account_id = 'B'; -- locks row B\n-- ...about to lock row A next...\nUPDATE accounts SET balance = balance + 30 WHERE account_id = 'A'; -- waits, A is locked by Transaction 1\n```\n\nTransaction 1 holds A and waits for B; Transaction 2 holds B and waits for A \u2014 neither can finish. The database detects this and kills one transaction (rolling it back with a deadlock error) so the other can proceed. This is exactly why the \"acquire locks in a consistent order\" fix matters in practice: if every transfer always locked the lower account ID first, both transactions would queue for A first instead of deadlocking on each other.\n\n**How to actually avoid it \u2014 consistent lock ordering in code:** always lock rows in the same fixed order (e.g. by primary key), regardless of the order the caller passed the IDs in:\n```java\n@Transactional\npublic void transfer(Long fromId, Long toId, BigDecimal amount) {\n    Long firstId  = fromId < toId ? fromId : toId;   // always lock the smaller id first\n    Long secondId = fromId < toId ? toId : fromId;\n\n    Account first  = accountRepository.findByIdForUpdate(firstId);\n    Account second = accountRepository.findByIdForUpdate(secondId);\n    // ...apply the debit/credit to whichever of first/second is `from`/`to`...\n}\n```\nBoth `transfer(A, B, ...)` and `transfer(B, A, ...)` now lock `A` first \u2014 no cycle can form, so it doesn't just get caught and rolled back, it never happens.\n\n**Which databases detect/recover from it:** all major RDBMS do \u2014 it isn't a premium feature.\n| DB | How |\n|---|---|\n| **PostgreSQL** (this repo's DB) | Background check every `deadlock_timeout` (default 1s); kills one transaction, error `deadlock detected` (SQLSTATE `40P01`) |\n| **MySQL/InnoDB** | Real-time wait-graph tracking; rolls back the cheapest transaction to undo |\n| **SQL Server** | \"Deadlock monitor\" thread (~every 5s); picks a lowest-cost \"victim\" |\n| **Oracle** | Real-time detection; rolls back the transaction that detected the cycle |\n\nThis is recovery, not prevention \u2014 the DB only cleans up after a deadlock already happened; the app still needs to retry the rolled-back transaction.\n\n## 12. What's the difference between a clustered and non-clustered index?\nA **clustered index** determines the physical storage order of table data (only one per table). A **non-clustered index** is a separate structure with pointers back to the actual rows (a table can have many).\n\n**\u09ac\u09be\u0982\u09b2\u09be\u09af\u09bc:** **Clustered index** \u09ae\u09be\u09a8\u09c7 \u2014 \u099f\u09c7\u09ac\u09bf\u09b2\u09c7\u09b0 row-\u0997\u09c1\u09b2\u09cb \u09a1\u09bf\u09b8\u09cd\u0995\u09c7 *\u0986\u09b8\u09b2\u09c7\u0987* \u09b8\u09c7\u0987 column \u0985\u09a8\u09c1\u09af\u09be\u09af\u09bc\u09c0 sorted order-\u098f \u09b8\u09be\u099c\u09be\u09a8\u09cb \u09a5\u09be\u0995\u09c7 (\u09ac\u0987\u09af\u09bc\u09c7\u09b0 \u09aa\u09be\u09a4\u09be\u09b0 \u09ae\u09a4\u09cb \u2014 \u09aa\u09be\u09a4\u09be\u0997\u09c1\u09b2\u09cb \u09a8\u09bf\u099c\u09c7\u0987 \u0995\u09cd\u09b0\u09ae\u09be\u09a8\u09c1\u09b8\u09be\u09b0\u09c7 \u09b8\u09be\u099c\u09be\u09a8\u09cb)\u0964 \u098f\u0995\u099f\u09be \u099f\u09c7\u09ac\u09bf\u09b2\u09c7 \u098f\u099f\u09be \u09ae\u09be\u09a4\u09cd\u09b0 **\u098f\u0995\u099f\u09be\u0987** \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7, \u0995\u09be\u09b0\u09a3 data physically \u098f\u0995\u09ac\u09be\u09b0\u0987 \u098f\u0995\u09ad\u09be\u09ac\u09c7 \u09b8\u09be\u099c\u09be\u09a8\u09cb \u09af\u09be\u09af\u09bc\u0964 \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 `PRIMARY KEY`-\u09a4\u09c7 automatic \u09b9\u09af\u09bc\u0964 **Non-clustered index** \u09b9\u09b2\u09cb \u098f\u0995\u099f\u09be **\u0986\u09b2\u09be\u09a6\u09be \u099b\u09cb\u099f lookup table** \u2014 data \u09a8\u09bf\u099c\u09c7 \u09af\u09c7\u0996\u09be\u09a8\u09c7 \u0986\u099b\u09c7 \u09b8\u09c7\u0996\u09be\u09a8\u09c7\u0987 \u09a5\u09be\u0995\u09c7, \u09b6\u09c1\u09a7\u09c1 \u0986\u09b2\u09be\u09a6\u09be\u09ad\u09be\u09ac\u09c7 sorted values + row-\u098f\u09b0 \u09a6\u09bf\u0995\u09c7 pointer \u09b0\u09be\u0996\u09be \u09b9\u09af\u09bc (\u09ac\u0987\u09af\u09bc\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7\u09b0 index \u09aa\u09be\u09a4\u09be\u09b0 \u09ae\u09a4\u09cb \u2014 \u09ac\u09bf\u09b7\u09af\u09bc\u09ad\u09bf\u09a4\u09cd\u09a4\u09bf\u0995 \u09a4\u09be\u09b2\u09bf\u0995\u09be, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u0986\u09b8\u09b2 \u0995\u09a8\u09cd\u099f\u09c7\u09a8\u09cd\u099f \u0985\u09a8\u09cd\u09af \u09aa\u09be\u09a4\u09be\u09af\u09bc)\u0964 \u098f\u0995\u099f\u09be \u099f\u09c7\u09ac\u09bf\u09b2\u09c7 \u0985\u09a8\u09c7\u0995\u0997\u09c1\u09b2\u09cb non-clustered index \u09a5\u09be\u0995\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964\n\n**PostgreSQL-\u098f \u0997\u09c1\u09b0\u09c1\u09a4\u09cd\u09ac\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ac\u09cd\u09af\u09a4\u09bf\u0995\u09cd\u09b0\u09ae:** Postgres-\u098f \u0986\u09b8\u09b2 \"clustered index\" \u09ac\u09b2\u09c7 \u0995\u09bf\u099b\u09c1 \u09a8\u09c7\u0987 \u2014 table \u09b8\u09ac\u09b8\u09ae\u09af\u09bc unordered heap \u09b9\u09bf\u09b8\u09c7\u09ac\u09c7 \u09a5\u09be\u0995\u09c7, primary key \u09a6\u09bf\u09b2\u09c7\u0993 physical order \u0997\u09cd\u09af\u09be\u09b0\u09be\u09a8\u09cd\u099f\u09bf \u09b9\u09af\u09bc \u09a8\u09be\u0964 `CLUSTER` command \u09a6\u09bf\u09af\u09bc\u09c7 \u098f\u0995\u09ac\u09be\u09b0 physically reorder \u0995\u09b0\u09be \u09af\u09be\u09af\u09bc, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a8\u09a4\u09c1\u09a8 insert/update-\u098f \u09b8\u09c7\u0987 order \u09a5\u09be\u0995\u09c7 \u09a8\u09be, \u09a4\u09be\u0987 \u09b8\u09ae\u09af\u09bc\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u0986\u09ac\u09be\u09b0 \u098f\u09b2\u09cb\u09ae\u09c7\u09b2\u09cb \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964 \u098f\u0987 repo \u09af\u09c7\u09b9\u09c7\u09a4\u09c1 PostgreSQL \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09c7, \u09a4\u09be\u0987 \u098f\u0996\u09be\u09a8\u09c7 `account_id BIGINT PRIMARY KEY` \u098f\u0995\u099f\u09be \u09a6\u09cd\u09b0\u09c1\u09a4 sorted **index** \u09a6\u09c7\u09af\u09bc \u09a0\u09bf\u0995\u0987, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 MySQL/SQL Server-\u098f\u09b0 \u09ae\u09a4\u09cb \"table \u09a8\u09bf\u099c\u09c7\u0987 \u09b8\u09c7\u0987 order-\u098f \u09b8\u09be\u099c\u09be\u09a8\u09cb \u0986\u099b\u09c7\" \u098f\u0987 \u0997\u09cd\u09af\u09be\u09b0\u09be\u09a8\u09cd\u099f\u09bf \u09a6\u09c7\u09af\u09bc \u09a8\u09be\u0964\n\n**Real-life scenario:** an `accounts` table with millions of rows.\n\n```sql\n-- Clustered index (often automatic on the primary key):\n-- rows are physically stored on disk sorted by account_id\nCREATE TABLE accounts (\n    account_id   BIGINT PRIMARY KEY,   -- clustered index goes here\n    customer_name VARCHAR(100),\n    balance      DECIMAL(12,2)\n);\n\n-- Non-clustered index: a separate lookup structure\nCREATE INDEX idx_customer_name ON accounts (customer_name);\n```\n\n`SELECT * FROM accounts WHERE account_id = 12345` is fast because the table itself is stored in `account_id` order \u2014 the engine jumps straight to the right physical location. `SELECT * FROM accounts WHERE customer_name = 'Alice'` uses the separate `idx_customer_name` index, which stores `customer_name` values sorted along with a pointer back to the actual row \u2014 one extra hop, but still far faster than scanning every row.\n\n**Note \u2014 this behaves differently per database, and it's a common gotcha:**\n- **MySQL (InnoDB)** and **SQL Server**: you don't create the clustered index yourself \u2014 declaring `PRIMARY KEY` creates it automatically (InnoDB falls back to the first `UNIQUE NOT NULL` column, or a hidden internal row ID, if there's no primary key). SQL Server also lets you override this with `PRIMARY KEY NONCLUSTERED` and put the clustered index on a different column instead.\n- **PostgreSQL doesn't really have this concept.** Tables are stored as an unordered heap regardless of the primary key. Postgres does have a `CLUSTER` command (`CLUSTER accounts USING accounts_pkey;`) that physically reorders the table to match an index \u2014 but only **once**, at the moment you run it. New inserts/updates aren't kept in that order automatically, so the physical ordering drifts again over time unless you periodically re-run `CLUSTER`, which most teams don't bother doing. So in Postgres, `account_id BIGINT PRIMARY KEY` still gives you a fast, sorted **index** lookup \u2014 it just doesn't mean the table's physical storage is kept in that order the way InnoDB guarantees.\n\n## 13. What is a stored procedure? What is a trigger?\nA **stored procedure** is precompiled SQL logic stored in the database, callable by name. A **trigger** is code that automatically executes in response to an event (INSERT/UPDATE/DELETE) on a table.\n\n**Real-life scenario:** wrap the transfer logic in a stored procedure, and automatically log every balance change with a trigger.\n\n```sql\n-- Stored procedure: callers just do CALL transfer_funds('A', 'B', 100)\n-- instead of writing the transaction by hand every time.\nCREATE PROCEDURE transfer_funds(IN from_acct VARCHAR(10), IN to_acct VARCHAR(10), IN amount DECIMAL(12,2))\nBEGIN\n    START TRANSACTION;\n    UPDATE accounts SET balance = balance - amount WHERE account_id = from_acct;\n    UPDATE accounts SET balance = balance + amount WHERE account_id = to_acct;\n    COMMIT;\nEND;\n```\n\n**Calling it from application code \u2014 it's not a file, it's a database object you call over the same connection you already use for queries.** In a Spring Boot app (see `src/com/shihab/springboot`), Spring Data JPA can call it directly from a repository method with `@Procedure`, the same way `EmployeeRepository` declares derived query methods:\n\n```java\npublic interface AccountRepository extends JpaRepository<Account, Long> {\n\n    @Procedure(procedureName = \"transfer_funds\")\n    void transferFunds(@Param(\"from_acct\") String fromAccount,\n                        @Param(\"to_acct\") String toAccount,\n                        @Param(\"amount\") BigDecimal amount);\n}\n```\n\nCalling `accountRepository.transferFunds(\"A\", \"B\", new BigDecimal(\"100\"))` from a service method then runs the exact same `CALL transfer_funds('A', 'B', 100)` under the hood \u2014 no raw JDBC or native query boilerplate needed.\n\n```sql\n-- balance_audit also records *who* made the change, not just what changed \u2014\n-- important for fraud investigation and dispute resolution, not just\n-- reconstructing values.\nCREATE TABLE balance_audit (\n    audit_id     BIGINT PRIMARY KEY AUTO_INCREMENT,\n    account_id   VARCHAR(10),\n    old_balance  DECIMAL(12,2),\n    new_balance  DECIMAL(12,2),\n    changed_by   VARCHAR(50),   -- who/what made the change\n    changed_at   TIMESTAMP\n);\n\n-- Trigger: fires automatically, no one has to remember to call it\nCREATE TRIGGER log_balance_change\nAFTER UPDATE ON accounts\nFOR EACH ROW\nINSERT INTO balance_audit (account_id, old_balance, new_balance, changed_by, changed_at)\nVALUES (OLD.account_id, OLD.balance, NEW.balance, CURRENT_USER(), NOW());\n```\n\nEvery time any code updates a row in `accounts` \u2014 whether via the stored procedure, an app, or a manual query \u2014 the trigger fires and writes an audit row, so the bank always has a change history without every caller having to remember to log it.\n\n**Note on `changed_by`:** `CURRENT_USER()` only gives you the *database* login (e.g. `app_service`), which is often the same shared connection for every request from your application \u2014 not the actual bank employee or customer who triggered it. To capture the real end-user, the application typically sets a session variable before running the update (e.g. `SET @app_user_id = 'employee_42'` in MySQL, or `SET LOCAL app.user_id = 'employee_42'` in PostgreSQL) and the trigger reads that instead of `CURRENT_USER()`. Worth mentioning in an interview if asked \"how do you know *who* made a change\" \u2014 the DB-level username usually isn't enough on its own.\n\n**PostgreSQL note \u2014 the trigger above is simplified/MySQL-style.** PostgreSQL doesn't let you write the trigger body inline like that; it requires a separate trigger *function* that the trigger calls, and reads the custom session variable (see the earlier `app.user_id` question) via `current_setting()` instead of `CURRENT_USER()`. The full, real flow:\n\n```sql\n-- 1. Trigger function: the actual logic PostgreSQL requires triggers to call.\nCREATE OR REPLACE FUNCTION log_balance_change_fn() RETURNS TRIGGER AS $$\nBEGIN\n    INSERT INTO balance_audit (account_id, old_balance, new_balance, changed_by, changed_at)\n    VALUES (\n        OLD.account_id,\n        OLD.balance,\n        NEW.balance,\n        current_setting('app.user_id', true), -- true = return NULL instead of erroring if unset\n        NOW()\n    );\n    RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\n-- 2. The trigger itself just wires the event to that function.\nCREATE TRIGGER log_balance_change\nAFTER UPDATE ON accounts\nFOR EACH ROW\nEXECUTE FUNCTION log_balance_change_fn();\n```\n\n```sql\n-- 3. The application must set app.user_id in the *same transaction*,\n-- before the UPDATE, so it's visible when the trigger fires.\nBEGIN;\nSET LOCAL app.user_id = 'employee_42';\nUPDATE accounts SET balance = balance - 100 WHERE account_id = 'A';  -- trigger fires here\nCOMMIT;                                                              -- SET LOCAL resets automatically\n```\n\nIn a Spring Boot service (see `src/com/shihab/springboot`), step 3 means issuing that `SET LOCAL` as a native query at the start of the same `@Transactional` method that performs the update, so JPA keeps both statements on one connection:\n\n```java\n@Transactional\npublic EmployeeDTO updateEmployee(Long id, EmployeeDTO dto) {\n    entityManager.createNativeQuery(\"SET LOCAL app.user_id = :userId\")\n                 .setParameter(\"userId\", getCurrentUserId())\n                 .executeUpdate();\n    // ...rest of the update \u2014 same transaction, same DB connection\n}\n```\n\nIf `SET LOCAL` and the `UPDATE` ran on different pooled connections, `current_setting('app.user_id', true)` would come back `NULL` \u2014 the setting doesn't travel with the request, only with the connection/transaction it was set on.\n\n**Note on where trigger code actually lives:** a trigger is a two-sided thing.\n- **Inside the database**, `CREATE TRIGGER` registers it as a database object in the engine's system catalog (`information_schema.triggers` in MySQL, `pg_trigger`/`\\dy` in PostgreSQL) \u2014 it's not a file, and it fires automatically forever until someone runs `DROP TRIGGER`.\n- **In your codebase**, the *source* of that `CREATE TRIGGER` statement should still be tracked in version control \u2014 otherwise nobody can see it in code review or know it exists without inspecting the live database. In practice this means a versioned schema-migration file (e.g. Flyway's `V12__add_balance_audit_trigger.sql`, Liquibase, Rails/Django migrations), not something typed once into a DB client and forgotten. For a Spring Boot app with Flyway, that'd be `resources/db/migration/`.\n\nThis \"invisible unless version-controlled\" nature is itself one of the real downsides teams cite when choosing application-level logic over triggers.\n\n## 14. What is the difference between DELETE, TRUNCATE, and DROP?\n- **DELETE**: removes rows (can filter with WHERE), logged, can be rolled back, triggers fire.\n- **TRUNCATE**: removes all rows quickly, minimal logging, resets identity, generally can't be rolled back (DB-dependent).\n- **DROP**: removes the entire table structure and data.\n\n**Real-life scenario**, three different cleanup tasks in the same bank system:\n\n```sql\n-- DELETE: remove specific closed accounts with a zero balance.\n-- Filtered, logged, triggers (like log_balance_change) still fire, can be rolled back.\nDELETE FROM accounts WHERE status = 'CLOSED' AND balance = 0;\n\n-- TRUNCATE: wipe a daily staging table after its data has been loaded into\n-- the real tables. No filtering needed, no per-row logging, very fast.\nTRUNCATE TABLE daily_transactions_staging;\n\n-- DROP: a temporary table created for a one-off migration is no longer needed.\n-- Removes the table definition itself, not just its rows.\nDROP TABLE migration_temp_2025;\n```\n\nUsing `DELETE` on the staging table would work too, just far slower on millions of rows. Using `TRUNCATE` on `accounts` instead of `DELETE ... WHERE ...` would be a mistake \u2014 it ignores the `WHERE` filter and wipes every account.\n\n## 15. What is a view?\nA virtual table defined by a stored SQL query. It doesn't store data itself (unless materialized) but simplifies complex queries and can restrict access to specific columns/rows.\n\n**Real-life scenario:** the fraud team should be able to see high-value accounts, but not every column (e.g., not the customer's SSN stored elsewhere in the customer table).\n\n```sql\nCREATE VIEW high_value_accounts AS\nSELECT account_id, customer_name, balance, status\nFROM accounts\nWHERE balance > 100000;\n```\n\nThe fraud team just runs `SELECT * FROM high_value_accounts;` \u2014 a simple query \u2014 instead of repeating the `WHERE balance > 100000` filter (and remembering which columns are safe to expose) every time. Grant them access to the view only, not the underlying `accounts` table, and they can never see columns you didn't include.\n\n## 16. How would you optimize a slow SQL query?\nCheck the execution plan (`EXPLAIN`), ensure proper indexes exist on filtered/joined columns, avoid `SELECT *`, avoid functions on indexed columns in WHERE clauses, reduce joins where possible, and consider query rewriting or denormalization.\n\n**Real-life scenario:** the \"show my last 30 days of transactions\" screen is slow.\n\n```sql\n-- Slow: no index on customer_id or transaction_date,\n-- so the engine scans the entire transactions table.\nSELECT * FROM transactions\nWHERE customer_id = 42\n  AND transaction_date > '2026-06-21';\n```\n\n```sql\n-- Check what the engine is actually doing:\nEXPLAIN SELECT * FROM transactions\nWHERE customer_id = 42\n  AND transaction_date > '2026-06-21';\n-- reports \"type: ALL\" (full table scan) \u2014 confirms no useful index is used.\n```\n\n```sql\n-- Fix: add a composite index matching how the query filters,\n-- and select only the columns the screen actually needs.\nCREATE INDEX idx_customer_date ON transactions (customer_id, transaction_date);\n\nSELECT transaction_id, amount, transaction_date\nFROM transactions\nWHERE customer_id = 42\n  AND transaction_date > '2026-06-21';\n```\n\nRe-running `EXPLAIN` now shows the engine using `idx_customer_date` to jump straight to customer 42's recent rows instead of scanning the whole table.\n\n## 17. What is the N+1 query problem?\nA performance issue common in ORMs where fetching a list of N parent records triggers N additional queries to fetch related child records, instead of one batched query (e.g., a JOIN or `IN` clause).\n\n**Real-life scenario:** a screen lists 50 customers along with each customer's most recent trans
