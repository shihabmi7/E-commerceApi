 duplicates included.\n\n## 20. What is a constraint? Name common types.\nRules enforced on table columns: `NOT NULL`, `UNIQUE`, `PRIMARY KEY`, `FOREIGN KEY`, `CHECK`, `DEFAULT`.\n\n**Real-life scenario:** the `accounts` table encodes the bank's business rules directly in the schema, so bad data can never be inserted no matter which application writes to it.\n\n```sql\nCREATE TABLE accounts (\n    account_id    BIGINT PRIMARY KEY,                       -- PRIMARY KEY: uniquely identifies each account\n    account_number VARCHAR(20) NOT NULL UNIQUE,              -- NOT NULL + UNIQUE: every account needs a number, and no two accounts share one\n    customer_id   BIGINT NOT NULL REFERENCES customers(customer_id), -- FOREIGN KEY: can't create an account for a customer that doesn't exist\n    balance       DECIMAL(12,2) NOT NULL CHECK (balance >= 0), -- CHECK: balance can never go negative\n    status        VARCHAR(10) NOT NULL DEFAULT 'ACTIVE'       -- DEFAULT: new accounts are ACTIVE unless told otherwise\n);\n```\n\nTry `INSERT INTO accounts (account_id, account_number, customer_id, balance) VALUES (1, 'ACC-001', 999, -50)` where customer `999` doesn't exist and the balance is negative — the database rejects it outright on both the foreign key and the check constraint, before it ever becomes an application bug.\n\n## 21. What's the difference between a primary key and a unique key?\nBoth enforce uniqueness across a column (or set of columns), but a table can have only **one** primary key and **multiple** unique keys, and a primary key column cannot be `NULL` while a unique key column can (most databases allow multiple `NULL`s in a unique column, since `NULL` is never considered equal to another `NULL`).\n\n**Real-life scenario:** the `accounts` table.\n\n```sql\nCREATE TABLE accounts (\n    account_id     BIGINT PRIMARY KEY,        -- the identity of the row; never null, only one per table\n    account_number VARCHAR(20) UNIQUE,        -- must be unique, but could theoretically be left null for a draft row\n    ssn            VARCHAR(11) UNIQUE         -- a second, independent uniqueness rule on the same table\n);\n```\n\n`account_id` is what every foreign key elsewhere in the schema points to — it's the row's identity. `account_number` and `ssn` are both \"must be unique\" but neither is *the* identity; a table can carry as many of these side uniqueness rules as it needs, but only one primary key.\n\n## 22. What are window functions? How do they differ from GROUP BY?\nA window function (`OVER (...)`) computes a value across a set of related rows **without collapsing them into one row per group**, unlike `GROUP BY`/aggregate functions which return one row per group. Each input row keeps its own row in the output, with the computed value attached.\n\n**Real-life scenario:** rank each customer's transactions by amount, without losing the individual transaction rows (a `GROUP BY` here would only give you one row per customer, not per transaction).\n\n```sql\nSELECT\n    customer_id,\n    transaction_id,\n    amount,\n    RANK() OVER (PARTITION BY customer_id ORDER BY amount DESC) AS rank_within_customer\nFROM transactions;\n```\n\n`PARTITION BY customer_id` resets the ranking for each customer (like a `GROUP BY` boundary), and `ORDER BY amount DESC` decides the rank within that partition — but every transaction row is still present in the result, each carrying its own rank. Common window functions: `ROW_NUMBER()` (always unique, 1,2,3...), `RANK()` (ties share a rank, next rank skips), `DENSE_RANK()` (ties share a rank, next rank doesn't skip), `LAG()`/`LEAD()` (read a previous/next row's value without a self-join).\n\n## 23. What is a CTE (Common Table Expression)?\nA named, temporary result set defined with `WITH ... AS (...)` and used within the query that follows it — a way to break a complex query into readable, named steps instead of nesting subqueries.\n\n**Real-life scenario:** find customers whose total balance across all their accounts exceeds $50,000.\n\n```sql\nWITH customer_totals AS (\n    SELECT customer_id, SUM(balance) AS total_balance\n    FROM accounts\n    GROUP BY customer_id\n)\nSELECT c.customer_name, ct.total_balance\nFROM customer_totals ct\nJOIN customers c ON c.customer_id = ct.customer_id\nWHERE ct.total_balance > 50000;\n```\n\nWithout the CTE, this would either need a subquery in the `FROM` clause (harder to read once you have more than one step) or computing the sum twice. A CTE also supports **recursion** (`WITH RECURSIVE`), which is how you walk a hierarchy in SQL — e.g. an `employees(id, manager_id)` table, finding everyone under a given manager, several levels deep, without knowing the depth in advance.\n\n## 24. What's the difference between EXISTS and IN?\nBoth check membership, but `EXISTS` stops as soon as it finds one matching row (a boolean check), while `IN` builds/compares against the full list of values the subquery returns. For large subquery results, `EXISTS` is usually faster; more importantly, they behave **differently with `NULL`**.\n\n**Real-life scenario:** find customers who have at least one transaction over $10,000.\n\n```sql\n-- EXISTS: stops at the first match per customer\nSELECT customer_name FROM customers c\nWHERE EXISTS (\n    SELECT 1 FROM transactions t\n    WHERE t.customer_id = c.customer_id AND t.amount > 10000\n);\n\n-- IN: builds the full list of matching customer_ids first, then checks membership\nSELECT customer_name FROM customers c\nWHERE c.customer_id IN (\n    SELECT customer_id FROM transactions WHERE amount > 10000\n);\n```\n\n**The NULL gotcha:** `NOT IN` silently returns **zero rows** if the subquery's result contains even a single `NULL` — `x NOT IN (1, 2, NULL)` is neither true nor false for any `x`, it's `UNKNOWN`, and `UNKNOWN` rows are filtered out. `NOT EXISTS` doesn't have this trap, since it's just checking \"did any row match,\" not comparing against a list that might contain `NULL`. This is a classic interview/production gotcha: prefer `NOT EXISTS` over `NOT IN` whenever the subquery's column can be `NULL`.\n\n## 25. What do ON DELETE CASCADE / SET NULL / RESTRICT mean on a foreign key?\nThey tell the database what to do to the **child** rows when the **parent** row they reference is deleted (or updated). Without one specified, most databases default to `RESTRICT`/`NO ACTION` — the delete is simply rejected if children still reference it.\n\n**Real-life scenario:** what happens to a customer's `Cart` rows if the customer account is deleted.\n\n```sql\n-- RESTRICT (default): deleting the customer fails if any cart rows reference them\ncustomer_id BIGINT REFERENCES customers(customer_id)\n\n-- CASCADE: deleting the customer automatically deletes their cart rows too\ncustomer_id BIGINT REFERENCES customers(customer_id) ON DELETE CASCADE\n\n-- SET NULL: deleting the customer leaves the cart row, but blanks out customer_id\ncustomer_id BIGINT REFERENCES customers(customer_id) ON DELETE SET NULL\n```\n\n`CASCADE` is convenient but dangerous if applied carelessly — a single delete can silently ripple through many tables. `SET NULL` requires the column to be nullable and is useful when the child record should survive on its own (e.g. an audit log shouldn't vanish just because the actor was deleted). `RESTRICT` is the safest default: it forces you to explicitly decide, rather than losing data by accident. In this repo, `Cart.user`/`Cart.product` (see [Cart.java](../../../src/main/java/com/shihab/ecommerceapi/model/Cart.java)) don't set a cascade behavior, so the database default (reject the delete) applies.\n\n## 26. What is connection pooling, and why does it matter?\nOpening a new database connection (TCP handshake, auth, session setup) is expensive — tens of milliseconds. A connection pool keeps a set of already-open connections ready to reuse, so a request borrows one, uses it, and returns it instead of opening/closing a connection per request.\n\n**Real-life scenario:** this repo's own default setup — Spring Boot auto-configures **HikariCP**, with a default `maximum-pool-size` of 10, and `spring.datasource.*` in `application.properties` pointing at Postgres. No explicit Hikari tuning is set, so the default of 10 connections per app instance applies.\n\n```properties\n# would go in application.properties if you wanted to override the default\nspring.datasource.hikari.maximum-pool-size=10\nspring.datasource.hikari.minimum-idle=10\n```\n\nThe pool size matters more once you scale horizontally: if Postgres allows `max_connections=100` and this app scales to 8 pods, each holding its own pool of 10, that's `8 x 10 = 80` connections — still under the limit, but close, and it leaves little headroom for admin/other clients. A bigger pool per pod isn't automatically \"faster\" either — past a point, more concurrent connections just means more contention inside the database itself; a smaller, well-sized pool per pod, kept under the DB's real ceiling, usually performs as well or better than a larger one.\n\n## 27. What's the difference between OLTP and OLAP?\n**OLTP** (Online Transaction Processing) is optimized for many small, fast read/write transactions — the typical application database (place an order, update a cart, look up one customer). **OLAP** (Online Analytical Processing) is optimized for large, complex read-heavy queries over huge volumes of historical data (aggregations, trends, reports across millions of rows).\n\n**Real-life scenario:** this e-commerce app's own database is OLTP — `CartController.addToCart`, `ProductController.getById` are all quick, targeted reads/writes on current data. A separate analytics question like \"total revenue by category, by month, for the last 3 years\" is an OLAP-shaped query: it scans huge amounts of historical data and does heavy aggregation, which would compete with and slow down the live OLTP traffic if run against the same database.\n\n| | OLTP | OLAP |\n|---|---|---|\n| Query shape | Short, targeted (`WHERE id = ?`) | Broad, aggregated (`GROUP BY`, `SUM`, date ranges) |\n| Data | Current, normalized | Historical, often denormalized (star schema) |\n| Optimized for | Write throughput, low latency per request | Read throughput over large scans |\n| Example | This project's Postgres DB | A data warehouse (Snowflake, Redshift, BigQuery) |\n\nThis is exactly why heavy reporting queries are usually run against a **replica** or a separate data warehouse, not the primary OLTP database — see Q28.\n\n## 28. Sharding vs. partitioning vs. replication — what's the difference?\nAll three are ways to scale a database beyond one machine, but they solve different problems.\n\n- **Partitioning** — splitting **one large table** into smaller physical pieces (by range, list, or hash of a column), usually still on **one** database server. Queries that target the partition key only touch the relevant piece instead of the whole table. Solves \"this one table is too big to scan efficiently.\"\n- **Sharding** — splitting a table's rows **across multiple separate database servers** (each shard holds a different subset of rows, e.g. by customer ID range). Solves \"this one server can't hold/serve all the data or traffic,\" at the cost of cross-shard queries and joins becoming much harder.\n- **Replication** — copying the **same data** to multiple servers (a primary that accepts writes, and one or more replicas that stay in sync and serve reads). Solves \"one server can't handle all the read traffic\" and \"I need a hot standby if the primary fails\" — every replica has the full dataset, unlike a shard.\n\n```sql\n-- Partitioning example (Postgres): one logical table, physically split by date range\nCREATE TABLE transactions (\n    transaction_id BIGINT,\n    transaction_date DATE,\n    amount DECIMAL(12,2)\n) PARTITION BY RANGE (transaction_date);\n\nCREATE TABLE transactions_2026 PARTITION OF transactions\n    FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');\n```\n\nA common real-world combination: replicate for read scaling and failover, partition the biggest tables for query performance, and only reach for sharding once a single server genuinely can't hold the data or absorb the write load anymore — sharding is the most operationally complex of the three, so it's usually the last resort, not the first choice.\n\n## 29. What is MVCC, and how does it let readers and writers avoid blocking each other?\n**Multi-Version Concurrency Control**: instead of locking a row for reads, the database keeps multiple *versions* of a row and gives each transaction a consistent snapshot as of when it started. A reader never blocks a writer, and a writer never blocks a reader — only two writers touching the same row actually contend.\n\n**Real-life scenario:** a `SELECT` on `Product` while an `UPDATE` to the same row is mid-flight.\n```sql\n-- Transaction 1 (long-running report query)\nBEGIN;\nSELECT * FROM products WHERE id = 5;  -- sees the row as of this transaction's snapshot\n\n-- Transaction 2 (concurrent update)\nUPDATE products SET price = 12.99 WHERE id = 5;  -- creates a NEW row version, doesn't block T1's read\nCOMMIT;\n```\nIn Postgres, `UPDATE` doesn't modify the row in place — it writes a brand-new row version (old row marked with an `xmax`, new one gets an `xmin`) and each transaction only sees the version valid for its own snapshot (isolation level dependent, see Q10). The old version becomes **dead** once no transaction can still see it — which is exactly what Q30 (`VACUUM`) has to clean up. This is also why Postgres never needs a dedicated \"read lock\" the way some older engines do.\n\n## 30. What is VACUUM in PostgreSQL, and why does it matter?\nBecause MVCC (Q29) never deletes an old row version in place, `UPDATE`/`DELETE` leave behind **dead tuples** — old versions nothing can see anymore, but still physically occupying disk space. `VACUUM` reclaims that space for reuse (it does *not* shrink the file back to the OS by default — that needs `VACUUM FULL`, which takes an exclusive lock).\n\n**Real-life scenario:** `Cart` rows get updated constantly (`bumpQuantity` in `CartService.addToCart`) — every bump leaves a dead tuple behind.\n```sql\nVACUUM ANALYZE cart;   -- reclaims dead tuple space + refreshes planner statistics\n```\nAutovacuum runs this automatically in the background by default, but a table with very high write/update churn (like a busy `cart` table) can still bloat faster than autovacuum keeps up, especially under heavy load or long-running transactions (a transaction open for hours prevents Postgres from considering rows dead, since *that* transaction might still need the old version). Left unchecked, table and index bloat slows every query on that table and eventually forces manual intervention. This is the same underlying mechanism behind Q47 in the MCQ file (the on-call doctors `SERIALIZABLE` anomaly) — MVCC snapshots are what let two concurrent reads both see \"2 on duty\" even while updates are in flight.\n\n## 31. How do you read an `EXPLAIN ANALYZE` output?\n`EXPLAIN` shows the planner's chosen query plan and its *estimated* cost; `EXPLAIN ANALYZE` actually **runs** the query and adds *real* timing/row counts, which is what you compare estimated vs. actual to spot a bad plan.\n```sql\nEXPLAIN ANALYZE\nSELECT * FROM transactions WHERE customer_id = 42 AND transaction_date > '2026-06-21';\n```\n```\nBitmap Heap Scan on transactions  (cost=12.50..145.32 rows=40 width=64) (actual time=0.45..2.10 rows=38 loops=1)\n  Recheck Cond: (customer_id = 42)\n  ->  Bitmap Index Scan on idx_customer_date  (cost=0.00..12.49 rows=40 width=0) (actual time=0.30..0.30 rows=38 loops=1)\n        Index Cond: (customer_id = 42)\n  Filter: (transaction_date > '2026-06-21')\nPlanning Time: 0.15 ms\nExecution Time: 2.35 ms\n```\nWhat to look for:\n- **Scan type**: `Seq Scan` (reads the whole table — fine for a small table, a red flag on a big one), `Index Scan` (jumps via the index, fetches rows one at a time), `Bitmap Heap Scan` (index finds matching rows in one pass, then fetches the actual pages in physical order — cheaper than `Index Scan` when many rows match).\n- **`rows=X` estimated vs. `rows=Y` actual**: a huge gap means the planner's statistics are stale (`ANALYZE` the table) or the query needs rewriting — a bad row estimate often means every plan decision downstream (join order, join algorithm) is also wrong.\n- **`cost=start..total`**: arbitrary planner units, not milliseconds — only useful for comparing plans against each other, not as an absolute number.\n- **Nested loops with a high `loops=N`** on an inner scan are a common N+1-at-the-SQL-level smell — the same shape as the ORM-level N+1 problem in Q17, just visible directly in the plan.\n\n## 32. What is a covering index / index-only scan?\nAn index that includes **every column the query needs** (not just the `WHERE`/`JOIN` columns), so Postgres can answer the query straight from the index without ever touching the actual table (heap) rows.\n```sql\n-- Query only ever needs these 3 columns\nSELECT customer_id, transaction_date, amount\nFROM transactions\nWHERE customer_id = 42;\n\n-- Covering index: customer_id for the WHERE, INCLUDE adds the rest without making them sort keys\nCREATE INDEX idx_covering ON transactions (customer_id) INCLUDE (transaction_date, amount);\n```\nWithout `INCLUDE`, Postgres finds the matching index entries, then still has to jump to the heap to fetch `transaction_date`/`amount` (a \"heap fetch\" per row) — extra random I/O. With every needed column inside the index, `EXPLAIN` shows `Index Only Scan`, skipping the heap entirely (subject to Postgres's visibility map being up to date, which is another thing `VACUUM`, Q30, maintains). The trade-off: a wider index costs more disk space and slightly more write overhead, so it's worth it only for genuinely hot, narrow queries.\n\n## 33. What is write-ahead logging (WAL), and how does it relate to durability and replication?\nBefore any change is applied to the actual data files, Postgres first writes a record of that change to the **WAL** (a sequential, append-only log — the actual mechanism behind the \"commit log\" concept from `kafka-questions.md` Q2, just for a relational DB instead of Kafka). Once the WAL record is safely on disk, the transaction can be acknowledged as committed — this is what gives Durability (the \"D\" in ACID, Q9) even if the server crashes right after.\n```\nClient: COMMIT\n   │\n   ▼\nPostgres: write change to WAL (fsync to disk)  ← durability guaranteed HERE\n   │\n   ▼\nPostgres: acknowledges COMMIT to client\n   │\n   ▼ (can happen later, async)\nPostgres: applies the actual change to the data files\n```\nIf the server crashes between \"WAL written\" and \"data file updated,\" Postgres replays the WAL on restart to redo the work — nothing is lost. This same WAL stream is also **how replication works** (Q34): a replica just receives and replays the same WAL records the primary generated, applying the exact same sequence of changes.\n\n## 34. Streaming replication vs. logical replication — what's the difference?\nBoth copy data from a primary to a replica, but at different levels.\n- **Streaming (physical) replication**: the replica receives the raw WAL byte stream (Q33) and replays it exactly — the replica becomes a byte-for-byte copy of the primary. Fast, simple, but all-or-nothing: you replicate the *entire* database/cluster, and the replica must be the same Postgres major version.\n- **Logical replication**: decodes the WAL into logical changes (`INSERT`/`UPDATE`/`DELETE` on specific tables) and replays those as SQL-level operations. Slower, but lets you replicate a subset of tables, replicate into a *different* schema/version, or even into a different database entirely (e.g. feeding a data warehouse for OLAP, Q27).\n```sql\n-- Logical replication: publish specific tables on the primary\nCREATE PUBLICATION order_events FOR TABLE orders, order_items;\n\n-- Subscribe from another Postgres instance\nCREATE SUBSCRIPTION order_events_sub\n    CONNECTION 'host=primary dbname=ecommerce'\n    PUBLICATION order_events;\n```\nStreaming replication is the default choice for read replicas/failover (Q35); logical replication is the choice when you need selective, cross-version, or cross-system data flow.\n\n## 35. What is replication lag, and what consistency problems does it cause?\nA replica applies WAL records **after** the primary already committed them — there's always some delay, even if tiny. During that window, a query against the replica can return **stale** data.\n\n**Real-life scenario:** `OrderService.placeOrder` writes to the primary, then the confirmation page immediately reads the order back — but the read is routed to a replica that hasn't caught up yet.\n```\nT0: Primary commits new Order row\nT0+50ms: Replica still hasn't applied it (lag)\nT0+10ms: Confirmation page reads from the replica → \"order not found\" or shows the pre-order state\n```\nThis is the classic **read-your-writes** consistency problem. Common fixes: route the *immediate* post-write read back to the primary (or a replica confirmed to be caught up), accept eventual consistency for things that can tolerate it (e.g. an analytics dashboard), or use a session-level guarantee (some setups stick a user's reads to the primary for N seconds after they write). This is a narrower, DB-specific version of the same trade-off CAP theorem (Q38) describes at the whole-system level.\n\n## 36. Two-phase commit (2PC) vs. the Saga pattern — when would you actually reach for 2PC?\nBoth coordinate a transaction across multiple databases/services, but with very different guarantees and costs.\n- **2PC**: a coordinator asks every participant to **prepare** (lock resources, confirm it *can* commit) and only tells everyone to actually **commit** once all participants say yes — genuinely atomic across systems, but every participant holds locks for the whole round-trip, and if the coordinator crashes mid-protocol, participants can be left blocked holding locks indefinitely (\"in-doubt\" transactions).\n- **Saga** (microservices notes Q19): each step commits locally and immediately; a failure triggers **compensating** actions to undo prior steps. No cross-system locks held, but there's a window where the system is genuinely in an intermediate state (Order created, Payment not yet confirmed) that other reads can observe.\n```\n2PC:   Prepare(A) → Prepare(B) → Prepare(C) → [all yes] → Commit(A) → Commit(B) → Commit(C)\n                                              → [any no]  → Abort(A) → Abort(B) → Abort(C)\n\nSaga:  Commit(A) → Commit(B) → Commit(C) succeeds, OR\n       Commit(A) → Commit(B) → Fail(C) → Compensate(B) → Compensate(A)\n```\nIn practice: 2PC is rare in microservices architectures precisely because of that locking/availability cost (a slow or dead participant blocks everyone) — it shows up more within a *single* database engine's internal distributed transaction handling, or specific XA-transaction integrations. Most microservice systems (this project's `OrderService.placeOrder` → Payment example, MCQ Q66) use sagas instead, trading strict cross-system atomicity for availability and accepting a brief inconsistent window that compensations resolve.\n\n## 37. `plan_cache_mode` and parameter sniffing — how can a cached query plan go wrong?\nFor a **prepared statement** run repeatedly with different parameter values, Postgres can either re-plan every execution (using the actual parameter values — \"custom plan\") or cache one **generic plan** after enough executions and reuse it regardless of the parameter values passed in.\n\n**Real-life scenario:** a query filtering `transactions` by `status` where 99% of rows are `'COMPLETED'` and 1% are `'DISPUTED'`.\n```sql\nPREPARE find_by_status (text) AS\nSELECT * FROM transactions WHERE status = $1;\n\nEXECUTE find_by_status('DISPUTED');    -- best plan: Index Scan (few matching rows)\nEXECUTE find_by_status('COMPLETED');   -- best plan: Seq Scan (most of the table matches anyway)\n```\nIf Postgres settles on a generic plan optimized for the *average* case, a query for the rare value (`'DISPUTED'`) can end up using a `Seq Scan` when an `Index Scan` would've been far cheaper, or vice versa — the plan doesn't adapt per call. `plan_cache_mode` (`auto` (default) / `force_custom_plan` / `force_generic_plan`) controls this trade-off: `force_custom_plan` re-plans every time (safer for skewed data, more planning overhead per call); `force_generic_plan` never re-plans (cheaper planning, risk of a bad plan for outlier parameter values). This is the Postgres-specific flavor of the more general \"parameter sniffing\" problem that also shows up in SQL Server/other engines with cached execution plans.\n\n## 38. How does the CAP theorem relate to choosing Postgres vs. a NoSQL store for a given feature?\nCAP says a **distributed** system can only fully guarantee two of **Consistency** (every read sees the latest write), **Availability** (every request gets a response), and **Partition tolerance** (the system keeps working despite network partitions between nodes) — and since network partitions can always happen, the real choice in practice is **CP vs. AP** when a partition occurs.\n\n- **A single-primary Postgres setup** (this repo's setup) is effectively **CP**: all writes go through one primary, so it's strongly consistent, but if the primary is unreachable, writes stop (you sacrifice availability rather than risk inconsistency).\n- **A multi-master or eventually-consistent store** (many NoSQL databases, some multi-region setups) leans **AP**: it stays available and accepts writes even during a partition, but different nodes can temporarily disagree, resolved later (eventual consistency) — the same lag/staleness idea as Q35, just as an explicit design choice rather than a side effect.\n\n**Where this matters practically in an e-commerce system:** `Order`/`Payment` data wants **CP** — you'd rather reject a checkout than silently lose consistency about whether payment happened. A `ProductView` counter or a recommendation cache can tolerate **AP** — showing a slightly stale \"1,204 views\" is harmless, and staying available matters more than perfect accuracy. This is exactly why a real system is rarely \"one database for everything\" — the CAP trade-off is made **per piece of data**, not once for the whole architecture.\n\n## 39. What is partition pruning, and how does it interact with query performance?\nWhen a table is partitioned (Q28), the planner can skip scanning partitions that **cannot possibly** contain matching rows, based on the `WHERE` clause and the partition key — this is pruning.\n```sql\nCREATE TABLE transactions (\n    transaction_id BIGINT,\n    transaction_date DATE,\n    amount DECIMAL(12,2)\n) PARTITION BY RANGE (transaction_date);\n\nCREATE TABLE transactions_2025 PARTITION OF transactions FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');\nCREATE TABLE transactions_2026 PARTITION OF transactions FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');\n\nEXPLAIN SELECT * FROM transactions WHERE transaction_date > '2026-06-01';\n-- Plan only touches transactions_2026 — transactions_2025 is pruned entirely, never scanned\n```\nPruning only works when the `WHERE` clause directly constrains the partition key with a comparable literal/parameter — wrapping the column in a function (`WHERE EXTRACT(YEAR FROM transaction_date) = 2026`, the same \"function on an indexed column\" mistake as Q16) defeats pruning just like it defeats a regular index, forcing every partition to be scanned. This is the mechanism that makes partitioning (rather than just indexing) worth it for genuinely huge time-series-style tables: entire partitions — potentially billions of rows — are skipped without even opening them.\n\n## 40. Application-level pooling (HikariCP) vs. an external pooler (PgBouncer) — when do you need both?\nHikariCP (Q26, this repo's default) pools connections **per application instance** — each pod holds its own pool of up to `maximum-pool-size` connections, all the way to the database. **PgBouncer** sits as a separate proxy *in front of* Postgres and pools connections **across every client**, including every app instance.\n\n**Real-life scenario:** this repo's own numbers from Q26 — `max_connections=100` on Postgres, HikariCP default of 10 per pod, scaled to 8 pods (`8 x 10 = 80`, uncomfortably close to the limit).\n```\nWithout PgBouncer:\n  8 pods x 10 HikariCP connections each = 80 real Postgres connections, always open\n\nWith PgBouncer (transaction pooling mode) in front of Postgres:\n  8 pods x 10 HikariCP connections each = 80 connections... to PgBouncer, not Postgres\n  PgBouncer multiplexes those onto a much smaller real pool to Postgres (e.g. 20),\n  handing out a real connection only for the duration of one transaction\n```\nThis matters because each real Postgres connection is a full OS process with real memory overhead — Postgres doesn't handle thousands of idle connections gracefully the way some other engines do. PgBouncer (or a managed equivalent) lets you scale to many more application instances/threads than `max_connections` would otherwise allow, by sharing a much smaller pool of *actual* database connections underneath. The trade-off: PgBouncer's transaction-pooling mode breaks session-level features that assume a connection is \"yours\" for the whole session (e.g. `SET` variables, `LISTEN`/`NOTIFY`, prepared statements across transactions) — worth checking against before adopting it blindly.\n\n## 41. Indexing vs. partitioning — what's the actual difference?\nBoth speed up queries on a large table, but in fundamentally different ways: an **index** adds a separate lookup structure alongside the data (the data itself doesn't move) to find specific rows fast; **partitioning** physically splits the table itself into smaller pieces so entire chunks can be skipped without even being opened.\n\n**বাংলায়:**\n- **Indexing** — টেবিলের আসল data একই জায়গায় থাকে, শুধু পাশে একটা আলাদা, ছোট lookup structure বানানো হয় (`CREATE INDEX idx_customer_id ON transactions (customer_id)`), যেটা বলে দেয় নির্দিষ্ট value কোন row-এ আছে — বইয়ের শেষের index পাতার মতো।\n- **Partitioning** — পুরো টেবিলটাকেই কোনো একটা column (যেমন date) অনুযায়ী আলাদা আলাদা physical টুকরায় ভেঙে ফেলা হয় (`PARTITION BY RANGE (transaction_date)`), তারপরও সবগুলো একটাই logical টেবিল নামে ব্যবহার করা যায় — বইটাকেই কয়েকটা খণ্ডে ভাগ করার মতো।\n\n| | Indexing | Partitioning |\n|---|---|---|\n| Data কোথায় থাকে | একই জায়গায়, পাশে lookup structure যোগ হয় | Data নিজেই আলাদা আলাদা টুকরায় ভাগ হয়ে যায় |\n| কী করে | নির্দিষ্ট row খুঁজে বের করা দ্রুত করে | পুরো টুকরা (লাখ লাখ row) স্কিপ করে বাদ দেয় (partition pruning, Q39) |\n| সংখ্যা | একটা টেবিলে অনেকগুলো index থাকতে পারে | একটা নির্দিষ্ট column দিয়েই partition হয় |\n\n**একসাথে ব্যবহার হয়, বিকল্প না:** বাস্তবে দুটোই একসাথে ব্যবহার হয় — একটা বিশাল টেবিল প্রথমে date দিয়ে partition করা হয় (বড় টুকরা skip করার জন্য), তারপর প্রতিটা partition-এর ভেতরেও `customer_id`-এর মতো column-এ index রাখা হয় (সেই টুকরার ভেতরে দ্রুত খুঁজতে) — একটা বড় চালুনি, আরেকটা ছোট চালুনি, দুইটা মিলেই কাজটা efficient হয়।\n"}, {"id": "docker", "title": "Docker and cloud native", "group": "DevOps", "path": "interview-questions/docker/docker-cloud-native-questions.md", "q": 40, "lines": 348, "md": "# Docker & Cloud-Native Development — Interview Questions\n\n40 questions on containerization and cloud-native practices, grounded in this repo's own `Dockerfile`, `docker-compose.yml`, `.github/workflows/docker-ci-cd.yml`, and `k8s/` manifests — real files, not hypothetical ones.\n\n## 1. What is Docker, and how is a container different from a VM?\nDocker packages an application with everything it needs to run (code, runtime, libraries, config) into a single, portable unit called an **image**, run as a **container**. A container shares the host machine's OS kernel, isolating only the process/filesystem/network — a VM instead virtualizes an entire machine, including its own OS kernel, which is why containers start in milliseconds and use a fraction of the memory a VM does.\n```\nVM:        Host OS → Hypervisor → Guest OS (full copy) → App\nContainer: Host OS → Container runtime → App (shares host kernel)\n```\n\n## 2. What is a Docker image vs. a container?\nAn **image** is a read-only template — a set of layered filesystem snapshots plus metadata (what command to run, what ports to expose). A **container** is a running (or stopped) *instance* of that image, with its own writable layer on top. The same image can be started as many independent containers at once — this repo's own image, `shihabmi7/ecommerce-api:latest` (`docker-ci-cd.yml`), is one image that could back any number of running containers.\n\n## 3. What is a Dockerfile? Walk through this repo's.\nA text file of instructions Docker follows to build an image, one layer per instruction.\n```dockerfile\nFROM maven:3.9.9-eclipse-temurin-17 AS build\nWORKDIR /app\nCOPY pom.xml .\nRUN mvn dependency:go-offline\nCOPY src ./src\nRUN mvn clean package\n\nFROM eclipse-temurin:17-jre-jammy\nWORKDIR /app\nCOPY --from=build /app/target/ecommerce_api-0.0.1-SNAPSHOT.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]\n```\nThis is a **multi-stage** build (Q5): stage 1 compiles the jar with the full Maven+JDK toolchain, stage 2 only copies the finished jar into a much smaller JRE-only image — the build tools never ship in the final image.\n\n## 4. What's the difference between `CMD` and `ENTRYPOINT`?\n`ENTRYPOINT` sets the fixed command that always runs when the container starts; `CMD` supplies default *arguments* to it (and can be fully overridden at `docker run` time, unlike `ENTRYPOINT`). This repo uses `ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]` — a fixed command, since this image only ever does one thing (run the jar). If it also had `CMD [\"--server.port=8080\"]`, someone could override just the argument (`docker run image --server.port=9090`) without needing to override the whole entrypoint.\n\n## 5. What is a multi-stage build, and why does this repo use one?\nA Dockerfile with more than one `FROM`, where a later stage can selectively `COPY --from=<earlier stage>` only the artifacts it needs — the earlier stage's tools/intermediate files never make it into the final image. This repo's stage 1 (`maven:3.9.9-eclipse-temurin-17`, several hundred MB with the full JDK + Maven) only exists to produce `app.jar`; stage 2 starts fresh from a slim `eclipse-temurin:17-jre-jammy` and copies in just that one file. The final image ships without Maven, the JDK compiler, or any source code — smaller, and a smaller attack surface.\n\n## 6. What are Docker image layers, and how does layer caching work?\nEach instruction in a Dockerfile (`FROM`, `COPY`, `RUN`, ...) produces a new, cached filesystem layer stacked on the previous one. On a rebuild, Docker reuses a cached layer **unchanged** as long as that instruction and everything before it are identical to the last build — the moment one instruction's input changes, that layer and every layer after it must be rebuilt from scratch.\n```\nFROM maven:...          [layer 1 — reused unless the base image changes]\nWORKDIR /app             [layer 2]\nCOPY pom.xml .            [layer 3 — reused unless pom.xml changed]\nRUN mvn dependency:go-offline  [layer 4 — reused unless layer 3 changed]\nCOPY src ./src            [layer 5 — invalidated on every code change]\nRUN mvn clean package     [layer 6 — always reruns after layer 5 changes]\n```\n\n## 7. Why does this repo `COPY pom.xml` before `COPY src`?\nThis is a real fix made in this repo's git history (`5eb7ea8 Split Dockerfile COPY to cache Maven dependencies separately`). Without the split, a single `COPY . .` means **any** source file change invalidates that layer — and every layer after it, including `mvn dependency:go-offline`, which re-downloads the entire Maven dependency tree from the internet on every single build. By copying only `pom.xml` first and running `dependency:go-offline` right after, that (slow, network-bound) layer stays cached across builds where only application code changed — `COPY src ./src` and `mvn clean package` are the only steps that re-run. This is the same caching principle as Q6, applied deliberately: **order Dockerfile instructions from least-frequently-changing to most-frequently-changing.**\n\n## 8. What is `.dockerignore`, and why does it matter?\nLike `.gitignore`, but for what gets sent to the Docker daemon as the **build context** (Q28) before the build even starts. This repo's `.dockerignore` excludes `.git`, `.idea`, `target/`, `k8s/`, `learning/`, `interview-questions/`, and `.env*` (except `.env.example`).\n```\n.env\n.env.*\n!.env.example\n.git\ntarget/\nk8s/\nlearning/\ninterview-questions/\n```\nTwo reasons this matters: **security** (secrets like a real `.env` must never even reach the build context, let alone get baked into a layer), and **speed** (a smaller context uploads to the daemon faster, and prevents irrelevant file changes — like editing a `.md` file in `interview-questions/`, which has nothing to do with the app — from invalidating build cache unnecessarily).\n\n## 9. `COPY` vs. `ADD` — which should you use?\n`COPY` does exactly one thing: copies files/directories from the build context into the image. `ADD` does that *plus* two extra, \"magic\" behaviors: it can fetch a remote URL, and it auto-extracts local `.tar` archives. The official Docker guidance (and this repo's own Dockerfile) is to default to `COPY` — its behavior is fully predictable, whereas `ADD`'s auto-extraction has caused real production surprises (a `.tar` file accidentally getting extracted when someone only meant to copy it as-is). Reach for `ADD` only for its one genuinely unique feature: extracting a local archive as part of the build.\n\n## 10. What does `EXPOSE` actually do, and how is it different from `-p`/`--publish`?\n`EXPOSE 8080` in a Dockerfile is **documentation only** — it tells anyone reading the image (and tools like `docker inspect`) which port the app listens on, but it does **not** open that port to the host. Actually making the port reachable from outside the container requires `-p`/`--publish` at run time:\n```bash\ndocker run -p 8080:8080 shihabmi7/ecommerce-api:latest\n#            ^host  ^container\n```\nWithout `-p`, the app inside the container is listening on 8080 just fine, but nothing on the host machine (or outside the container network) can reach it.\n\n## 11. What is a Docker registry? Docker Hub vs. a private registry.\nA registry stores and distributes images by name+tag (`shihabmi7/ecommerce-api:latest`). **Docker Hub** is the default public registry (`docker/login-action` + `docker/build-push-action` in this repo's `docker-ci-cd.yml` push there). Organizations with proprietary code typically run a **private registry** instead (AWS ECR, Google Artifact Registry, Azure ACR, or a self-hosted Harbor/Nexus) — same `docker push`/`docker pull` mechanics, just a different, access-controlled endpoint, and images never become publicly pullable by accident.\n\n## 12. Why is tagging an image `:latest` risky in production?\n`:latest` is just a regular, mutable tag, not a special \"always the newest\" marker — whoever pushes last to that tag overwrites what it points to. This repo's own `k8s/app/ecommerce_deployment.yaml` uses `image: shihabmi7/ecommerce-api:latest`, which means: a rollback is hard (there's no way to tell Kubernetes \"go back to the image that was `:latest` yesterday\" — that information is already gone), and `imagePullPolicy` behavior around `:latest` differs from a real version tag, sometimes re-pulling (or not) in ways that surprise people. The production-safe pattern is to tag every build with something immutable and traceable — a git SHA or semantic version (`ecommerce-api:a1b2c3d` or `:1.4.2`) — so a specific Deployment always points at one specific, unchanging image, and rolling back is just pointing the Deployment at an older tag.\n\n## 13. What is docker-compose, and what problem does it solve?\nA single YAML file (`docker-compose.yml`) describing a **multi-container application** — this repo's has three services: `mysql`, `rabbitmq`, and `springboot-app`. Instead of running three separate `docker run` commands by hand (remembering every port mapping, env var, and startup order each time), `docker-compose up` builds/starts all of them together, on a shared network, in one command. It's meant for local development and simple deployments — not a replacement for an orchestrator like Kubernetes at production scale (Q33).\n\n## 14. How do containers in the same docker-compose file talk to each other?\nBy **service name**, resolved via Docker's built-in DNS on the compose network — not `localhost`, and not the host machine's IP. This repo's `springboot-app` service connects to RabbitMQ with:\n```yaml\n- SPRING_RABBITMQ_HOST=rabbitmq   # the *service name* in docker-compose.yml, not localhost\n```\nInside the `springboot-app` container, `rabbitmq` resolves to whichever container Docker started for the `rabbitmq` service — each container in the compose file can reach every other one by its service name, as if it were a hostname.\n\n## 15. What does `depends_on` actually guarantee — and not guarantee?\nIt only controls **start order** (container creation order) — it does **not** wait for the dependency to actually be *ready* to accept connections. This repo's `springboot-app` has:\n```yaml\ndepends_on:\n  - rabbitmq\n  - mysql\n```\nThis guarantees the `rabbitmq`/`mysql` *containers* are started before `springboot-app`'s container starts — but MySQL's container process starting is not the same moment as MySQL actually being ready to accept connections (it still has its own internal startup/init time). A Spring Boot app that tries to connect immediately can still hit a connection refused error in the first few seconds. The real fix is either a retry/backoff on the app side (which Spring Boot's datasource does to a degree) or a proper healthcheck-based wait (`depends_on: condition: service_healthy`, requires a `HEALTHCHECK`, Q24) instead of relying on `depends_on` alone.\n\n## 16. How do you pass configuration/secrets into a container?\n**Environment variables** are the standard mechanism (this ties directly to the Twelve-Factor App's config-via-environment principle, Q39). This repo's `docker-compose.yml`:\n```yaml\nenvironment:\n  - SPRING_DATASOURCE_PASSWORD=root\n  - JWT_SECRET_KEY=${JWT_SECRET_KEY}   # pulled from the host shell / a local .env file, never hardcoded\n```\n`JWT_SECRET_KEY` is deliberately **not** hardcoded in the compose file — it's substituted from whatever's in the shell environment or a local `.env` file (excluded from the build context and from git via `.dockerignore`/`.gitignore`). For real production secrets at scale, a dedicated secret store (Kubernetes `Secret` — Q37, AWS Secrets Manager, Vault) is preferred over plain env vars, since env vars are visible via `docker inspect`/process listing on the host.\n\n**বাংলায় — AWS Secrets Manager থেকে production runtime-এ কীভাবে secret আনবে:** মূলত ৩টা উপায়:\n\n- **External Secrets Operator (Kubernetes/EKS-এ সবচেয়ে common)** — AWS Secrets Manager-এর value automatically sync করে একটা normal k8s `Secret`-এ কপি করে দেয়, app-এর code বা এই repo-র `envFrom: secretRef` pattern-এ কিচ্ছু বদলাতে হয় না:\n  ```yaml\n  apiVersion: external-secrets.io/v1beta1\n  kind: ExternalSecret\n  spec:\n    secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }\n    target: { name: ecommerce-secret }   # এই নামেই normal k8s Secret তৈরি হবে\n    data:\n      - secretKey: JWT_SECRET_KEY\n        remoteRef: { key: ecommerce/jwt-secret-key }\n  ```\n  Pod-কে AWS-এর সাথে authenticate করতে **IRSA** (IAM Roles for Service Accounts) লাগে — hardcoded AWS access key ছাড়াই, pod-এর নিজস্ব IAM role দিয়ে শুধু ওই নির্দিষ্ট secret পড়ার permission দেওয়া থাকে।\n\n- **App নিজে AWS SDK দিয়ে fetch করা** — secret কখনো env var হিসেবেই থাকে না, সরাসরি app-এর মেমোরিতে আসে:\n  ```properties\n  spring.config.import=aws-secretsmanager:ecommerce/jwt-secret-key\n  ```\n\n- **ECS `secrets` field** (Kubernetes ছাড়া plain ECS হলে) — task definition-এই ARN দিয়ে দাও, container শুরু হওয়ার আগেই ECS agent নিজে resolve করে env var বসিয়ে দেয়, কোনো code বদল লাগে না।\n\n**সহজ নিয়ম:** Kubernetes-এ থাকলে External Secrets Operator সবচেয়ে কম কোড বদলে কাজ করে (existing env-var pattern-ই রেখে দেয়); secret কখনো env var আকারে না আসুক এটা চাইলে app নিজে SDK দিয়ে fetch করাই ভালো।\n\n## 17. Docker volumes vs. bind mounts — difference and when to use each.\nBoth let a container persist/share data outside its own writable layer, but **volumes** are managed entirely by Docker (stored under Docker's own directory, portable, independent of host filesystem layout), while **bind mounts** point at a specific path on the host machine directly.\n```bash\ndocker run -v mysql_data:/var/lib/mysql mysql:8.3.0        # named volume — Docker manages the storage\ndocker run -v ./local-config:/etc/config:ro nginx           # bind mount — a specific host path\n```\nVolumes are the right default for a database's actual data (portable, works the same on any host); bind mounts are useful for local development (mounting your source code into a container for live-reload) or mounting a specific host config file in.\n\n**বাংলায় — কখন কোনটা:** **Volume** — যখন data সত্যিকারের persist করতে হবে আর host-এর exact folder নিয়ে ভাবতে চাও না (যেমন MySQL-এর data, Q18)। **Bind mount** — যখন host-এর একটা নির্দিষ্ট file/folder সরাসরি container-এ দেখাতে চাও (যেমন local dev-এ নিজের `src/` মাউন্ট করে live-reload, বা একটা নির্দিষ্ট config file দেওয়া)।\n\n## 18. Why would a container's data disappear on restart, and how do you prevent it?\nA container's own writable layer is **ephemeral** — `docker rm`/recreating the container discards it entirely. This repo's `docker-compose.yml` doesn't declare a named volume for `mysql`'s data directory, which means every `docker-compose down` (or a container recreation) loses all database data. The fix is mounting a volume onto MySQL's data path:\n```yaml\nmysql:\n  image: mysql:8.3.0\n  volumes:\n    - mysql_data:/var/lib/mysql\nvolumes:\n  mysql_data:\n```\nNow the actual data lives in the `mysql_data` volume, independent of the container's own lifecycle — recreating the container reattaches to the same data.\n\n## 19. What are Docker networks (bridge, host, none)?\n- **bridge** (the default): containers get their own private IP on an isolated virtual network; this is what lets docker-compose services reach each other by name (Q14).\n- **host**: the container shares the host machine's network stack directly — no isolation, no port mapping needed, but also no network isolation from the host.\n- **none**: the container gets no network access at all — useful for a batch job that only needs the filesystem, never the network.\n\nCompose creates a dedicated bridge network per project by default, which is why this repo's three services (`mysql`, `rabbitmq`, `springboot-app`) can resolve each other by service name without any manual network setup.\n\n**বাংলায়:**\n- **`bridge`** (default) — প্রতিটা container একটা নিজস্ব private IP পায় একটা isolated virtual network-এ; একই bridge network-এর container-রা একে অপরকে **service name দিয়ে** খুঁজে পায় (Q14) — Docker নিজে internal DNS চালায় ওই network-এর ভেতর।\n- **`host`** — container host machine-এর network সরাসরি ব্যবহার করে, নিজের আলাদা IP নেই, port mapping (`-p`) লাগে না — কিন্তু host-এর সাথে কোনো isolation থাকে না।\n- **`none`** — container-এর কোনো network access-ই নেই, সম্পূর্ণ বিচ্ছিন্ন — যেই কাজে network দরকারই নেই (একটা batch/file-processing job) সেখানে security-র জন্য ভালো।\n\n**Custom bridge network কীভাবে বানায়:**\n```bash\ndocker network create my-app-network          # নতুন bridge network তৈরি\ndocker run --network my-app-network --name mysql mysql:8.3.0\ndocker run --network my-app-network --name springboot-app my-app-image\n# এখন springboot-app কন্টেইনার থেকে \"mysql\" নামেই সেই container-কে খুঁজে পাওয়া যাবে\n```\n`docker-compose.yml` ব্যবহার করলে এটা manually করার দরকার নেই — Compose নিজে থেকেই প্রতিটা project-এর জন্য একটা dedicated bridge network বানিয়ে দেয় (এই repo-র ক্ষেত্রে ঠিক এটাই হচ্ছে), তাই `mysql`, `rabbitmq`, `springboot-app` কোনো manual network setup ছাড়াই একে অপরকে নামে খুঁজে পায়।\n\n## 20. How do you debug a running container?\n```bash\ndocker logs -f ecommerce-api-latest        # stream stdout/stderr from the app\ndocker exec -it ecommerce-api-latest sh    # get an interactive shell inside the running container\ndocker inspect ecommerce-api-latest        # full JSON: env vars, mounts, network settings, health status\ndocker stats ecommerce-api-latest          # live CPU/memory/network usage\n```\nFor a Spring Boot app specifically, `docker logs` is usually the first stop (the same stack trace you'd see running locally), and `docker exec -it ... sh` is useful when you need to check something *inside* the container's filesystem — e.g. confirming an env var actually made it in, or that `app.jar` is where you expect.\n\n## 21. `docker exec` vs. `docker attach` — what's the difference?\n`docker exec` starts a **brand-new process** inside an already-running container (e.g. a new shell alongside the app's own main process) — closing it doesn't affect the container's main process at all. `docker attach` instead connects your terminal directly to the container's **existing main process** (PID 1's stdin/stdout/stderr) — and pressing Ctrl+C there can send a signal that kills the container's main process, stopping the whole container. For debugging, `docker exec -it <container> sh` is almost always the safer, more common choice.\n\n## 22. Why does switching a Docker base image from a JDK to a JRE matter?\nThis is a real change in this repo's history (`bfada96 Fix offline build failure, switch runtime stage to JRE`). The **JDK** includes the compiler (`javac`) and other build-time tools; the **JRE** only includes what's needed to *run* an already-compiled `.jar`. Since this repo's final stage only ever runs `java -jar app.jar` (Q3) — it never compiles anything — shipping the full JDK in the runtime image is pure waste: a larger image (slower pulls/deploys), and a larger attack surface (more binaries an attacker could potentially abuse if they got a shell in the container). `eclipse-temurin:17-jre-jammy` is smaller and sufficient for exactly what the runtime stage needs to do.\n\n## 23. Base image choice — `eclipse-temurin` vs. Alpine vs. distroless. What's the trade-off?\n- **`eclipse-temurin:17-jre-jammy`** (this repo's choice): a full Ubuntu-based (glibc) userspace — bigger than Alpine, but maximally compatible (no glibc/musl surprises with native libraries) and easy to `docker exec` into with a normal shell for debugging.\n- **Alpine-based** (`eclipse-temurin:17-jre-alpine`): much smaller (Alpine uses musl libc, not glibc), but some Java native libraries/agents historically had subtle compatibility issues on musl — worth testing carefully before switching.\n- **Distroless** (Google's `gcr.io/distroless/java17`): no shell, no package manager, nothing but the JRE and the app — smallest attack surface possible, but you lose the ability to `docker exec ... sh` in for debugging entirely.\n\nThe right choice depends on what you're optimizing for: this repo's `jre-jammy` prioritizes easy debugging and compatibility over the last few MB of image size — a reasonable default until image size or attack surface actually becomes a measured problem.\n\n## 24. What is a `HEALTHCHECK` instruction, and why doesn't this repo's Dockerfile have one?\n`HEALTHCHECK` tells Docker how to actively probe whether the app *inside* the container is actually working — not just whether the process is still running (a hung/deadlocked JVM process still looks \"running\" to Docker without one).\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=3s CMD curl -f http://localhost:8080/actuator/health || exit 1\n```\nWithout it, `docker ps` only shows the container as \"Up\" based on the process being alive, and `depends_on: condition: service_healthy` (Q15) has nothing to check against. This repo doesn't have one — adding it would let `docker-compose`/an orchestrator distinguish \"the JVM process is running\" from \"the app is actually ready to serve traffic,\" the same gap Q38's readiness probe closes at the Kubernetes level.\n\n## 25. What are container restart policies?\n`--restart` (or `restart:` in compose) tells the Docker daemon what to do when a container's main process exits.\n- **`no`** (default): never restart automatically.\n- **`on-failure[:max-retries]`**: restart only if it exits with a non-zero (error) status.\n- **`always`**: always restart, even after `docker stop` followed by a daemon restart.\n- **`unless-stopped`**: like `always`, but respects an explicit manual `docker stop` (won't restart until manually started again).\n\nNeither this repo's `docker-compose.yml` nor its Dockerfile sets one, so the default (`no`) applies — a crash just leaves the container stopped rather than automatically recovering, which is a real gap for a production compose setup (though in Kubernetes, Q34's Pod/Deployment machinery handles this instead).\n\n## 26. How do you limit a container's CPU/memory usage, and why does it matter?\n```bash\ndocker run --memory=512m --cpus=1.0 shihabmi7/ecommerce-api:latest\n```\nWithout limits, a single misbehaving container (a memory leak, a runaway query) can consume all of the host's resources and starve every other container on the same machine — there's no isolation on resource *usage* by default, only on namespace/filesystem. In Kubernetes, this same idea is expressed as `resources.limits`/`resources.requests` per container in a Pod spec — this repo's `k8s/app/ecommerce_deployment.yaml` doesn't set any, meaning a single pod has no ceiling on what it can consume from its node, and the scheduler has no `requests` value to reason about when placing it.\n\n**বাংলায়:** Default-এ container-এর resource usage-এর কোনো ceiling নেই — Docker শুধু filesystem/namespace আলাদা করে, usage limit করে না। তাই একটা misbehaving container (memory leak, runaway query) পুরো host-এর resource খেয়ে ফেলে বাকি সব container-কে ক্ষতিগ্রস্ত করতে পারে, যদিও তাদের নিজেদের কোনো সমস্যা নেই।\n\nKubernetes-এ:\n```yaml\nresources:\n  requests:              # scheduler নিশ্চিত করে রাখে — pod বসানোর সময় এতটুকু আছে কিনা দেখে\n    memory: \"256Mi\"\n    cpu: \"250m\"\n  limits:                 # এর বেশি ব্যবহার করলে memory-তে OOM kill, CPU-তে throttle\n    memory: \"512Mi\"\n    cpu: \"500m\"\n```\nএই repo-র `k8s/app/ecommerce_deployment.yaml`-এ কোনোটাই সেট নেই — মানে pod-টার resource usage-এর কোনো ceiling নেই, আর scheduler-এর কাছেও কোনো `requests` value নেই বলে node-এ বসানোর সময় ঠিকভাবে হিসাব করে বসাতে পারে না। এটা মূলত bulkhead pattern-এর (microservices notes Q18) মতোই ধারণা — একটার resource আলাদা করে বেঁধে দেওয়া, যাতে সেটা বাকি সবকিছুকে না নিয়ে যায়।\n\n## 27. Why should containers run as a non-root user?\nBy default, the process inside a container runs as **root** unless told otherwise — and container isolation, while strong, is not a perfect security boundary (a container-escape vulnerability, or a mounted host path, can turn \"root inside the container\" into a real problem on the host). Best practice is to create and switch to an unprivileged user in the Dockerfile:\n```dockerfile\nRUN groupadd -r appuser && useradd -r -g appuser appuser\nUSER appuser\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]\n```\nThis repo's Dockerfile doesn't do this today — the app runs as root inside the container. It's a common, worthwhile hardening step: an attacker who compromises the running app is then constrained to an unprivileged user's permissions, not root, inside the container.\n\n**বাংলায়:** Default-এ container-এর ভেতরের process **root হিসেবেই চলে**, যদি না নিজে থেকে বলে দাও। এটা ঝুঁকিপূর্ণ দুইটা কারণে — (১) container-escape vulnerability হলে root থাকা মানে host-এও root-এর মতো ক্ষমতা পাওয়ার ঝুঁকি, আর (২) কোনো host path mount করা থাকলে (bind mount, Q17), compromised হলে root process সেই path-এ host-এর permission অনুযায়ী যা খুশি করতে পারবে — non-root user হলে অনেক বেশি সীমিত থাকতো। **মূল কথা:** attacker app compromise করলেও root-এ না থেকে একটা limited user-এর permission-এই আটকে থাকবে। এই repo-র Dockerfile-এ এখনো `USER` instruction নেই — app root হিসেবেই চলছে, এটা এখনো বাকি থাকা একটা সহজ hardening step।\n\n## 28. What is the \"build context,\" and why can a large one slow down builds?\nThe build context is the full set of files sent from your machine to the Docker daemon before the build starts — normally the directory you run `docker build .` from. Every `COPY`/`ADD` instruction can only reference files inside that context. A large context (an untrimmed `node_modules/`, `.git/` history, `target/` build output) has to be zipped up and transferred to the daemon on *every single build*, even for files that never get `COPY`'d into the image — this is exactly what `.dockerignore` (Q8) exists to trim down.\n\n**বাংলায়:** `docker build .` চালালে build শুরু হওয়ার **আগেই** ওই folder-এর সব ফাইল zip করে Docker daemon-এর কাছে পাঠানো হয় — এটাই build context। `COPY`/`ADD` শুধু এই context-এর ভেতরের ফাইলই access করতে পারে। সমস্যা হলো — যেই ফাইল কখনো `COPY` হবেই না (`.git/`, `target/`, `interview-questions/`), সেগুলোও **প্রতিবার** zip করে পাঠাতে হয়, শুধু একটা অপ্রাসঙ্গিক `.md` ফাইল বদলালেও — এতে build শুরু হতেই অযথা দেরি হয়। এই repo-র `.dockerignore` (Q8) ঠিক এই ফাইলগুলোই বাদ দিয়ে দেয়, তাই প্রতিবার শুধু আসলে দরকারি ফাইল (`src/`, `pom.xml`) পাঠানো হয়।\n\n## 29. `docker-compose up` vs. `docker-compose up --build` — what's the difference?\n`docker-compose up` starts containers from **already-built** images — if `springboot-app`'s image was built once and the Dockerfile/source hasn't changed since, Compose reuses the existing image as-is, even if you've since edited a source file. `docker-compose up --build` forces Compose to **rebuild** any service with a `build:` key (like `springboot-app: build: .` in this repo) before starting it — the command you actually want after changing application code, since otherwise you'd be running a stale image without realizing it.\n\n**বাংলায় — Diff:** `docker-compose up` আগে থেকে build করা image দিয়েই container চালায়, নতুন করে build করে না — code বদলালেও **নীরবে পুরনো (stale) image-ই চালাতে থাকবে**, কোনো warning ছাড়াই। `docker-compose up --build` চালু করার আগে `build:` key থাকা service-গুলোর image নতুন করে rebuild করে, তারপর সেই নতুন image দিয়ে চালায়। **সহজ নিয়ম:** application code বদলানোর পর সবসময় `--build` দাও, নাহলে পরিবর্তন reflect হবে না।\n\n## 30. What is Docker Buildx, and what problem does multi-arch solve?\nBuildx is Docker's extended build engine (`docker/setup-buildx-action` in this repo's `docker-ci-cd.yml`) that, among other things, supports building a single image manifest that works across **multiple CPU architectures** (`linux/amd64`, `linux/arm64`) in one build:\n```bash\ndocker buildx build --platform linux/amd64,linux/arm64 -t shihabmi7/ecommerce-api:latest --push .\n```\nWithout multi-arch, an image built on an Intel/AMD CI runner won't run on an Apple Silicon Mac or an ARM-based cloud instance (AWS Graviton) without emulation. This repo's CI doesn't currently set `--platform`, so it builds for the runner's own architecture (amd64) only — worth knowing as the next natural improvement if the image needs to run on ARM infrastructure.\n\n## 31. Walk through what happens in this repo's CI pipeline, from `git push` to a running container.\n`.github/workflows/docker-ci-cd.yml`, on a push/PR to `main`:\n```\n1. test job:        checkout → set up JDK 17 → ./mvnw test -Dspring.profiles.active=test\n2. docker-build-and-push job (needs: test, so it only runs if tests pass):\n     checkout → docker/setup-buildx-action → docker/login-action (Docker Hub)\n     → docker/build-push-action (builds the Dockerfile, tags :latest, pushes to Docker Hub)\n```\nNote this is CI (build/test/publish the image) but **not CD** in the \"auto-deploy\" sense despite the workflow's name — nothing in this workflow actually applies the `k8s/` manifests or restarts a running deployment; the image is published and ready to be pulled, but rolling it out to an actual cluster would need a separate step (`kubectl set image` / `kubectl apply` / an ArgoCD sync, etc.) that isn't part of this file today.\n\n## 32. What is cloud-native development?\nAn approach to building and running applications designed from the start to run well in dynamic, distributed, cloud environments — rather than a traditional app just lifted onto a cloud VM unchanged. The commonly cited pillars: **containerization** (Docker — package once, run identically anywhere), **microservices** (independently deployable services, `microservices-communication-questions.md`), **dynamic orchestration** (Kubernetes managing scaling/healing/scheduling, Q33), and **CI/CD automation** (Q31's pipeline — build, test, and ship automatically, repeatedly, without manual steps). This repo touches every one of these: it's containerized (`Dockerfile`), has a CI pipeline (`docker-ci-cd.yml`), and has Kubernetes manifests (`k8s/`) ready to deploy it as an orchestrated workload.\n\n## 33. Why do you need an orchestrator like Kubernetes on top of Docker?\nDocker (and docker-compose) runs containers on **one machine**. An orchestrator answers the questions that appear the moment you have many containers across many machines: which machine runs which container, what happens when a container crashes (restart it — automatically, without a human), how do you roll out a new version without downtime, how do you scale from 1 to 10 replicas on demand, and how do services find each other across machines whose IPs change constantly. Kubernetes' `Deployment` (Q35) + `Service` (Q36) objects are exactly the abstractions that answer these — this repo's own `k8s/app/ecommerce_deployment.yaml` + `ecommerce_service.yaml` are a (currently minimal, single-replica) example of exactly this.\n\n## 34. What is a Kubernetes Pod, and how does it relate to a Docker container?\nA Pod is Kubernetes' smallest deployable unit — usually wrapping **one** container (this repo's `ecommerce` container is the only one in its Pod template), though a Pod can hold multiple tightly-coupled containers that must share the same network namespace and lifecycle (a \"sidecar,\" e.g. a log-shipper next to the main app). Kubernetes never schedules a bare container directly — it always schedules Pods, and Docker (or another container runtime) is just the engine Kubernetes calls underneath to actually run the container(s) inside that Pod.\n\n## 35. Deployment vs. Pod vs. ReplicaSet — how do they relate?\n```\nDeployment  (you manage this — desired state: \"run this image, this many replicas\")\n    │  creates/manages\n    ▼\nReplicaSet  (ensures exactly N Pods matching a label selector exist, replaces any that die)\n    │  creates/manages\n    ▼\nPod(s)      (the actual running container(s))\n```\nYou essentially never create a Pod or ReplicaSet directly — you declare a `Deployment` (like this repo's `ecommerce_deployment.yaml`, `replicas: 1`), and Kubernetes creates a `ReplicaSet` to satisfy it, which in turn creates the Pod(s). If a Pod crashes, the ReplicaSet notices the count has dropped below what the Deployment asked for and creates a replacement — this is the self-healing Q33 references, and it's also what makes a rolling update work: a new `Deployment` spec creates a *new* ReplicaSet alongside the old one, gradually shifting Pods from old to new.\n\n## 36. What is a Kubernetes Service, and why can't Pods be reached directly?\nPods are ephemeral — they get a new IP every time they're recreated (a crash, a rollout, a reschedule), so nothing should ever hardcode a Pod's IP. A `Service` gives a **stable** virtual IP/DNS name that load-balances traffic across whichever Pods currently match its label selector, regardless of how many times those Pods have been recreated underneath it.\n```yaml\n# k8s/app/ecommerce_service.yaml (this repo, abbreviated)\napiVersion: v1\nkind: Service\nspec:\n  type: NodePort              # exposes it on a fixed port on every node, not just inside the cluster\n  selector:\n    app: ecommerce             # matches the Deployment's Pod label\n  ports:\n    - port: 8080                # the Service's own port, reachable inside the cluster\n      targetPort: 8080          # the container port in the Pod\n      nodePort: 30036           # reachable from outside the cluster at <node-ip>:30036\n```\nOther in-cluster services (or an Ingress) talk to `ecommerce-service:8080`, never to an individual Pod's IP — exactly the same DNS-by-name idea as docker-compose service names (Q14), just at cluster scale instead of one host. This repo specifically uses `NodePort` (rather than the more common `ClusterIP`, which is cluster-internal only) so the app is also reachable directly from outside the cluster without needing a separate Ingress/LoadBalancer set up — a reasonable choice for a simple/dev setup, though a real production deployment would more typically put an Ingress or LoadBalancer Service in front instead.\n\n## 37. ConfigMap vs. Secret in Kubernetes — what's the difference?\nBoth inject configuration into a Pod as env vars or mounted files, without baking values into the image. A **ConfigMap** is for non-sensitive config (a log level, a feature flag); a **Secret** is for sensitive values (passwords, API keys, tokens) — stored base64-encoded (not encrypted by default at rest, unless the cluster has encryption-at-rest configured) and access-controlled separately via RBAC. This repo's `k8s/app/ecommerce_secret.yaml` supplies the app's env vars this way:\n```yaml\n# ecommerce_deployment.yaml\nenvFrom:\n  - secretRef:\n      name: ecommerce-secret\n```\nThis repo's actual `ecommerce_secret.yaml` carries `MYSQL_USER`, `MYSQL_PASSWORD`, `RABBITMQ_USER`, `RABBITMQ_PASSWORD`, and `JWT_SECRET_KEY` (the last a placeholder value with a comment instructing you to generate a real one via `kubectl create secret` rather than editing the git-tracked file directly) — the Deployment manifest itself never contains a literal secret value, mirroring the same env-var-driven config approach as the local docker-compose setup (Q16).\n\n## 38. Liveness probe vs. readiness probe — and what's missing in this repo's deployment?\n- **Liveness probe**: \"is this container still alive/functioning?\" — if it fails repeatedly, Kubernetes **kills and restarts** the container.\n- **Readiness probe**: \"is this container ready to receive traffic *right now*?\" — if it fails, Kubernetes stops routing Service traffic to that Pod (Q36), but does **not** restart it; the Pod stays up and can become ready again later (e.g. still warming up a cache).\n```yaml\nlivenessProbe:\n  httpGet: { path: /actuator/health/liveness, port: 8080 }\nreadinessProbe:\n  httpGet: { path: /actuator/health/readiness, port: 8080 }\n```\nThis repo's `k8s/app/ecommerce_deployment.yaml` has **neither** — meaning Kubernetes has no way to know if the app has actually finished starting (traffic could be routed to a Pod before Spring Boot has finished initializing), and no way to detect a hung/deadlocked-but-still-running JVM and automatically restart it. Adding both is one of the most impactful small changes this deployment is missing, and it's what a rolling update or a graceful shutdown (referenced in the MCQ file's Q76) actually needs to coordinate against.\n\n## 39. The Twelve-Factor App methodology — which factors does this repo already follow?\nA widely-referenced set of practices for building cloud-native, horizontally-scalable apps. A few, checked against this repo directly:\n- **III. Config in the environment** — ✅ `JWT_SECRET_KEY`, DB credentials, RabbitMQ host all come from env vars (`application.properties` uses `${...}` placeholders, Q16), never hardcoded.\n- **VI. Processes are stateless** — ✅ this app keeps no in-memory session state between requests; auth is a stateless JWT (see `jpa-fetching-questions.md`/security notes), so any replica can serve any request.\n- **V. Strictly separate build and run stages** — ✅ exactly what the multi-stage Dockerfile (Q5) does: build once, run the same artifact everywhere.\n- **XI. Logs as event streams** — ✅ the app logs to stdout/stderr (`docker logs`, Q20 picks it up directly) rather than managing its own log files.\n- **IX. Disposability — fast startup, graceful shutdown** — ⚠️ partial: Spring Boot 3.4's graceful shutdown default helps, but without a readiness probe (Q38) or `terminationGracePeriodSeconds` set in the Deployment, Kubernetes can't fully coordinate a clean rollout.\n\n## 40. Horizontal scaling in Kubernetes — what can break if you just bump `replicas` without checking the app first?\n`replicas: 3` in a `Deployment` is easy to change, but it doesn't make an app horizontally scalable on its own — it just runs more copies of whatever the app already is, including whatever *isn't* actually shared correctly. Two concrete failure modes, both already covered elsewhere in these notes:\n- **Database connection exhaustion**: each Pod gets its own connection pool (HikariCP default of 10, `relational-db-basics.md` Q26/Q40) — `replicas x pool size` must stay under Postgres's `max_connections`, or new Pods start failing to connect the moment you scale out.\n- **Per-instance state that should be shared**: an in-memory rate limiter or cache counted *per pod* effectively multiplies its limit by the replica count, since each Pod tracks its own count independently (the same shape of bug as the MCQ file's Q80) — anything meant to be a single, global limit has to live in a shared store (Redis) instead of a JVM field, or it silently stops meaning what it's supposed to mean the moment there's more than one replica.\n\nThis repo's `k8s/app/ecommerce_deployment.yaml` currently runs `replicas: 1` — scaling it up is a one-line change, but doing so safely means first confirming nothing in the app (or its Hikari pool sizing) implicitly assumed \"there's only ever one of me.\"\n"}, {"id": "concurrency", "title": "Java concurrency", "group": "Java", "path": "interview-questions/java/java-concurrency-questions.md", "q": 24, "lines": 263, "md": "# Java Concurrency & Multithreading — Interview Questions\n\n24 questions on thread safety, locking, thread pools, and async patterns in Java. Grounded where possible in this repo's own code — the real race-condition bug fixed in `CartService.addToCart` (git history: `a426c6a`), and the singleton-bean scope of `JwtService`/every `@Service` in this app. Pairs with `relational-db-basics.md` (Q11 deadlock, Q1 MVCC) for the *database*-level side of concurrency, and the MCQ file's Q55-60 for the Spring/JPA-specific concurrency scenarios.\n\n## 1. What is a race condition?\nTwo or more threads access shared, mutable state at the same time, and the final result depends on the unpredictable order they happen to interleave in — code written as if \"check, then act\" always completes as one atomic step, when it actually doesn't.\n\n**Real bug, this repo:** `CartService.addToCart`, before the fix in commit `a426c6a`:\n```java\n// Thread 1 and Thread 2, running at the same time, for the same (user, product):\nOptional<Cart> existing = cartRepository.findByUserIdAndProductId(userId, productId);\n// BOTH threads see \"empty\" — neither has inserted yet\nif (existing.isEmpty()) {\n    cartRepository.save(new Cart(...));   // BOTH insert — two separate rows for the same product\n}\n```\nThis is the classic **check-then-act** race: the check and the act are two separate steps, and nothing stops another thread from running its own check in the gap between this thread's check and its act. See Q9 for why `synchronized` alone doesn't fix this particular bug, and `jpa-fetching-questions.md`/the MCQ file for the actual fix (a DB-level unique constraint).\n\n## 2. Process vs. thread — what's the actual difference?\nA **process** is an independent running program with its own memory space — two processes can't directly read each other's variables. A **thread** is a unit of execution *within* a process, and every thread in the same process **shares** that process's heap memory (objects, static fields) — which is exactly why race conditions (Q1) are possible: two threads can see and mutate the very same object.\n```\nProcess (JVM instance)\n ├── Thread 1 ─┐\n ├── Thread 2 ─┼─► all share the same heap (objects, static fields)\n └── Thread 3 ─┘   each has its OWN stack (local variables, call frames)\n```\nLocal variables are thread-safe by default (each thread's stack is private); instance/static fields are not, unless you make them so.\n\n## 3. What is thread safety, concretely?\nCode is thread-safe if it behaves correctly no matter how many threads call it concurrently, and no matter how their operations happen to interleave — without needing the caller to add any external synchronization. A method that only touches local variables is automatically thread-safe (Q2); a method that reads-then-writes a shared field is not, unless it takes explicit measures (locking, atomics, immutability) to make that read-then-write behave as one atomic unit.\n\n## 4. `synchronized` — method vs. block, and what does it actually lock?\n`synchronized` makes a block of code **mutually exclusive** — only one thread can be inside a given lock's protected region at a time; every other thread trying to enter blocks until the first one exits.\n```java\npublic synchronized void increment() { count++; }\n// equivalent to:\npublic void increment() {\n    synchronized (this) {   // locks on \"this\" — the instance\n        count++;\n    }\n}\n\npublic static synchronized void staticMethod() { ... }\n// equivalent to locking on ClassName.class (the Class object) — shared across ALL instances\n```\nAn instance method locks on `this` (so two threads calling `increment()` on the *same* object are serialized, but on two *different* objects they run in parallel, uncontended). A static method locks on the `Class` object itself — shared across every instance, a much wider lock. A `synchronized(someObject)` block lets you lock on any object explicitly — useful for locking a smaller, specific region rather than the whole method.\n\n## 5. Why wouldn't `synchronized` have fixed the `CartService.addToCart` race condition?\nBecause `synchronized` only coordinates threads **inside one JVM process**. This app runs as multiple pods/replicas (see `docker-cloud-native-questions.md` Q40, and the MCQ file's own Q58 asks this exact question) — each replica is its own JVM with its own, completely separate lock. Two concurrent \"add to cart\" requests landing on *different* pods would each acquire their *own* uncontended lock and race exactly as before.\n```\nPod 1's JVM: synchronized lock A  ─┐\n                                    ├─  two DIFFERENT locks — no coordination between them at all\nPod 2's JVM: synchronized lock B  ─┘\n```\nThis is exactly why the real fix in this repo is a **database-level unique constraint** (Q1) rather than an in-JVM lock — the database is the one thing every replica genuinely shares, so it's the only place a cross-instance guarantee can actually live. `synchronized`/`ReentrantLock` (Q8) are the right tool only when every thread that could race is guaranteed to be in the same JVM.\n\n## 6. What does `volatile` actually guarantee?\n`volatile` guarantees **visibility** — a write to a `volatile` field by one thread is immediately visible to every other thread's next read of it, instead of a thread potentially reading a stale, cached copy from its own CPU core. It does **not** guarantee atomicity.\n```java\nprivate volatile boolean shuttingDown = false;\n\n// Thread A: shuttingDown = true;      // every other thread sees this immediately\n// Thread B: while (!shuttingDown) { doWork(); }   // reliably notices the flag flip\n\nprivate volatile int counter = 0;\n// counter++ is STILL NOT thread-safe with volatile — it's really\n// \"read counter, add 1, write counter\" — three steps, and two threads\n// can both read the same old value before either writes back (Q1's race, just here)\n```\n`volatile` is the right tool for a simple flag one thread sets and others just read (like a shutdown signal). For \"read-modify-write\" operations like `counter++`, you need an atomic class (Q7) or a lock (Q4/Q8), not just `volatile`.\n\n## 7. What are the atomic classes, and how do they avoid locking?\n`java.util.concurrent.atomic` (`AtomicInteger`, `AtomicLong`, `AtomicReference`, ...) provide lock-free, thread-safe read-modify-write operations, built on a CPU instruction called **compare-and-swap (CAS)**.\n```java\nAtomicInteger counter = new AtomicInteger(0);\ncounter.incrementAndGet();   // atomic — no race, no explicit lock taken\n\n// what CAS is actually doing under the hood, conceptually:\n// \"if the current value is still what I last read, swap it for the new value;\n//  if someone else changed it in the meantime, retry the whole operation\"\n```\nCAS is optimistic (much like `@Version` optimistic locking at the DB level, `relational-db-basics.md`) — instead of blocking other threads out (a lock), it just retries if it detects it was beaten to the write. For simple counters/flags, this is generally faster than `synchronized` under moderate contention, since no thread ever actually blocks/sleeps.\n\n## 8. `ReentrantLock` vs. `synchronized` — when would you reach for the explicit lock?\n`ReentrantLock` (`java.util.concurrent.locks`) does the same mutual-exclusion job as `synchronized`, but as an explicit object you call `.lock()`/`.unlock()` on, which unlocks a few things `synchronized` can't do:\n```java\nprivate final ReentrantLock lock = new ReentrantLock();\n\npublic void doWork() {\n    if (lock.tryLock()) {          // synchronized has NO equivalent — can't \"try and give up\"\n        try { /* critical section */ }\n        finally { lock.unlock(); }  // MUST unlock manually — synchronized does this automatically\n    } else {\n        // couldn't get the lock immediately — do something else instead of blocking forever\n    }\n}\n```\nConcretely, reach for `ReentrantLock` when you need: `tryLock()` (attempt without blocking, or with a timeout), interruptible lock acquisition, or fairness (`new ReentrantLock(true)` — first-come-first-served rather than the JVM picking an arbitrary waiting thread). The trade-off is that you must remember to `unlock()` in a `finally` block yourself — `synchronized` releases automatically even if an exception is thrown, so for the common case it's less error-prone.\n\n## 9. Deadlock at the thread level — the four conditions, and how it's avoided.\nTwo or more threads are each waiting on a lock the other one holds, so neither can ever proceed — the exact same *shape* of problem as `relational-db-basics.md` Q11's database deadlock, just between Java locks instead of database row locks. Classic four conditions (all must hold simultaneously for deadlock to occur): **mutual exclusion** (a lock can only be held by one thread), **hold and wait** (a thread holds one lock while waiting for another), **no preemption** (a lock can't be forcibly taken away), and **circular wait** (a cycle of threads each waiting on the next).\n```java\n// Thread 1                          // Thread 2\nsynchronized (lockA) {               synchronized (lockB) {\n    synchronized (lockB) { ... }         synchronized (lockA) { ... }   // deadlock if both reach here\n}                                     }\n```\nThe practical fix — exactly the same one from the database side
