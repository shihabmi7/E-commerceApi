# NOTE: application.properties now requires JWT_SECRET_KEY (security.jwt.secret-key
# has no default and the app fails fast at startup without it) — added below so this
# Deployment's `envFrom: secretRef: ecommerce-secret` still supplies it.
# CHANGEME-* below is a placeholder, not a usable value — replace it before applying,
# e.g. `kubectl create secret generic ecommerce-secret --from-literal=JWT_SECRET_KEY=$(openssl rand -base64 32) ...`
# rather than editing this file with a real value (this manifest is git-tracked).
apiVersion: v1
kind: Secret                            # Secret stores sensitive key-value data
metadata:
  name: ecommerce-secret                # The name used to reference this Secret
type: Opaque                            # Generic key-value secret (default type)
stringData:
  MYSQL_USER: ecommerce_user            # MySQL username
  MYSQL_PASSWORD: ecommerce_pass        # MySQL password
  RABBITMQ_USER: ecommerce_mq_user      # RabbitMQ username
  RABBITMQ_PASSWORD: ecommerce_mq_pass  # RabbitMQ password
  JWT_SECRET_KEY: CHANGEME-generate-with-openssl-rand-base64-32
