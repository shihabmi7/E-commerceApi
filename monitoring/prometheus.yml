global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /actuator/prometheus
    static_configs:
      # Default (docker compose up): the app runs as a container named 'springboot-app'.
      # App running in IntelliJ / mvn spring-boot:run instead? Use prometheus-host.yml.
      - targets: ['springboot-app:8080']
