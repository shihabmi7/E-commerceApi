# One command runs everything:
#
#   cp .env.example .env        (once; then set JWT_SECRET_KEY inside .env)
#   docker compose up -d --build
#
# Services: postgres, rabbitmq, springboot-app, prometheus, grafana
# Guide: docs/monitoring-setup.md

services:
  # ---------- Database ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"                   # host 5433 -> container 5432 (5433 so it never clashes with a Postgres you already run on 5432)
    volumes:
      - postgres-data:/var/lib/postgresql/data   # keeps your data when containers are removed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Message queue ----------
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"                   # app connects here
      - "15672:15672"                 # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Backend ----------
  springboot-app:
    build: .                          # builds the image from the Dockerfile in this folder
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy    # wait until the database accepts connections
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      # Required login-token key. Put it in .env (see .env.example). Generate: openssl rand -base64 32
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env first (cp .env.example .env)}
    restart: unless-stopped

  # ---------- Monitoring ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      # Default: collects from the app container. Running the app in IntelliJ instead?
      #   PROMETHEUS_CONFIG=prometheus-host.yml docker compose up -d postgres rabbitmq prometheus grafana
      - ./monitoring/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"                   # Prometheus UI: http://localhost:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Prometheus reach an app running on your machine

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"                   # Grafana UI: http://localhost:3000 (admin / admin)
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
